  return fetch('https://graphql.anilist.co', {method:'POST', headers:{'Content-Type':'application/json', Accept:'application/json'}, body:JSON.stringify({query:query, variables:{q:w.name, t:mtype}})})
    .then(function(r){ return r.json(); }).then(function(d){
      var m = d && d.data && d.data.Media; if(!m) return null;
      var t = m.title || {};

function wkLoad(){
  var w = WK, type = wkType(), key = wkKey(), my = w.seq;
  w.info = wkCacheGet(key) || {sum:'', sumRank:0, banner:'', groups:[], done:false};
  w.stats = null; w.statsDone = false;
  wkStatsLoad(my);
  if(type === 'none' || w.info.done){ w.info.done = true; wkPaint(); return; }
  wkInfoLoad(my, type, key);
}
function wkInfoLoad(my, type, key){
  var w = WK, info = w.info;
  function add(p){
    if(!p || WK.seq !== my) return;
    if(p.banner && !info.banner) info.banner = p.banner;
    if(p.sum && (p.sumRank || 1) > (info.sumRank || 0)){ info.sum = p.sum; info.sumRank = p.sumRank || 1; }
    (p.groups || []).forEach(function(g){
      if(!g.people || !g.people.length) return;
      if(!info.groups.some(function(x){ return x.k === g.k; })) info.groups.push(g);
    });
    info.groups.sort(function(a, b){ return wkOrder(a.k) - wkOrder(b.k); });
    wkPaint();
  }
  var run = function(fn, arg){ return pxTimeout(fn(w, arg), 12000).then(add, function(){}); };
  var raw = wkRawSrc(), jobs;
  if(raw === 'anime') jobs = [run(wkAni, 'ANIME'), run(wkWiki, type)];
  else if(type === 'tv') jobs = [run(wkTvmaze), run(wkWiki, type)];
  else if(type === 'comic') jobs = [run(wkAni, 'MANGA'), run(wkWiki, type)];
  else jobs = [run(wkWiki, type)];
  Promise.all(jobs).then(function(){
    if(WK.seq !== my) return;
    if(type === 'tv' && raw !== 'anime' && !info.groups.length) return run(wkAni, 'ANIME');
  }).then(function(){
    if(WK.seq !== my) return;
    info.done = true;
    if(info.groups.length || info.sum || info.banner) wkCachePut(key, info);
    wkPaint();
  });
}

function wkStatsLoad(my){
  var w = WK;
  if(!sbc || !CL.uid){ w.statsDone = true; return; }
  var mid = MAINS.some(function(m){ return m[0] === w.cat; }) ? w.cat : null;
  Promise.resolve(sbc.rpc('work_stats', {p_name:w.name, p_cat:mid})).then(function(r){
    if(!r || r.error) throw (r && r.error) || new Error('rpc');
    var d = Array.isArray(r.data) ? r.data[0] : r.data;
    if(!d) throw new Error('empty');
    return {fin:+d.finished || 0, tot:+d.total || 0, rated:+d.rated || 0, avg:d.avg_rating == null ? null : +d.avg_rating, exact:true};
  }).catch(function(){
    return Promise.resolve(sbc.from('items').select('status,rating').eq('name', w.name).limit(1000)).then(function(r){
      if(!r || r.error) throw (r && r.error) || new Error('q');
      var rows = r.data || [], fin = 0, rated = 0, sum = 0;
      rows.forEach(function(i){ if(i.status === 'done'){ fin++; if(+i.rating > 0){ rated++; sum += +i.rating; } } });
      return {fin:fin, tot:rows.length, rated:rated, avg:rated ? sum / rated : null, exact:false};
    });
  }).then(function(s){
    if(WK.seq !== my) return; WK.stats = s; WK.statsDone = true; wkPaint();
  }, function(){
    if(WK.seq !== my) return; WK.statsDone = true; wkPaint();
  });
}

function prGen(){
  var A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', b = new Uint8Array(10), o = '';
  try{ crypto.getRandomValues(b); }catch(e){ for(var i = 0; i < 10; i++) b[i] = Math.floor(Math.random() * 256); }
  for(var j = 0; j < 10; j++){ o += A[b[j] % A.length]; if(j === 4) o += '-'; }
  return o;
}

/* ----- الذاكرة: ما شاهده المستخدم مؤخراً على الرئيسية يتأخر في الظهور ----- */
function dsSeen(){
  if(!DSC.seen){ try{ DSC.seen = JSON.parse(pxGet('mr_seen30') || '[]') || []; }catch(e){ DSC.seen = []; } }
  return DSC.seen;
}
function dsSeenAdd(titles){
  var s = dsSeen(); titles.forEach(function(t){ var k = normT(t); if(k && s.indexOf(k) < 0) s.push(k); });
  if(s.length > 700) s.splice(0, s.length - 700);
  pxSet('mr_seen30', JSON.stringify(s));
}
function dsFinish(list){
  var own = recOwn(), sn = dsSeen(), seen = {}, fresh = [], old = [];
  (list || []).forEach(function(r){
    var k = normT(r.title); if(!k || !r.img || own[k] || seen[k]) return; seen[k] = 1;
    (sn.indexOf(k) < 0 ? fresh : old).push({title:r.title, sub:r.sub || '', img:r.img, fb:r.fb || ''});
  });
  return fresh.concat(old).slice(0, 18);
}

/* ----- اختيار الأقسام وجلبها ----- */
function dsPick(){
  var pool = DS.filter(function(d){ return dsOk(d.kind); });
  var fresh = pool.filter(function(d){ return DSC.last.indexOf(d.id) < 0; });
  if(fresh.length >= DS_PER + 4) pool = fresh;
  pool = shuf(pool);
  var out = [], cnt = {};
  pool.forEach(function(d){ if(out.length < DS_PER && (cnt[d.kind] || 0) < 3){ cnt[d.kind] = (cnt[d.kind] || 0) + 1; out.push(d); } });
  pool.forEach(function(d){ if(out.length < DS_PER && out.indexOf(d) < 0) out.push(d); });
  return {use:out, spare:pool.filter(function(d){ return out.indexOf(d) < 0; })};
}
function dsKey(){ return 'mr_dsc30_' + (CL.uid || 'x'); }
function dsSave(){
  try{
    var bl = DSC.order.map(function(k){ return DSC.blocks[k]; }).filter(function(b){ return b && b.st === 'ok'; });
    pxSet(dsKey(), JSON.stringify({t:DSC.t, blocks:bl.map(function(b){ return {key:b.key, id:b.id, kind:b.kind, cid:b.cid, items:b.items, lay:b.lay}; })}));
  }catch(e){}
}
function dsRestore(){
  if(DSC.uid === (CL.uid || 'x') && DSC.order.length) return;
  DSC.uid = CL.uid || 'x'; DSC.blocks = {}; DSC.order = []; DSC.t = 0;
  try{
    var c = JSON.parse(pxGet(dsKey()) || 'null');
    if(c && c.blocks && c.blocks.length){
      DSC.t = c.t || 0;
      c.blocks.forEach(function(b){
        var d = DS.filter(function(x){ return x.id === b.id; })[0]; if(!d) return;
        DSC.blocks[b.key] = {key:b.key, id:b.id, kind:b.kind, cid:b.cid, ar:d.ar, en:d.en, items:b.items || [], lay:b.lay || '', st:'ok'};
        DSC.order.push(b.key);
      });
      DSC.fresh = DSC.order.length > 0;
    }
  }catch(e){}
}
function dsTitleOf(b){ return L(b.ar, b.en); }
function dsFill(key){
  if(view !== 'home') return;
  var el = document.getElementById('dsb-' + key); if(!el) return;
  var b = DSC.blocks[key];
  if(!b || b.st === 'fail'){ el.parentNode && el.parentNode.removeChild(el); return; }
  var h = dsBlockHTML(b), tmp = document.createElement('div'); tmp.innerHTML = h;
  if(tmp.firstChild) el.parentNode.replaceChild(tmp.firstChild, el);
}
function dsRoll(){
  var pk = dsPick(); if(!pk.use.length) return;
  var my = ++DSC.seq; DSC.busy = true; DSC.exp = {}; DSC.blocks = {}; DSC.order = []; DSC.uid = CL.uid || 'x';
  DSC.last = pk.use.map(function(d){ return d.id; });
  var spare = pk.spare.slice(), live = 0, pending = 0;
  function mk(d, i){
    var key = d.id + '_' + Date.now().toString(36) + i;
    var b = {key:key, id:d.id, kind:d.kind, cid:DS_KC[d.kind], ar:d.ar, en:d.en, items:[], lay:'', st:'load'};
    DSC.blocks[key] = b; return b;
  }
  function run(b, d){
    pending++;
    withTimeout(d.fn(), 16000).then(function(l){ return dsFinish(l); }, function(){ return []; }).then(function(items){
      if(my !== DSC.seq) return;
      pending--;
      if(items.length >= 6){ b.items = items; b.st = 'ok'; dsSeenAdd(items.slice(0, 15).map(function(x){ return x.title; })); live++; }
      else{
        b.st = 'fail';
        var nx = spare.shift();
        if(nx){ var nb = mk(nx, DSC.order.length); var pos = DSC.order.indexOf(b.key); DSC.order.splice(pos + 1, 0, nb.key); DSC.last.push(nx.id); dsInsertAfter(b.key, nb); dsFill(b.key); run(nb, nx); return; }
      }
      dsFill(b.key);
      if(!pending){ DSC.busy = false; DSC.t = Date.now(); DSC.order = DSC.order.filter(function(k){ return DSC.blocks[k] && DSC.blocks[k].st === 'ok'; }); dsSave(); }
    });
  }
  pk.use.forEach(function(d, i){ var b = mk(d, i); DSC.order.push(b.key); });
  recPaint();
  DSC.order.slice().forEach(function(k, i){ run(DSC.blocks[k], pk.use[i]); });
}
function dsInsertAfter(oldKey, nb){
  var el = document.getElementById('dsb-' + oldKey);
  if(el){ var tmp = document.createElement('div'); tmp.innerHTML = dsBlockHTML(nb); if(tmp.firstChild) el.parentNode.insertBefore(tmp.firstChild, el.nextSibling); }
}
function dscEnsure(force){
  if(!recCats().length) return;
  dsRestore();
  var old = !DSC.t || Date.now() - DSC.t > DS_TTL;
  if(force || (old && !DSC.busy) || !DSC.order.length){ if(DSC.busy && !force) return; dsRoll(); }
  else if(DSC.fresh){ DSC.fresh = false; recPaint(); }
}

function dsLay(n, p1, p2){
  var ok = Object.keys(DS_LAYS).filter(function(k){ return n >= DS_LAYS[k] && k !== p1 && k !== p2; });

  return rnd(ok);
}

function dsSection(key, title, chip, lay, cards){
  var cap = DS_CAP[lay] || 99, more = cards.length > cap && !DSC.exp[key], shown = more ? cards.slice(0, cap) : cards;
  var body = DSC.exp[key] && cards.length > cap ? DS_LF.grid3(cards) : DS_LF[lay](shown);
  return '<section class="dsc-sec" id="dsb-' + esc(key) + '"><div class="sec-h"><h2 style="font-size:17px">' + esc(title) + '</h2>' + (chip ? '<span class="dsc-k">' + esc(chip) + '</span>' : '') + '</div>' + body +
    (more ? '<button class="btn ghost sm dsc-more" data-act="dsc-more" data-k="' + esc(key) + '">' + L('عرض المزيد', 'Show more') + ' (' + (cards.length - cap) + '+)</button>' : '') + '</section>';
}
function dsBlockHTML(b){
  var cc = catById(b.cid), chip = cc ? trName(cc.name) : '';
  if(b.st !== 'ok'){
    return '<section class="dsc-sec" id="dsb-' + esc(b.key) + '"><div class="sec-h"><h2 style="font-size:17px">' + esc(dsTitleOf(b)) + '</h2>' + (chip ? '<span class="dsc-k">' + esc(chip) + '</span>' : '') + '</div><div class="rail">' +
      [1, 2, 3, 4].map(function(){ return '<div class="rc"><div class="sk" style="width:112px;aspect-ratio:2/3;border-radius:14px"></div><div class="sk" style="width:80px;height:12px;border-radius:6px"></div></div>'; }).join('') + '</div></section>';
  }
  var own = recOwn();
  var cards = b.items.map(function(r, i){ return {r:r, at:'data-act="dsc-add" data-k="' + esc(b.key) + '" data-i="' + i + '"'}; }).filter(function(x){ return !own[normT(x.r.title)]; });
  if(cards.length < 5) return '<span id="dsb-' + esc(b.key) + '" hidden></span>';
  if(!b.lay || DS_LAYS[b.lay] > cards.length) b.lay = dsLay(cards.length, b._p1, b._p2);
  return dsSection(b.key, dsTitleOf(b), chip, b.lay, cards);
}

/* ----- دمج الأقسام الشخصية (حسب ذوقك) مع الأقسام الجديدة ----- */
function homeSecHTML(sec, si, lay){
  var c = sec.k === 'mine' ? null : catById(sec.id);
  if(sec.k !== 'mine' && !c) return '';
  var own = recOwn();
  var cards = sec.items.map(function(r, i){ return {r:r, at:'data-act="rec-add" data-s="' + si + '" data-i="' + i + '"'}; }).filter(function(x){ return !own[normT(x.r.title)]; });
  if(!cards.length) return '';
  var key = 'rec' + si;
  if(!sec.lay || DS_LAYS[sec.lay] > cards.length) sec.lay = (sec.k === 'mine' && cards.length >= DS_LAYS.hero) ? 'hero' : dsLay(cards.length, lay && lay[0], lay && lay[1]);
  return dsSection(key, c ? trName(c.name) : L('قد تعجبك', 'You might like'), c ? L('من ذوقك', 'For you') : L('اخترناها لك', 'Picked for you'), sec.lay, cards);
}
var _recHTML30 = recHTML;
recHTML = function(){
  if(REC.none) return _recHTML30();
  var dsc = DSC.order.map(function(k){ return DSC.blocks[k]; }).filter(function(x){ return x && x.st !== 'fail'; });
  if(!dsc.length) return _recHTML30();
  var mine = [], rest = [];
  REC.secs.forEach(function(s, i){ (s.k === 'mine' ? mine : rest).push(i); });
  var seq = [];
  mine.forEach(function(i){ seq.push({t:'r', i:i}); });
  var di = 0, ri = 0;
  while(di < dsc.length || ri < rest.length){
    for(var k = 0; k < 2 && di < dsc.length; k++) seq.push({t:'d', b:dsc[di++]});
    if(ri < rest.length) seq.push({t:'r', i:rest[ri++]});
  }
  var out = '', p1 = '', p2 = '';
  seq.forEach(function(x){
    var h;
    if(x.t === 'r'){ var sec = REC.secs[x.i]; h = homeSecHTML(sec, x.i, [p1, p2]); if(h){ p2 = p1; p1 = sec.lay; } }
    else{ x.b._p1 = p1; x.b._p2 = p2; h = dsBlockHTML(x.b); if(x.b.st === 'ok' && x.b.lay){ p2 = p1; p1 = x.b.lay; } }
    out += h;
  });
  if(!REC.secs.length && REC.busy) out += recSkel();
  return out;
};
var _recLoad30 = recLoad;
recLoad = function(force){ _recLoad30(force); try{ dscEnsure(!!force); }catch(e){ try{ console.error(e); }catch(x){} } };

/* ----- المزيد أقسام وأعمال في الاقتراحات الشخصية: 10–16 عملاً بدل 5–10 ----- */
recAssemble = function(res){
  var seen = {}, mine = [];
  function addMine(c, r){
    var nt = normT(r.title), k = c.id + '|' + nt; if(!nt || seen[k]) return false;
    seen[k] = 1; mine.push({title:r.title, sub:r.sub || '', img:r.img || '', cid:c.id}); return true;
  }
  var by = res.slice().sort(function(a, b){ return recNDone(b.c) - recNDone(a.c); });
  recRR(by.filter(function(x){ return x.taste.length; }).map(function(x){ return {c:x.c, a:x.taste}; }), 24, addMine);
  if(mine.length < 24) recRR(by.map(function(x){ return {c:x.c, a:shuf(x.alt.concat(x.extra))}; }), 24 - mine.length, addMine);
  var secs = [];
  if(mine.length >= 6) secs.push({k:'mine', items:mine});
  res.slice().sort(function(a, b){ return MAIN_IDS.indexOf(a.c.id) - MAIN_IDS.indexOf(b.c.id); }).forEach(function(x){
    var cand = shuf(x.taste.concat(x.alt, x.extra)), n = 10 + Math.floor(Math.random() * 7), out = [], loc = {};
    function pick(skipSeen){
      cand.forEach(function(r){
        var nt = normT(r.title), k = x.c.id + '|' + nt;
        if(out.length >= n || !nt || loc[k] || (skipSeen && seen[k])) return;

    tq = tq.order('created_at', {ascending:false}).limit(50);

    return Promise.all([tq, pq]).then(function(x){

        pids.length ? sbc.from('post_likes').select('post_id,user_id').in('post_id', pids) : {data:[]},

        (y[0].data || []).forEach(function(l){ FD.likes[l.post_id] = (FD.likes[l.post_id] || 0) + 1; if(l.user_id === CL.uid) FD.mine[l.post_id] = 1; });

function cmMsgs(initial){

  var q = sbc.from('community_messages').select('id,user_id,body,created_at').eq('community_id', v.id), first = initial || !v.mcur;
  q = first ? q.order('created_at', {ascending:false}).limit(100) : q.gt('created_at', v.mcur).order('created_at');
  return q.then(function(r){
    if(r.error) throw r.error; if(CM.v !== v) return;
    var rows = r.data || []; if(first) rows = rows.slice().reverse();
    var add = rows.filter(function(m){ return !v.msgs.some(function(x){ return x.id === m.id; }); });
    rows.forEach(function(m){ if(!v.mcur || m.created_at > v.mcur) v.mcur = m.created_at; });
    return ensureUsers(add.map(function(m){ return m.user_id; })).then(function(){
      var was = v.mloaded; v.mloaded = true;
      if(!add.length && was) return;
      add.forEach(function(m){ v.msgs.push(m); }); v.msgs.sort(function(a, b){ return a.created_at < b.created_at ? -1 : a.created_at > b.created_at ? 1 : 0; });

  else if(a === 'cm-tab' && v){ v.tab = t.dataset.t; render(); if(v.tab === 'chat' && v.role){ if(v.mloaded){ window.scrollTo(0, document.body.scrollHeight); cmMsgs(false); } else cmMsgs(true); } }

  else if(a === 'cm-pic-add') cmPicSheet();

  else if(a === 'cm-send') cmSend();

    }).catch(dbToast);

<script>
/* شريط الرئيسية: يتحوّل تدريجياً إلى زجاج عند التمرير */
(function(){
  var el = null, raf = 0, last = -1;
  function upd(){
    raf = 0;
    if(!el || !el.isConnected){ el = document.querySelector('.pg-h.tb'); last = -1; }
    if(!el) return;
    var y = window.pageYOffset || document.documentElement.scrollTop || 0;
    var p = Math.max(0, Math.min(1, (y - 6) / 54)); p = Math.round(p * 100) / 100;
    if(p !== last){ el.style.setProperty('--tbp', p); el.classList.toggle('tb0', p === 0); last = p; }
  }
  function kick(){ if(!raf) raf = requestAnimationFrame(upd); }
  window.addEventListener('scroll', kick, {passive:true});
  window.addEventListener('resize', kick, {passive:true});
  var app = document.getElementById('app');
  if(app && window.MutationObserver) new MutationObserver(function(){ el = null; kick(); }).observe(app, {childList:true});
  kick();
})();
</script>

</script>
