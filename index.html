<style>
:root{
  /* idk: رمادي ضبابي + فحمي */
  --bg:#ececee; --fg:#1b1c15; --surface:#e8e8dc; --surface2:#d9d9c9; --muted:#6a6b59; --line:rgba(27,28,21,.14);
  --ph1:#d5d5c4; --ph2:#e9e9de; --shadow:0 8px 22px rgba(44,46,26,.17);
  --navbg:rgba(243,243,235,.95); --rim:inset 0 1px 0 rgba(255,255,250,.75);
  --gloss:linear-gradient(160deg,rgba(255,255,250,.58) 0%,rgba(255,255,250,.12) 48%,rgba(255,255,250,0) 100%);
  --sheen-fg:linear-gradient(150deg,rgba(255,255,245,.2) 0%,rgba(255,255,245,.04) 36%,rgba(255,255,245,0) 58%,rgba(255,255,245,.05) 100%);
  --sheen-bg:radial-gradient(90% 46% at 10% -6%,rgba(255,255,250,.9),rgba(255,255,250,0) 70%),radial-gradient(75% 42% at 104% 102%,rgba(192,194,160,.38),rgba(192,194,160,0) 70%);
  --sheen-sheet:linear-gradient(180deg,rgba(255,255,250,.85),rgba(255,255,250,0) 150px);
  --ease:cubic-bezier(.22,.9,.28,1); --spring:cubic-bezier(.3,1.45,.5,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme^="silver"]){
    --bg:#0e0e10; --fg:#ebebdf; --surface:#1a1b14; --surface2:#292a20; --muted:#9a9b86; --line:rgba(228,230,205,.15);
    --ph1:#2a2b21; --ph2:#17180f; --shadow:0 8px 22px rgba(0,0,0,.62);
    --navbg:rgba(14,15,10,.95); --rim:inset 0 1px 0 rgba(255,255,240,.07);
    --gloss:linear-gradient(160deg,rgba(255,255,240,.06) 0%,rgba(255,255,240,.02) 50%,rgba(255,255,240,0) 100%);
    --sheen-fg:linear-gradient(150deg,rgba(255,255,245,.75) 0%,rgba(255,255,245,.16) 40%,rgba(120,122,90,.2) 100%);
    --sheen-bg:radial-gradient(90% 46% at 10% -6%,rgba(170,174,130,.15),rgba(170,174,130,0) 70%),radial-gradient(75% 42% at 104% 102%,rgba(130,134,96,.1),rgba(130,134,96,0) 70%);
    --sheen-sheet:linear-gradient(180deg,rgba(196,200,160,.08),rgba(196,200,160,0) 150px);
  }
}
:root[data-theme="dark"]{
  --bg:#0e0e10; --fg:#ebebdf; --surface:#1a1b14; --surface2:#292a20; --muted:#9a9b86; --line:rgba(228,230,205,.15);
  --ph1:#2a2b21; --ph2:#17180f; --shadow:0 8px 22px rgba(0,0,0,.62);
  --navbg:rgba(14,15,10,.95); --rim:inset 0 1px 0 rgba(255,255,240,.07);
  --gloss:linear-gradient(160deg,rgba(255,255,240,.06) 0%,rgba(255,255,240,.02) 50%,rgba(255,255,240,0) 100%);
  --sheen-fg:linear-gradient(150deg,rgba(255,255,245,.75) 0%,rgba(255,255,245,.16) 40%,rgba(120,122,90,.2) 100%);
  --sheen-bg:radial-gradient(90% 46% at 10% -6%,rgba(170,174,130,.15),rgba(170,174,130,0) 70%),radial-gradient(75% 42% at 104% 102%,rgba(130,134,96,.1),rgba(130,134,96,0) 70%);
  --sheen-sheet:linear-gradient(180deg,rgba(196,200,160,.08),rgba(196,200,160,0) 150px);
}
/* الألوان القديمة (فضي/أسود) محفوظة كما هي — مقفولة للمشتركين لاحقاً */
:root[data-theme="silver-light"]{
  --bg:#eceef2; --fg:#0f1114; --surface:#e2e5ea; --surface2:#d1d6dd; --muted:#5b6370; --line:rgba(15,17,20,.13);

  --sheen-bg:radial-gradient(90% 46% at 10% -6%,rgba(255,255,255,.95),rgba(255,255,255,0) 70%),radial-gradient(75% 42% at 104% 102%,rgba(188,196,211,.5),rgba(188,196,211,0) 70%);
  --sheen-sheet:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0) 150px);
}
:root[data-theme="silver-dark"]{

button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
svg{display:block;flex:none}
#app{max-width:640px;margin:0 auto;padding:18px 16px 120px}

.pg-h{margin:2px 0 16px}
.pg-h h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.3px}
.pg-h .sub{color:var(--muted);font-size:13px;margin-top:3px}

.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:4px 16px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;padding:9px 16px 9px 14px;border-radius:999px;border:1.5px solid var(--line);font-size:15px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
.chip.add{color:var(--muted);border-style:dashed}
#feed-new{position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:5;display:flex;justify-content:center;margin:0 0 8px}
#feed-new:empty{display:none}
#rec-new:empty{display:none}
.nt .nt2.qt{border-inline-start:3px solid var(--line);padding-inline-start:8px;margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cim{display:block;width:18px;height:18px;border-radius:50%;background-size:cover;background-position:center}

.sec-h{display:flex;align-items:center;justify-content:space-between;margin:14px 0 12px;gap:10px}
.sec-h h2{margin:0;font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
.sec-h .n{color:var(--muted);font-size:14px;font-weight:400}
.ico{width:38px;height:38px;border-radius:12px;border:1.5px solid var(--line);display:grid;place-items:center}
.seg{display:inline-flex;background:var(--surface);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:7px 12px;border-radius:9px;font-size:13px;font-weight:500;color:var(--muted);flex:1}
.seg button.on{background:var(--fg);color:var(--bg);font-weight:600}
.seg.wide{display:flex}
.seg.wide button{padding:12px 10px;font-size:15px}

.poster{position:relative;aspect-ratio:2/3;width:100%;border-radius:14px;background-color:var(--ph2);background-size:cover;background-position:center;
  overflow:hidden;display:flex;align-items:center;justify-content:center}
.poster.ph{background-image:linear-gradient(160deg,var(--ph1),var(--ph2));font-size:30px;font-weight:700;color:var(--muted)}

.podium{direction:ltr;display:grid;grid-template-columns:1fr 1.18fr 1fr;gap:10px;align-items:end;margin-bottom:6px}
.pc{display:flex;flex-direction:column;align-items:stretch;text-align:center;min-width:0}
.pw{position:relative;box-shadow:var(--shadow);border-radius:14px}
.sc{position:absolute;bottom:7px;inset-inline-end:7px;background:rgba(0,0,0,.82);color:#fff;border-radius:8px;padding:2px 8px;font-weight:700;font-size:13px;direction:ltr;font-variant-numeric:tabular-nums}
.pc .nm{margin:9px 2px 8px;font-size:13px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.step{display:grid;place-items:center;border-radius:12px 12px 0 0;font-size:28px;font-weight:700;background:var(--surface2);color:var(--fg)}
.p1 .step{background:var(--fg);color:var(--bg)}

.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:26px 50px 1fr auto;align-items:center;gap:12px;width:100%;text-align:start;
  background:var(--surface);border-radius:16px;padding:8px 12px}
.row.np{grid-template-columns:50px 1fr auto}
.row .pos{color:var(--muted);font-weight:600;font-size:14px;text-align:center;direction:ltr}
.row .poster{width:50px;border-radius:10px;font-size:20px}
.tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.row .nm{font-size:16px;font-weight:500;line-height:1.35;overflow-wrap:anywhere}
.row .sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{display:inline-grid;place-items:center;min-width:48px;height:32px;padding:0 8px;border-radius:10px;border:1.5px solid var(--fg);
  font-weight:700;font-size:15px;direction:ltr;font-variant-numeric:tabular-nums}

.empty{margin-top:24px;padding:30px 18px;border-radius:20px;border:1.5px dashed var(--line);text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:18px;margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:14px;background:var(--fg);color:var(--bg);font-weight:700;font-size:16px}
.btn.ghost{background:var(--surface2);color:var(--fg);font-weight:600}
.btn.line{background:transparent;color:var(--fg);border:1.5px solid var(--fg);font-weight:600}
.btn.danger{background:transparent;color:var(--fg);border:1.5px solid var(--fg);font-weight:600}
.btn.danger.sure{background:var(--fg);color:var(--bg)}
.empty .btn{margin-top:14px}
.fpick{position:relative;overflow:hidden}
.fpick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.acts{display:flex;gap:10px;margin-top:8px}
.acts .btn{flex:1}

.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);align-items:end}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;color:var(--muted)}
.tab.on{color:var(--fg);font-weight:600}
.tab.add{padding:0}
.tab .circ{width:54px;height:54px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;margin-top:-24px;box-shadow:var(--shadow)}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:26px 26px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.sheet h3{margin:0 0 14px;font-size:20px}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 14px}
.field{margin-bottom:14px}
.field label.l{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.inp{width:100%;height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px}
.inp:focus{border-color:var(--fg);outline:none}
textarea.inp{height:auto;padding:12px 14px;resize:none;line-height:1.5}
.pick{display:flex;gap:14px;align-items:center}
.pick .poster{width:92px;flex:none}
.pick #pv-wrap{width:92px;flex:none}
.pick .hint{display:flex;flex-direction:column;gap:8px;align-items:flex-start;color:var(--muted);font-size:13px;line-height:1.5}
.pick .btn{height:40px;font-size:14px;padding:0 14px}
.rate{direction:ltr}
.rate .lab{direction:rtl;text-align:start;font-size:13px;color:var(--muted);margin-bottom:6px}
.rate .line{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rate .big{font-size:46px;font-weight:700;min-width:130px;text-align:center;font-variant-numeric:tabular-nums}
.rate .pm{width:52px;height:52px;border-radius:16px;border:1.5px solid var(--line);display:grid;place-items:center}
.rate input[type=range]{width:100%;margin:12px 0 0;accent-color:var(--fg);height:32px}
.rate .ends{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.ic{aspect-ratio:1;border-radius:14px;border:1.5px solid var(--line);display:grid;place-items:center}
.ic.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.ic .cim{width:28px;height:28px}
.note{color:var(--muted);font-size:13px;line-height:1.55;margin:8px 0 0}

.cs{background:var(--surface);border-radius:20px;padding:16px;margin-bottom:12px}
.cs h3{margin:0 0 4px;font-size:17px}
.cs p{margin:0 0 12px;color:var(--muted);font-size:13.5px;line-height:1.55}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:18px}

.me{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.av{width:88px;height:88px;border-radius:50%;background:var(--surface2);background-size:cover;background-position:center;display:grid;place-items:center;flex:none;color:var(--muted);font-size:32px;font-weight:700;overflow:hidden}
.me .col{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.me .btn{height:38px;font-size:14px;padding:0 14px;align-self:flex-start}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.st{background:var(--surface);border-radius:16px;padding:14px 8px;text-align:center}
.st b{display:block;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.st span{font-size:12.5px;color:var(--muted)}
.crow{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow .t{font-size:15px;font-weight:500}
.crow .s{font-size:12.5px;color:var(--muted)}
.meter{height:5px;border-radius:3px;background:var(--surface2);margin-top:6px;overflow:hidden;direction:ltr}
.meter i{display:block;height:100%;background:var(--fg);border-radius:3px}
.hist{direction:ltr;display:flex;gap:6px;height:120px;align-items:stretch}
.hb{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.hb .col{flex:1;min-height:0;display:flex;align-items:flex-end}
.hb .bar{width:100%;min-height:3px;background:var(--fg);border-radius:4px 4px 2px 2px}
.hb span{font-size:11px;color:var(--muted);text-align:center}
.qwrap{position:relative;margin-bottom:14px}
.qwrap .inp{padding-inline-start:44px}
.qwrap svg{position:absolute;inset-inline-start:14px;top:14px;color:var(--muted)}
.sr{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;width:100%;text-align:start;background:var(--surface);border-radius:12px;padding:6px 10px;margin-top:6px}
.sr .th{width:40px;aspect-ratio:2/3;border-radius:8px;background-color:var(--ph2);background-size:cover;background-position:center}
.sr .nm{font-size:14.5px;font-weight:500;line-height:1.35;overflow-wrap:anywhere}
.sr .sub{font-size:12px;color:var(--muted)}
.srmsg{color:var(--muted);font-size:13px;padding:10px 2px;line-height:1.55}
.pre{display:flex;flex-wrap:wrap;gap:8px}
.pchip{padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);font-size:14px}
select.inp{appearance:auto}
a.lnk{color:var(--fg);text-decoration:underline}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:90%}
.pchip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button.st{width:100%;color:inherit}
.pav{width:44px;height:44px;border-radius:50%;background-color:var(--surface2);background-size:cover;background-position:center;display:grid;place-items:center;color:var(--muted);font-weight:700;flex:none}
.pbn{position:relative;aspect-ratio:2/1;max-height:340px;width:100vw;margin:-18px calc(50% - 50vw) 0;background-color:var(--surface2);background-size:cover;background-position:center;border-radius:0 0 24px 24px}
.pbn.sm{aspect-ratio:3.5/1;max-height:150px;border-radius:0 0 18px 18px}
.idc .bn.sm{height:56px}
.cr-box{position:relative;overflow:hidden;width:100%;background:var(--surface2);border-radius:14px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.cr-box.round{border-radius:50%;max-width:260px;margin:0 auto}
.cr-box img{position:absolute;max-width:none;pointer-events:none;-webkit-user-drag:none}
.pavw .av{position:relative;z-index:1;width:112px;height:112px;margin:-56px auto 8px;border:4px solid var(--bg);font-size:38px}
.ctr{text-align:center}.ctr .meta{justify-content:center}
.pbk{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));inset-inline-start:12px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;border:0;display:grid;place-items:center}
.avb{background:none;border:0;padding:0;margin:0;flex:none;align-self:flex-start;cursor:pointer}
body{overflow-x:clip}
.bn{height:120px;border-radius:18px;background-color:var(--surface2);background-size:cover;background-position:center}
.savebar{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;margin-top:18px;z-index:5;pointer-events:none}
.savebar .btn{pointer-events:auto;min-width:190px;box-shadow:var(--shadow)}
.idrow{display:grid;grid-template-columns:104px 1fr;gap:14px;align-items:start;margin-bottom:14px}
.idc{display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:0}
.idc .av{margin:0 auto}
.idc .bn{height:88px}
.btn.sm{height:34px;font-size:12.5px;padding:0 8px;border-radius:11px}
.fabw{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:10px;z-index:9}
.fab{width:58px;height:58px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;box-shadow:var(--shadow)}
.fabo{display:flex;align-items:center;gap:8px;background:var(--bg);color:var(--fg);border:1.5px solid var(--fg);border-radius:999px;padding:10px 16px;font-weight:600;font-size:14px;box-shadow:var(--shadow)}
html[dir="rtl"] .fabw{align-items:flex-start}
.ttl{display:flex;align-items:center;gap:10px}
.bell{position:relative;width:36px;height:36px;flex:none}
.bdg{position:absolute;top:-6px;inset-inline-end:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#e5484d;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1}
.bdg[hidden]{display:none}
.nt{display:flex;gap:10px;align-items:flex-start;width:100%;padding:12px;margin-bottom:8px;border:1.5px solid var(--line);border-radius:14px;background:none;color:inherit;text-align:start}
.nt.un{border-color:var(--fg)}
.nt .ni{flex:none;width:36px;height:36px;border-radius:10px;background:var(--surface2);display:grid;place-items:center}
.nt .nb{min-width:0;flex:1;display:flex;flex-direction:column}
.nt .nt1{font-weight:700;font-size:14.5px;overflow-wrap:anywhere}
.nt .nt2{color:var(--muted);font-size:13px;margin-top:2px;white-space:pre-wrap;overflow-wrap:anywhere}
.nt .nt3{color:var(--muted);font-size:11.5px;margin-top:5px}
.rpk{display:flex;flex-direction:column;gap:2px;padding:9px 0;border-bottom:1px solid var(--line)}
.rpk b{font-size:12px;color:var(--muted);font-weight:600}
.rpk span{font-size:15px;overflow-wrap:anywhere;white-space:pre-wrap}
.msgs{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow-y:auto;margin-bottom:12px}
.bub{align-self:flex-end;background:var(--fg);color:var(--bg);padding:8px 12px;border-radius:14px;max-width:80%;overflow-wrap:anywhere;font-size:15px;line-height:1.4}
.msgin{display:flex;gap:8px}.msgin .btn{height:48px;padding:0 16px}
.chd{position:sticky;top:0;z-index:6;background:var(--bg);display:flex;align-items:center;gap:10px;padding:8px 0 10px;border-bottom:1px solid var(--line)}
html[dir="ltr"] .bk svg{transform:scaleX(-1)}
.cmsgs{padding:8px 0 24px}
.msg{display:flex;gap:10px;margin-top:2px}.msg.hd{margin-top:14px}
.msg[data-mid]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}.mb{min-width:0;flex:1}.mb.sp{margin-inline-start:54px}
.mh{display:flex;gap:8px;align-items:baseline}.mh b{font-size:15px}.mh span{font-size:11.5px;color:var(--muted)}
.mt{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;font-size:15px}
.matt{display:block;max-width:100%;max-height:280px;border-radius:12px;margin-top:6px;background:var(--surface)}
.mfile{display:flex;align-items:center;gap:10px;margin-top:6px;padding:10px 12px;border-radius:12px;background:var(--surface);color:var(--fg);text-decoration:none;max-width:100%}
.mfile span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}.mfile small{display:block;color:var(--muted);font-size:12px}
.cbar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));z-index:10}
.cin{max-width:640px;margin:0 auto;display:flex;gap:8px;align-items:center;position:relative}
.attm{position:absolute;bottom:58px;inset-inline-start:0;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.meta{display:flex;flex-wrap:wrap;align-items:center;font-size:13.5px;color:var(--muted);margin-top:3px}
.meta>*+*::before{content:'·';margin-inline:7px}
.meta .lk{background:none;border:0;padding:0;color:inherit;font:inherit}.meta .lk b{color:var(--fg)}
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px}
.ltile{position:relative;aspect-ratio:1;border-radius:16px;background-color:var(--surface2);background-size:cover;background-position:center;overflow:hidden;display:grid;place-items:center;color:var(--fg);border:1.5px solid var(--line);padding:0}
.ltile.new{border-style:dashed;color:var(--muted);background:none}.ltile .li{color:var(--muted)}
.ln{position:absolute;inset-inline:0;bottom:0;padding:20px 8px 7px;background:linear-gradient(transparent,rgba(0,0,0,.66));color:#fff;text-align:start;display:flex;justify-content:space-between;align-items:flex-end;gap:4px}
.ln b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ln small{font-size:11px;opacity:.85}
.lcv{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.hav{position:absolute;left:0;top:0;padding:0;border:0;background:none;border-radius:50%}
.hav .pav{width:68px;height:68px;font-size:26px;border:2px solid var(--line)}
.pa{max-width:640px;margin:0 auto 8px;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:var(--surface)}
.pa .pth{width:44px;height:44px;border-radius:10px;background-color:var(--surface2);background-size:cover;background-position:center;flex:none}
.pa .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}.pa small{display:block;color:var(--muted);font-size:12px}
.sysm{text-align:center;color:var(--muted);font-size:12.5px;margin:14px 8px 4px;overflow-wrap:anywhere}
.gm{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.gm:last-child{border-bottom:0}
.gm .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.gm .nm{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.gm .sub{font-size:12.5px;color:var(--muted)}
.gm .btn.sm{height:32px;font-size:12.5px;padding:0 12px}
.tag{font-size:11px;font-weight:500;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);margin-inline-start:6px;white-space:nowrap}
.btn.sm svg{margin-inline-end:2px}

/* ---------- v12: feed / quote / sources panel ---------- */
.row,.pc{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.pc.lp{border-radius:14px}
.row.lp,.pc.lp{transform:scale(.965);box-shadow:0 0 0 2px var(--fg);transition:transform .25s cubic-bezier(.2,1.3,.4,1),box-shadow .2s}
.row,.pc{transition:transform .2s ease,box-shadow .2s ease}
.qbg{position:fixed;inset:0;z-index:60;background:transparent}
.qpop{position:fixed;z-index:61;transform:translateX(-50%)}
.qpop .qin{transform-origin:50% 100%;animation:qin .3s cubic-bezier(.2,1.4,.4,1) both}
.qpop.below .qin{transform-origin:50% 0}
.qpop.out .qin{animation:qout .16s ease-in both}
.qpop button{display:flex;align-items:center;gap:9px;height:48px;padding:0 22px;border-radius:999px;background:var(--fg);color:var(--bg);font-weight:700;font-size:16px;box-shadow:0 10px 28px rgba(0,0,0,.35);white-space:nowrap}
@keyframes qin{from{opacity:0;transform:translateY(14px) scale(.55)}to{opacity:1;transform:none}}
@keyframes qout{to{opacity:0;transform:translateY(8px) scale(.8)}}
@keyframes hpop{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes pin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.qpop .qin,.qpop.out .qin,.post{animation:none!important}.row,.pc,.row.lp,.pc.lp{transition:none}}

.post{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);animation:pin .25s ease-out both}
.post .pmain{min-width:0;cursor:pointer}
.post .pcol{min-width:0}
.phead{display:flex;align-items:center;gap:6px;min-width:0}
.phead b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.phead .pu,.phead .pt{color:var(--muted);font-size:13px;white-space:nowrap}
.phead .pu{overflow:hidden;text-overflow:ellipsis;min-width:0}
.pmore{margin-inline-start:auto;width:30px;height:30px;display:grid;place-items:center;color:var(--muted);border-radius:50%;flex:none}
.ptext{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;font-size:15.5px;margin-top:2px}
.ptext.big{font-size:18px}
.pacts{display:flex;gap:26px;margin-top:10px;color:var(--muted)}
.pact{display:flex;align-items:center;gap:6px;font-size:13.5px;padding:6px 2px;color:inherit;font-variant-numeric:tabular-nums}
.pact.on{color:var(--fg);font-weight:700}
.pact.on svg{fill:currentColor}
.pact.pop svg{animation:hpop .38s ease-out}
.qc{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:16px;padding:8px;margin-top:10px;background:var(--surface);text-align:start}
.qc .qi{aspect-ratio:2/3;border-radius:8px;background-color:var(--ph2);background-size:cover;background-position:center}
.qc .qi.ph{background-image:linear-gradient(160deg,var(--ph1),var(--ph2))}
.qc .qn{font-size:14.5px;font-weight:600;overflow-wrap:anywhere;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qc .qs{font-size:12px;color:var(--muted)}
.qcw{position:relative}
.qcw .qx{position:absolute;top:2px;inset-inline-end:2px;width:26px;height:26px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;z-index:2}
.cmp{display:grid;grid-template-columns:44px 1fr;gap:12px;margin-bottom:12px}
.cmp textarea.inp{min-height:110px;font-size:17px;border:0;background:transparent;padding:6px 0}
.cmp textarea.inp:focus{border:0}
.cmpf{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.cmpf .note{margin:0;font-size:12px}
.cnt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;direction:ltr}
.cnt.hot{color:var(--fg);font-weight:700}
.btn[disabled]{opacity:.35;pointer-events:none}

.sw{direction:ltr;position:relative;flex:none;width:52px;height:30px;border-radius:999px;background:var(--surface2);border:1.5px solid var(--line);transition:background .2s,border-color .2s}
.sw::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:21px;height:21px;border-radius:50%;background:var(--fg);opacity:.5;transition:inset-inline-start .24s cubic-bezier(.3,1.3,.5,1),background .2s,opacity .2s}
.sw[aria-checked="true"]{background:var(--fg);border-color:var(--fg)}
.sw[aria-checked="true"]::after{inset-inline-start:calc(100% - 24px);background:var(--bg);opacity:1}
.src{background:var(--surface);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.src .srh{display:flex;align-items:center;justify-content:space-between;gap:12px}
.src .tx{flex:1;min-width:0;align-items:flex-start}
.qc .tx{align-items:flex-start}
.src .nm{font-weight:600;font-size:15.5px;overflow-wrap:anywhere}
.src.off .nm,.src.off .tags{opacity:.45}
.src .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.src .tag{margin:0}
.src .sra{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.src .sra .srt{font-size:12.5px;color:var(--muted);flex:1;min-width:0;overflow-wrap:anywhere}
.src .url{font-size:12px;color:var(--muted);direction:ltr;text-align:start;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.warnb{border:1.5px dashed var(--fg);border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.55;margin:0 0 12px}
details.adv{margin:4px 0 14px;border:1.5px solid var(--line);border-radius:14px;padding:0 12px}
details.adv summary{cursor:pointer;padding:12px 0;font-weight:600;font-size:14px;list-style:none}
details.adv summary::-webkit-details-marker{display:none}
details.adv[open] summary{border-bottom:1px solid var(--line);margin-bottom:12px}
details.adv .field:last-child{margin-bottom:14px}
.inp.ltr{direction:ltr;text-align:start}
.mini{height:32px;font-size:12.5px;padding:0 12px;border-radius:10px}

/* =====================================================================
   v13 — واجهة فضية/سوداء لامعة + حركات + أداء (تغيير شكلي فقط)
   ===================================================================== */
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;overscroll-behavior-x:none}
body{background:var(--bg);transition:background-color .35s ease,color .35s ease}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--sheen-bg)}
button,[role=button],.tab,.chip,.btn,.fab,.fabo,.row,.pc,label.fpick{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.nav:empty{display:none}
.chips,.sheet,.msgs{-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--surface2) transparent}
.sheet,.msgs{overscroll-behavior:contain}
.chips{overscroll-behavior-x:contain}
::selection{background:rgba(120,132,152,.35)}

/* ---------- شاشة التحميل (بدل الشاشة الفارغة) ---------- */
.splash{pointer-events:none}
.sk{position:relative;overflow:hidden;border-radius:12px;background:var(--surface)}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);animation:shim 1.25s ease-in-out infinite}
:root[data-theme="dark"] .sk::after{background:linear-gradient(90deg,transparent,rgba(190,202,224,.09),transparent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sk::after{background:linear-gradient(90deg,transparent,rgba(190,202,224,.09),transparent)}}
.splash-chips{display:flex;gap:8px;margin-bottom:16px}
.splash-chips .sk{height:40px;width:96px;border-radius:999px}
.splash-row{height:66px;border-radius:16px;margin-bottom:8px}
@keyframes shim{to{transform:translateX(100%)}}

/* ---------- الأسطح: فضّة بلمعان خافت ---------- */
.row,.st,.cs,.src,.pa,.sr,.qc,.seg,.inp,.nt .ni,.mfile,.fabo,.btn.ghost,.empty{background-image:var(--gloss)}
.row,.st,.cs,.src,.pa,.sr,.seg,.mfile{box-shadow:var(--rim)}
.cs,.st{box-shadow:var(--rim),0 1px 2px rgba(20,26,38,.06)}
.inp{box-shadow:inset 0 1px 2px rgba(20,26,38,.06)}
.poster,.sr .th,.qc .qi,.pa .pth{box-shadow:inset 0 0 0 1px rgba(128,138,156,.2)}
.poster.ph,.qc .qi.ph{background-image:linear-gradient(155deg,var(--ph1),var(--ph2) 60%,var(--ph1))}
.pw{box-shadow:var(--shadow),inset 0 0 0 1px rgba(128,138,156,.16)}
.p1 .pw{box-shadow:var(--shadow),0 0 0 1.5px rgba(150,162,182,.55),0 0 26px rgba(160,174,198,.28)}
.step{background-image:var(--gloss);box-shadow:var(--rim)}

/* ---------- الأسود/الفضي المعدني للعناصر المعبّأة ---------- */
.btn:not(.ghost):not(.line):not(.danger),.btn.danger.sure,.chip.on,.seg button.on,.tab .circ,.fab,.ic.on,.pchip.on,.p1 .step,.bub,.toast,.qpop button,.qcw .qx,.hb .bar,.meter i,.sw[aria-checked="true"]{background-image:var(--sheen-fg)}
.btn:not(.ghost):not(.line):not(.danger),.btn.danger.sure,.chip.on,.seg button.on,.ic.on,.pchip.on,.bub{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 1px 2px rgba(10,14,22,.18)}
:root[data-theme="dark"] .btn:not(.ghost):not(.line):not(.danger),:root[data-theme="dark"] .chip.on,:root[data-theme="dark"] .seg button.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 1px 2px rgba(0,0,0,.4)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn:not(.ghost):not(.line):not(.danger),:root:not([data-theme="light"]) .chip.on,:root:not([data-theme="light"]) .seg button.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 1px 2px rgba(0,0,0,.4)}}
.tab .circ,.fab{box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.line,.btn.danger{background-image:var(--gloss)}
.btn.danger.sure{background-image:var(--sheen-fg)}
.chip{background-image:var(--gloss)}.chip.on{background-image:var(--sheen-fg)}
.score{background-image:var(--gloss)}
.sc{background:linear-gradient(160deg,rgba(40,44,52,.9),rgba(8,9,12,.9));box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}

/* ---------- الشريط السفلي ---------- */
.nav,.cbar{background:var(--navbg);box-shadow:0 -10px 30px rgba(24,30,44,.07),var(--rim)}
.tab{position:relative;isolation:isolate;transition:color .25s ease}
.tab::before{content:"";position:absolute;z-index:-1;top:3px;left:50%;width:50px;height:30px;margin-left:-25px;border-radius:15px;background:var(--surface2);background-image:var(--gloss);opacity:0;transform:scale(.6);transition:opacity .28s ease,transform .32s var(--spring)}
.tab.on::before{opacity:.75;transform:none}
.tab.add::before,.tab:has(.circ)::before{display:none}
.nav.pop .tab.on svg{animation:tabpop .5s var(--spring)}
.nav.pop .tab.on::before{animation:pillin .34s var(--ease) backwards}
@keyframes tabpop{0%{transform:translateY(5px) scale(.78)}55%{transform:translateY(-3px) scale(1.14)}100%{transform:none}}
@keyframes pillin{from{opacity:0;transform:scale(.5)}}

/* ---------- ضغط الأزرار (حركة تفاعلية) ---------- */
.btn,.chip,.ico,.pm,.ic,.fab,.fabo,.seg button,.pchip,.pmore,.pbk,.pact,.nt,.sr,.ltile,.qpop button,.bell,.avb,.hav,.tab svg,.tab .circ{transition:transform .2s var(--spring),background-color .22s ease,color .22s ease,border-color .22s ease,box-shadow .22s ease,opacity .2s ease}
.btn:active,.chip:active,.ico:active,.pm:active,.ic:active,.fab:active,.fabo:active,.seg button:active,.pchip:active,.pmore:active,.pbk:active,.nt:active,.sr:active,.ltile:active,.qpop button:active,.bell:active,.avb:active,.hav:active{transform:scale(.94)}
.pact:active{transform:scale(.88)}
.row:not(.lp):active,.pc:not(.lp):active,.qc:active{transform:scale(.982)}
.tab:active svg{transform:scale(.8)}
.tab:active .circ{transform:scale(.9)}
@media (hover:hover){
  .btn:not(.ghost):not(.line):not(.danger):hover,.fab:hover,.tab .circ:hover{filter:brightness(1.12)}
  .btn.ghost:hover,.btn.line:hover,.ico:hover,.chip:not(.on):hover,.pchip:not(.on):hover,.ic:not(.on):hover,.pm:hover{background-color:var(--surface2)}
  .row:hover,.sr:hover,.nt:hover{box-shadow:var(--rim),0 6px 16px rgba(24,30,44,.1)}
}
.btn:disabled,.btn[disabled]{transition:opacity .25s ease}
.inp{transition:border-color .2s ease,box-shadow .25s ease,background-color .2s ease}
.inp:focus{border-color:var(--fg);box-shadow:0 0 0 4px rgba(128,140,160,.22),inset 0 1px 2px rgba(20,26,38,.05)}
:focus-visible{outline-color:rgba(130,142,162,.9);outline-width:2.5px;border-radius:inherit}

/* ---------- ظهور الصفحات والقوائم (لحظة واحدة منسّقة) ---------- */
#app.vt{animation:vtin .24s ease-out backwards}
@keyframes vtin{from{opacity:0}}
.vt .list>.row,.vt .podium>.pc{animation:rise .42s var(--ease) backwards}
.vt .list>.row:nth-child(1),.vt .podium>.pc:nth-child(1){animation-delay:72ms}
.vt .list>.row:nth-child(2),.vt .podium>.pc:nth-child(2){animation-delay:104ms}
.vt .list>.row:nth-child(3),.vt .podium>.pc:nth-child(3){animation-delay:136ms}
.vt .list>.row:nth-child(4),.vt .podium>.pc:nth-child(4){animation-delay:168ms}
.vt .list>.row:nth-child(5),.vt .podium>.pc:nth-child(5){animation-delay:200ms}
.vt .list>.row:nth-child(6),.vt .podium>.pc:nth-child(6){animation-delay:232ms}
.vt .list>.row:nth-child(7),.vt .podium>.pc:nth-child(7){animation-delay:264ms}
.vt .list>.row:nth-child(8),.vt .podium>.pc:nth-child(8){animation-delay:296ms}

.vt .podium>.pc:nth-child(2){animation-delay:40ms}
.vt .podium>.pc:nth-child(1){animation-delay:110ms}
.vt .podium>.pc:nth-child(3){animation-delay:150ms}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.vt .hb .bar{transform-origin:bottom;animation:growy .7s var(--ease) .1s backwards}
.vt .meter i{transform-origin:left;animation:growx .8s var(--ease) .12s backwards}
@keyframes growy{from{transform:scaleY(.04)}}
@keyframes growx{from{transform:scaleX(0)}}
.fabw .fabo{animation:fabin .3s var(--spring) backwards}
.fabw .fabo:nth-last-child(2){animation-delay:50ms}.fabw .fabo:nth-last-child(3){animation-delay:100ms}.fabw .fabo:nth-last-child(4){animation-delay:150ms}
@keyframes fabin{from{opacity:0;transform:translateY(16px) scale(.8)}}
.bdg{animation:bdgin .4s var(--spring) backwards}
@keyframes bdgin{from{transform:scale(0)}}

/* ---------- النوافذ السفلية ---------- */
.ov{background:rgba(8,10,16,.52);animation:ovin .22s ease-out both}
.sheet{background-color:var(--bg);background-image:var(--sheen-sheet);box-shadow:0 -12px 44px rgba(10,14,22,.3),var(--rim);animation:sheetin .38s var(--ease) both;will-change:transform}
.grip{background:var(--surface2);width:42px}
.sh-out .ov{animation:ovout .2s ease-in both;pointer-events:none}
.sh-out .sheet{animation:sheetout .22s cubic-bezier(.5,0,.8,.4) both;will-change:auto}
@keyframes ovin{from{opacity:0}}
@keyframes ovout{to{opacity:0}}
@keyframes sheetin{from{transform:translateY(34px) scale(.985);opacity:0}to{transform:none;opacity:1}}
@keyframes sheetout{to{transform:translateY(40px);opacity:0}}
.qpop button{background-image:var(--sheen-fg);box-shadow:0 10px 28px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.2)}

/* ---------- التنبيه ---------- */
.toast{animation:toastin .34s var(--spring) both;box-shadow:0 10px 30px rgba(8,10,16,.35),inset 0 1px 0 rgba(255,255,255,.18)}
.toast.out{animation:toastout .24s ease-in both}
@keyframes toastin{from{opacity:0;transform:translate(-50%,14px) scale(.94)}to{opacity:1;transform:translateX(-50%)}}
@keyframes toastout{to{opacity:0;transform:translate(-50%,8px) scale(.96)}}

/* ---------- شريط التقييم ---------- */
.rate input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer}
.rate input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--surface2);box-shadow:inset 0 1px 2px rgba(20,26,38,.18)}
.rate input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--surface2)}
.rate input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-11px;border-radius:50%;background:var(--fg);background-image:var(--sheen-fg);border:3px solid var(--bg);box-shadow:0 3px 10px rgba(10,14,22,.35);transition:transform .18s var(--spring)}
.rate input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--fg);background-image:var(--sheen-fg);border:3px solid var(--bg);box-shadow:0 3px 10px rgba(10,14,22,.35)}
.rate input[type=range]:active::-webkit-slider-thumb{transform:scale(1.18)}
.rate .big{transition:transform .15s var(--spring)}
.rate .dial{position:relative;width:224px;max-width:80%;aspect-ratio:1;margin:6px auto 4px;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none;outline:none}
.rate .dial svg{width:100%;height:100%;display:block;overflow:visible}
.rate .dtr{fill:none;stroke:var(--surface2);stroke-width:14}
.rate .dpg{fill:none;stroke:var(--fg);stroke-width:14;stroke-linecap:round}
.rate .dth{fill:var(--fg);stroke:var(--bg);stroke-width:4}
.rate .dial:focus-visible .dth{r:15}
.rate .dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.rate .dc .big{min-width:0;font-size:44px;line-height:1}
.rate .dc .ds{font-size:13px;color:var(--muted);margin-top:4px}
.rate .line{justify-content:center;gap:28px}

/* ---------- أداء: لا نرسم ما هو خارج الشاشة ---------- */
.row{content-visibility:auto;contain-intrinsic-size:auto 68px}
.post{content-visibility:auto;contain-intrinsic-size:auto 120px}
.poster,.sr .th,.qc .qi{contain:paint}
.matt{content-visibility:auto}
#authwrap{background:var(--sheen-bg),var(--bg)!important}
#authwrap>div{animation:vtin .4s ease-out backwards}
#authwrap .pg-h h1{font-size:30px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .sk::after{animation:none!important}
}

/* ---------- v13: شريط سفلي بفتحة منتصف + عرض شبكي + اقتراحات + لون العنصر الخافت ---------- */
#nav.nav{background:none;box-shadow:none;border:0;padding:0 0 env(safe-area-inset-bottom,0px)}
.nav-bg{position:absolute;left:0;right:0;bottom:0;height:calc(64px + env(safe-area-inset-bottom,0px));display:flex;direction:ltr;filter:drop-shadow(0 -5px 10px rgba(24,30,44,.09));pointer-events:none}
.nav-bg .nb-s{flex:1;display:block;background:var(--navbg);border-top:1px solid var(--line)}
.nav-bg .nb-c{width:128px;flex:none;display:flex;flex-direction:column}
.nav-bg .nb-svg{display:block;flex:none;margin-top:-24px;overflow:visible}
.nav-bg .nbf{flex:1;display:block;background:var(--navbg)}
.nd-f{fill:var(--navbg)}.nd-e{fill:none;stroke:var(--line);stroke-width:1}
.nd-v{fill:none;stroke:var(--fg);stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round;opacity:.5}
.nd-l{fill:var(--fg);opacity:.34}
#nav .nav-in{position:relative;max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 128px 1fr 1fr;align-items:center;height:64px}
#nav .tab.lib{height:64px;padding:0}
#nav .tab.lib .circ{position:absolute;top:-10px;left:50%;margin:0 0 0 -29px;width:58px;height:58px}
#nav .tab.lib.on .circ{box-shadow:0 0 0 3px var(--bg),0 0 0 4.5px var(--fg),var(--shadow)}
.seg.lay{flex:none}.seg.lay button{flex:none;padding:6px 9px;display:grid;place-items:center}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px 10px}
.gt{display:flex;flex-direction:column;gap:6px;text-align:start;min-width:0;width:100%}
.gt .gp{position:relative;display:block}
.gt .poster{width:100%}
.gt .gs{position:absolute;bottom:6px;inset-inline-start:6px;background:var(--bg);color:var(--fg);border-radius:999px;font-size:12px;font-weight:700;padding:2px 8px;box-shadow:var(--shadow);direction:ltr}
.gt .gn{font-size:13px;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.gt:active{transform:scale(.97)}
.rail{display:flex;gap:12px;overflow-x:auto;margin:0 -16px 6px;padding:2px 16px 10px;scrollbar-width:none;overscroll-behavior-x:contain}
.rail::-webkit-scrollbar{display:none}
.rc{flex:none;width:112px;display:flex;flex-direction:column;gap:6px;text-align:start}
.rc .poster{width:112px}
.rc .rn{font-size:13px;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.rc .rs{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc:active{transform:scale(.97)}
.sheet.tinted{position:relative;isolation:isolate}
.tint{position:absolute;left:0;right:0;top:0;height:340px;overflow:hidden;z-index:-1;pointer-events:none;border-radius:26px 26px 0 0;-webkit-mask-image:linear-gradient(#000 20%,transparent);mask-image:linear-gradient(#000 20%,transparent)}
.tint i{position:absolute;inset:-60px;display:block;background-size:cover;background-position:center;filter:blur(38px) saturate(1.4);opacity:.26}
.qc{position:relative;overflow:hidden;isolation:isolate}
.qc .qt{position:absolute;inset:-30px;z-index:-1;background-size:cover;background-position:center;filter:blur(26px) saturate(1.3);opacity:.22;pointer-events:none}

/* ---- v3: recent searches, bio, post images ---- */
.rslist{display:flex;flex-direction:column;gap:6px}
.rsrow{display:flex;align-items:center;gap:8px}
.rsb{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;background:var(--surface);text-align:start;font-size:15px}
.rsb svg{flex:none;color:var(--muted)}
.rsb span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rsx{flex:none;width:38px;height:38px;color:var(--muted)}
.pbio{margin:10px auto 0;max-width:420px;font-size:14.5px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;text-align:center}
.pimg{margin-top:10px}
.pimg img{display:block;max-width:100%;max-height:440px;border-radius:16px;border:1.5px solid var(--line);object-fit:cover;background:var(--surface2)}
.cpimg{display:flex;align-items:center;gap:10px;margin-top:10px}
.cpimg .pv{position:relative;width:96px;height:96px;border-radius:14px;background-size:cover;background-position:center;border:1.5px solid var(--line);flex:none}
textarea.inp#p-bio{height:auto;padding:12px 14px;line-height:1.55;resize:none}

.cmp-tot{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.cmp-tot .st span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp-row{background:var(--surface);border-radius:16px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--rim),0 1px 2px rgba(20,26,38,.06)}
.cmp-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-bottom:6px}
.cmp-b{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:13px}
.cmp-b .who{width:64px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12px}
.cmp-b .w{flex:1;display:block;min-width:0}
.cmp-b i{display:block;height:8px;min-width:3px;border-radius:4px;background:var(--fg)}
.cmp-b.o i{background:var(--muted)}
.cmp-b .n{min-width:26px;text-align:end;font-variant-numeric:tabular-nums;font-weight:600}

/* ===== v14: profile tabs, lists, collections, compare ===== */
.ptabs{display:flex;width:100vw;margin:4px calc(50% - 50vw) 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.ptabs button{flex:1;position:relative;padding:14px 8px 13px;font-size:15.5px;font-weight:500;color:var(--muted);transition:color .2s ease}
.ptabs button.on{color:var(--fg);font-weight:700}
.ptabs button::after{content:'';position:absolute;inset-inline:26%;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--fg);transform:scaleX(0);transition:transform .3s var(--spring)}
.ptabs button.on::after{transform:scaleX(1)}
.chev{flex:none;transform:none}
html[dir="ltr"] .chev{transform:scaleX(-1)}
.hl{display:inline-flex;align-items:center;gap:4px;font-size:20px;font-weight:700;padding:4px 0}
.hl .chev{color:var(--muted)}
.stats.in{margin:16px 0 6px}
button.st{width:100%}
button.st:active{transform:scale(.96)}
.st .go{display:inline-flex;align-items:center;gap:2px}
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:10px;border-radius:16px;background:var(--surface);margin-bottom:8px;box-shadow:var(--rim);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.lrow .lt{width:54px;height:54px;flex:none;border-radius:13px;background-color:var(--surface2);background-size:cover;background-position:center;display:grid;place-items:center;color:var(--muted)}
.lrow .lx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lrow .lx b{font-size:15.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .lx small{font-size:12.5px;color:var(--muted)}
.lrow .pn{color:var(--fg);flex:none}.lrow .pn svg{fill:currentColor}
.lrow .chev{color:var(--muted)}
.ldiv{height:2px;border-radius:2px;background:var(--line);margin:16px 4px}
.ltile{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.lt-hint{font-size:13px;color:var(--muted);margin:0 0 10px}
.lmenu{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.lmenu .btn{width:100%;justify-content:flex-start;gap:12px}
.pgt{display:flex;align-items:center;gap:8px;margin-inline-start:auto}
/* compare */
.cx{padding-bottom:20px}
.cx-top{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin:14px 0 8px;direction:ltr}
.cx-side{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 8px 16px;border-radius:22px;background:var(--surface);box-shadow:var(--rim);min-width:0;overflow:hidden}
.cx-side .pav{width:68px;height:68px;font-size:26px;border:3px solid var(--bg)}
.cx-side .nm{max-width:100%;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cx-side .big{font-size:46px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums}
.cx-side .lb{font-size:12.5px;color:var(--muted)}
.cx-side.l{animation:cxl .8s var(--spring) both}.cx-side.r{animation:cxr .8s var(--spring) both}
.cx-vs{width:46px;height:46px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:15px;z-index:2;animation:cxvs .9s var(--spring) .45s both}
.cx-side.win{animation:cxl .8s var(--spring) both,cxglow 1.4s ease-in-out 2.3s 2}
.cx-side.r.win{animation:cxr .8s var(--spring) both,cxglow 1.4s ease-in-out 2.3s 2}
.cx-crown{position:absolute;top:8px;inset-inline-end:10px;opacity:0;transform:translateY(-14px) scale(.4) rotate(-20deg);color:var(--fg)}
.cx-side.win .cx-crown{animation:cxcr .7s var(--spring) 2.2s forwards}
.cx-verdict{text-align:center;font-size:17px;font-weight:700;margin:14px 0 18px;opacity:0;transform:translateY(12px)}
.cx-verdict.go{animation:cxup .6s var(--ease) forwards}
.cx-row{background:var(--surface);border-radius:16px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--rim);opacity:0;transform:translateY(16px)}
.cx-row.go{animation:cxup .55s var(--ease) forwards}
.cx-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-bottom:8px}
.cx-b{display:flex;align-items:center;gap:8px;margin-top:6px;direction:ltr}
.cx-b .who{width:58px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12px}
.cx-b .w{flex:1;height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.cx-b i{display:block;height:100%;width:0;border-radius:5px;background:var(--fg);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.cx-b.o i{background:var(--muted)}
.cx-b .n{min-width:28px;text-align:end;font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.cx-conf{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cx-conf s{position:absolute;top:50%;width:7px;height:7px;border-radius:2px;background:var(--fg);opacity:0;text-decoration:none;animation:cxco 1.5s ease-out forwards}
@keyframes cxl{from{opacity:0;transform:translateX(-70px) scale(.9)}to{opacity:1;transform:none}}
@keyframes cxr{from{opacity:0;transform:translateX(70px) scale(.9)}to{opacity:1;transform:none}}
@keyframes cxvs{0%{opacity:0;transform:scale(0) rotate(-200deg)}70%{transform:scale(1.25) rotate(12deg)}100%{opacity:1;transform:none}}
@keyframes cxup{to{opacity:1;transform:none}}
@keyframes cxcr{to{opacity:1;transform:none}}
@keyframes cxglow{0%,100%{box-shadow:var(--rim)}50%{box-shadow:0 0 0 3px var(--fg),0 10px 30px rgba(0,0,0,.25)}}
@keyframes cxco{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rt))}}
@media (prefers-reduced-motion:reduce){.cx-side,.cx-vs,.cx-verdict,.cx-row,.cx-crown{animation:none!important;opacity:1!important;transform:none!important}.cx-b i{transition:none}}

/* ===== idk v14: إعدادات بصفوف + خيارات + تبويبات المكتبة ===== */
.setg{background:var(--surface);border-radius:20px;margin-bottom:12px;overflow:hidden;box-shadow:var(--rim);background-image:var(--gloss)}
.srow{display:flex;align-items:center;gap:12px;width:100%;padding:14px 14px;text-align:start;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .sri{flex:none;width:38px;height:38px;border-radius:12px;background:var(--surface2);display:grid;place-items:center}
.srow .srt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.srow .srt b{font-size:15.5px;font-weight:600}
.srow .srt small{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .chev{color:var(--muted)}
.srow:active{background:var(--surface2)}
.optl{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:16px;text-align:start}
.opt.on{border-color:var(--fg);font-weight:700}
.opt.lock{opacity:.55}
.optsub{font-size:13px;color:var(--muted);margin:16px 2px 8px;font-weight:600}
.lbt button{font-size:14px;padding:12px 2px 11px}
.lbt{margin-top:-6px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* ===== v15: خط آبل (SF Arabic) + لمعان عصري للنصوص ===== */
:root{
  --tg:linear-gradient(180deg,#1b1c15 0%,#3d3f2c 55%,#6a6b59 100%);
  --tg-shine:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);
  --tsh:0 1px 0 rgba(255,255,250,.7),0 2px 8px rgba(60,64,30,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme^="silver"]){
    --tg:linear-gradient(180deg,#ffffff 0%,#ebebdf 50%,#a9aa94 100%);
    --tsh:0 1px 10px rgba(190,194,150,.18);
  }
}
:root[data-theme="dark"]{--tg:linear-gradient(180deg,#ffffff 0%,#ebebdf 50%,#a9aa94 100%);--tsh:0 1px 10px rgba(190,194,150,.18)}
:root[data-theme="silver-light"]{--tg:linear-gradient(180deg,#0f1114 0%,#3a4150 60%,#5b6370 100%)}
:root[data-theme="silver-dark"]{--tg:linear-gradient(180deg,#fff 0%,#e8ebf0 50%,#8b93a1 100%)}
body{font-feature-settings:"kern","liga","calt";font-optical-sizing:auto;letter-spacing:0}
h1,h2,h3,.nm,.gn,.rn,.qn,b{letter-spacing:-.1px}
.pg-h h1,.hl,.sheet h3,.cs h3,.st b,.rate .big,.cx-side .big,.cx-verdict{
  background-image:var(--tg);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
.pg-h h1{font-weight:800;filter:drop-shadow(0 2px 6px rgba(60,64,30,.14))}
.sec-h h2{font-weight:700;text-shadow:var(--tsh)}
.row .nm,.gt .gn,.pc .nm,.rc .rn{text-shadow:var(--tsh);font-weight:600}
.score,.sc,.gs{text-shadow:0 1px 0 rgba(255,255,255,.18)}
.chip.on,.btn:not(.ghost):not(.line):not(.danger),.seg button.on,.pchip.on{text-shadow:0 1px 1px rgba(0,0,0,.28)}
.tab.on span{text-shadow:var(--tsh)}
/* لمعة تمرّ على عنوان الصفحة */
.pg-h h1{background-size:220% 100%}
.vt .pg-h h1{animation:tshine 2.6s var(--ease) .15s 1 both}
@keyframes tshine{0%{background-image:var(--tg-shine),var(--tg);background-position:130% 0,0 0}100%{background-image:var(--tg-shine),var(--tg);background-position:-130% 0,0 0}}
@media (prefers-reduced-motion:reduce){.vt .pg-h h1{animation:none}}

/* ---------- P: شاشة البداية + السحب للتحديث + مؤشرات التحميل ---------- */
html,body{overscroll-behavior-y:contain}
#boot{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);transition:opacity .45s ease,visibility .45s}
#boot.out{opacity:0;visibility:hidden;pointer-events:none}
#boot .bk{--c:74px;--g:12px;--d:4.8s;--h:14px}
.bk{--c:22px;--g:4px;--d:3.2s;--h:5px;--u:calc(var(--c) + var(--g));position:relative;display:block;width:calc(var(--c)*2 + var(--g));height:calc(var(--c)*2 + var(--g));transition:transform .5s var(--ease),opacity .45s ease}
#boot.out .bk{transform:scale(1.2);opacity:0}
.bk .b{position:absolute;left:0;top:0;width:var(--c);height:var(--c)}
.bk .k0{transform:translate(0,0);animation:bkM0 var(--d) .9s infinite backwards}
.bk .k1{transform:translate(var(--u),0);animation:bkM1 var(--d) .9s infinite backwards}
.bk .k2{transform:translate(var(--u),var(--u));animation:bkM2 var(--d) .9s infinite backwards}
.bk .k3{transform:translate(0,var(--u));animation:bkM3 var(--d) .9s infinite backwards}
.bk .j{position:absolute;inset:0;z-index:1;display:block;animation:bkJ calc(var(--d)/4) .9s infinite backwards}
.bk .j i{display:block;width:100%;height:100%;background:center/contain no-repeat;animation:bkIn .7s var(--spring,cubic-bezier(.34,1.56,.64,1)) calc(var(--k)*.1s) backwards}
.bk .b::after{content:"";position:absolute;left:12%;right:12%;bottom:-4%;height:12%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.28),transparent);animation:bkS calc(var(--d)/4) .9s infinite backwards}

<style id="v16">/* v16 */

  background-image:linear-gradient(135deg,var(--surface2),var(--surface) 55%,var(--surface2));}
.pbn::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.28) 0%,rgba(0,0,0,0) 38%,rgba(0,0,0,.16) 100%)}
.pbn[style*="url"]{background-size:cover}
.pbk{z-index:2;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);background:rgba(0,0,0,.35)!important}
.ph-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:-38px 4px 0;position:relative;z-index:1}
.ph-top .av{width:84px;height:84px;border:4px solid var(--bg);font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.ph-top .ph-acts{margin:0 0 4px;flex:none}
.ph-top .ph-acts .btn{flex:none;padding-inline:16px;min-height:42px;border-radius:14px}
.ph-info{text-align:start;margin:10px 4px 0}
.ph-info .pbio{margin:8px 0 0;max-width:none}
/* v17c: بنر أجمل */
.pbn{aspect-ratio:2.2/1!important;max-height:210px!important;border-radius:0 0 30px 30px!important;
  background-color:var(--surface2);
  background-image:radial-gradient(120% 140% at 85% 0%,color-mix(in srgb,var(--fg) 16%,transparent),transparent 60%),radial-gradient(90% 120% at 5% 100%,color-mix(in srgb,var(--fg) 10%,transparent),transparent 65%),repeating-linear-gradient(135deg,transparent 0 14px,color-mix(in srgb,var(--fg) 4%,transparent) 14px 15px)!important;}
.pbn[style*="url"]{background-image:none!important;background-size:cover!important;background-position:center!important}
.pbn::after{background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 34%),linear-gradient(0deg,var(--bg) 0%,transparent 28%)!important}
.pbn[style*="url"]::after{background:linear-gradient(180deg,rgba(0,0,0,.4) 0%,rgba(0,0,0,0) 35%),linear-gradient(0deg,color-mix(in srgb,var(--bg) 70%,transparent) 0%,transparent 30%)!important}
/* v17d: بدون بنر (مؤقتاً) */
.pbn,.pbn[style]{aspect-ratio:auto!important;height:48px!important;max-height:none!important;background:none!important;border-radius:0!important;margin-bottom:6px!important;overflow:visible}
.pbn::after{display:none!important}
.pbk{position:relative!important;top:0!important;inset-inline-start:0!important;background:var(--surface)!important;color:var(--fg)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.ph-top{margin-top:0!important}
.pavw .av{margin:0 auto 10px!important}
/* v17e: شريط علوي + بايو */
.hav.hav2{left:auto;inset-inline-start:0;top:4px}
.hav2 .pav{width:46px;height:46px;font-size:18px;border-width:2px}
.wmw{position:absolute;left:50%;top:6px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;max-width:calc(100% - 170px);pointer-events:none}
.wm{font-size:24px;font-weight:800;letter-spacing:.5px;line-height:1.15;background:linear-gradient(100deg,var(--fg) 30%,var(--muted) 50%,var(--fg) 70%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:wmshine 5s ease-in-out infinite;position:relative}
.wm::after{content:'';position:absolute;inset-inline-end:-9px;top:3px;width:6px;height:6px;border-radius:50%;background:var(--fg);opacity:.85}
@keyframes wmshine{0%,60%{background-position:100% 0}100%{background-position:-100% 0}}
@media (prefers-reduced-motion:reduce){.wm{animation:none}}
.wsub{font-size:11.5px;color:var(--muted);margin-top:1px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-info .psub{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:5px}
.ppill{font-size:12px;padding:2px 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.ph-info .pbio{margin:14px 0 0;padding:12px 14px;background:var(--surface);border-radius:14px;line-height:1.7;font-size:14.5px;opacity:1;white-space:pre-wrap;overflow-wrap:anywhere}
.ph-stats{margin-top:18px}
/* v18: شاشات الدخول */
#authwrap{background:radial-gradient(90% 55% at 50% -8%,color-mix(in srgb,var(--fg) 9%,transparent),transparent 70%),var(--bg)!important}
.aw{max-width:420px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative}
.aw-back{width:44px;height:44px;margin-inline-start:-10px;display:grid;place-items:center;background:none;border:0;color:var(--fg);border-radius:50%}
.aw-head{text-align:center;margin:4vh 0 26px}
.aw-head h1{margin:18px 0 6px;font-size:28px;font-weight:800;letter-spacing:-.2px}
.aw-head p{margin:0;color:var(--muted);font-size:14.5px}
.aub{display:inline-flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.4px;font-size:22px}
.aub-d{display:inline-flex;flex-direction:column;gap:3px}
.aub-d i{width:7px;height:7px;border-radius:50%;background:var(--fg);display:block;animation:aubp 1.8s ease-in-out infinite}
.aub-d i:nth-child(2){animation-delay:.2s;transform:translateX(3px)}.aub-d i:nth-child(3){animation-delay:.4s}
@keyframes aubp{0%,100%{opacity:1}50%{opacity:.25}}
.aub.big{font-size:46px;gap:14px}.aub.big .aub-d{gap:6px}.aub.big .aub-d i{width:13px;height:13px}
.aub-w{background:linear-gradient(100deg,var(--fg) 35%,var(--muted) 50%,var(--fg) 65%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:wmshine 5s ease-in-out infinite}
.aw-wel{min-height:calc(100vh - 44px);justify-content:space-between}
.aw-hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 8px}
.aw-tag{margin:18px 0 0;color:var(--muted);font-size:16px;line-height:1.7;max-width:20ch}
.aw-bot{padding-bottom:6px}
.auf{position:relative;margin-bottom:12px;direction:ltr}
.aui-in{width:100%;height:54px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);padding:0 50px;font-size:16px;transition:border-color .2s,box-shadow .25s}
.aui-in:focus{outline:none;border-color:var(--fg);box-shadow:0 0 0 4px rgba(128,140,160,.2)}
.aui{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--muted);display:grid;pointer-events:none}
.auf:focus-within .aui{color:var(--fg)}
.aue{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:40px;height:40px;display:grid;place-items:center;background:none;border:0;color:var(--muted);border-radius:50%}
.aw-fg{text-align:end;margin:-2px 6px 4px}
.aub-lnk{background:none;border:0;padding:6px 2px;color:var(--fg);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.aub-lnk.b{font-weight:700;font-size:inherit}
.aub-btn{display:flex;align-items:center;justify-content:center;width:100%;height:54px;border-radius:999px;font-size:16.5px;font-weight:700;margin-top:10px;transition:transform .15s var(--spring),opacity .2s}
.aub-btn:active{transform:scale(.98)}
.aub-btn:disabled{opacity:.55}
.aub-btn.pri{background:var(--fg);color:var(--bg);border:0}
.aub-btn.sec{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.aw>.srmsg,.aw-bot>.srmsg{text-align:center;min-height:20px;padding:6px 2px}
.aw-sw{text-align:center;color:var(--muted);font-size:14.5px;margin:22px 0 8px}
@media (prefers-reduced-motion:reduce){.aub-w,.aub-d i{animation:none}}
.aw-or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13.5px;margin:14px 6px 4px}
.aw-or::before,.aw-or::after{content:'';flex:1;height:1px;background:var(--line)}
#au-g{gap:10px}
/* زر Google مخفي مؤقتاً: احذف السطر التالي لإظهاره */
.aw-or,#au-g{display:none!important}

/* =====================================================================
   idk — الشكل الجديد (v3)
   نظام واحد: ألوان رمادية هادئة · أسطح مسطحة بخط شعري · شكل موحّد للأزرار
   · شريط سفلي عائم · رفوف خشب للكتب
   ===================================================================== */
:root{
  --bg:#ebebed; --fg:#1c1c1e; --surface:#f8f8f9; --surface2:#e2e2e6; --muted:#6c6c72; --line:rgba(28,28,30,.11);
  --ph1:#d6d6da; --ph2:#e8e8eb; --shadow:0 6px 18px rgba(0,0,0,.14);
  --navbg:rgba(250,250,251,.88); --rim:none; --gloss:none; --sheen-fg:none; --sheen-sheet:none;
  --sheen-bg:linear-gradient(180deg,#d3d3d7 0,rgba(211,211,215,0) 170px);
  --ok:#1f8a4c; --hair:rgba(0,0,0,.05); --soft:0 1px 2px rgba(0,0,0,.05),0 3px 10px rgba(0,0,0,.04);
  --pill:#ffffff; --pill-fg:#1c1c1e; --tg:none; --tsh:none;
  --wood1:#b98a5e; --wood2:#8d5c37; --wood3:#5f3b21;
  --r-ctl:14px; --r-card:20px; --ctl:42px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme^="silver"]){
    --bg:#0e0e10; --fg:#f2f2f4; --surface:#1b1b1e; --surface2:#2b2b30; --muted:#9d9da6; --line:rgba(255,255,255,.12);
    --ph1:#2a2a2f; --ph2:#18181b; --shadow:0 6px 18px rgba(0,0,0,.55);
    --navbg:rgba(28,28,31,.86); --rim:none; --gloss:none; --sheen-fg:none; --sheen-sheet:none;
    --sheen-bg:linear-gradient(180deg,#27272b 0,rgba(39,39,43,0) 170px);
    --hair:rgba(255,255,255,.07); --soft:0 1px 2px rgba(0,0,0,.35); --pill:#3a3a40; --pill-fg:#f2f2f4; --tg:none; --tsh:none;
    --wood1:#6b4a32; --wood2:#48301f; --wood3:#2d1d12;
  }
}
:root[data-theme="dark"]{
  --bg:#0e0e10; --fg:#f2f2f4; --surface:#1b1b1e; --surface2:#2b2b30; --muted:#9d9da6; --line:rgba(255,255,255,.12);
  --ph1:#2a2a2f; --ph2:#18181b; --shadow:0 6px 18px rgba(0,0,0,.55);
  --navbg:rgba(28,28,31,.86); --rim:none; --gloss:none; --sheen-fg:none; --sheen-sheet:none;
  --sheen-bg:linear-gradient(180deg,#27272b 0,rgba(39,39,43,0) 170px);
  --hair:rgba(255,255,255,.07); --soft:0 1px 2px rgba(0,0,0,.35); --pill:#3a3a40; --pill-fg:#f2f2f4; --tg:none; --tsh:none;
  --wood1:#6b4a32; --wood2:#48301f; --wood3:#2d1d12;
}

/* ---------- خطوط ---------- */
body{font-variant-numeric:tabular-nums}
.pg-h h1{font-size:30px;font-weight:800;letter-spacing:-.4px}
.sec-h h2{font-size:19px;font-weight:700}
.row .nm,.gt .gn,.pc .nm,.rc .rn{font-weight:600}

/* ---------- بلا لمعان ولا نص متدرج ---------- */
.pg-h h1,.hl,.sheet h3,.cs h3,.st b,.rate .big,.cx-side .big,.cx-verdict,.wm{
  background:none!important;-webkit-background-clip:border-box;background-clip:border-box;
  -webkit-text-fill-color:currentColor;color:var(--fg);filter:none;animation:none!important}
.sec-h h2,.row .nm,.gt .gn,.pc .nm,.rc .rn,.score,.sc,.gs,.tab.on span,
.chip.on,.btn:not(.ghost):not(.line):not(.danger),.seg button.on,.pchip.on{text-shadow:none}
.vt .pg-h h1{animation:none}
.p1 .pw{box-shadow:var(--shadow)}
.btn:not(.ghost):not(.line):not(.danger),.btn.danger.sure,.ic.on,.bub{box-shadow:none}
:root[data-theme="dark"] .btn:not(.ghost):not(.line):not(.danger),:root[data-theme="dark"] .chip.on,:root[data-theme="dark"] .seg button.on{box-shadow:none}
.sc{background:rgba(20,20,22,.86);box-shadow:none}

/* ---------- أيقونات: سماكة خط واحدة ---------- */
svg[aria-hidden="true"]{stroke-width:1.75}
.tab svg{stroke-width:1.7}.tab.on svg{stroke-width:2.1}
.btn svg,.chip svg{stroke-width:1.9}

/* ---------- شكل واحد للأزرار: مربع مدوّر 14 / كروت 20 / كبسولات للتصنيفات فقط ---------- */
.ico,.bell,.pbk,.hav .pav,.hav2 .pav{width:var(--ctl);height:var(--ctl)}
.ico,.bell,.pbk{border-radius:var(--r-ctl)!important}
.pg-h .ico:not(.bell){width:var(--ctl)!important;height:var(--ctl)!important;top:7px!important}
.pg-h>span[style*="inset-inline-end:54px"]{inset-inline-end:50px!important;top:7px!important}
.hav.hav2{top:7px}
.hav2 .pav,.hav .pav{border:0;border-radius:var(--r-ctl);font-size:17px;box-shadow:0 0 0 1px var(--hair),var(--soft)}
.wmw{top:12px}.wm{font-size:22px}
.pbk{background:var(--surface)!important;color:var(--fg)!important;border:1px solid var(--hair);box-shadow:var(--soft)}
.ico,.bell{background:var(--surface);border:1px solid var(--hair);box-shadow:var(--soft)}
.btn{border-radius:var(--r-ctl)}
.btn.line,.btn.danger{border-width:1px;border-color:var(--line)}
.row,.st,.cs,.src,.pa,.sr,.qc,.nt .ni,.mfile,.inp,.btn.ghost{border:1px solid var(--hair);box-shadow:var(--soft)}
.row{border-radius:16px}
.st{border-radius:var(--r-card)}
.setg{border-radius:var(--r-card);box-shadow:var(--soft);border:1px solid var(--hair)}
.srow .sri{border-radius:12px;background:var(--surface2)}
.seg{background:var(--surface2);box-shadow:none;border:0;border-radius:14px}
.seg button{border-radius:11px}
.seg button.on,.chip.on,.pchip.on{background:var(--pill);color:var(--pill-fg);background-image:none;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.chip{background:var(--surface);border:1px solid var(--hair);box-shadow:var(--soft)}
.chip.on{border-color:var(--hair)}
.inp{background:var(--surface);border-radius:16px}
.inp:focus{border-color:var(--line);box-shadow:0 0 0 3px rgba(120,120,130,.20)}
.btn.ghost{background:var(--surface)}
.empty{background:transparent;border:1.5px dashed var(--line);border-radius:var(--r-card);box-shadow:none}

/* ---------- تبويبات المكتبة: أرقام فوق الأسماء ---------- */
.ptabs{width:auto;margin:4px 0 14px;border:0;border-radius:16px;background:var(--surface2);padding:3px;gap:2px}
.ptabs button{padding:9px 2px;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:46px}
.ptabs button.on{background:var(--pill);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.ptabs button::after{display:none}
.lbt{margin-top:0}
.lbt button{padding:8px 2px}
.ptabs button i{font-style:normal;font-size:16px;font-weight:800;line-height:1.15;color:var(--fg)}
.ptabs button span{font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.ptabs button.on span{color:var(--fg)}

/* ---------- الأغلفة ---------- */
.poster{border-radius:10px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.poster::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(90deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 20%,rgba(255,255,255,0) 74%,rgba(0,0,0,.16) 100%)}
.gt .gs{background:var(--ok);color:#fff;box-shadow:none}
.score{border-color:var(--ok);color:var(--ok)}

/* ---------- الرف الخشبي ---------- */
.ggrid{gap:28px 10px;padding:2px 4px 4px}
.gt .gp{margin-bottom:6px;z-index:0;isolation:isolate}
.gt .poster{border-radius:4px 4px 1px 1px;box-shadow:0 1px 2px rgba(0,0,0,.25);position:relative;z-index:1}
.gt .gp::after{content:"";position:absolute;z-index:0;left:-6px;right:-6px;bottom:-9px;height:9px;border-radius:1px 1px 3px 3px;
  background:linear-gradient(180deg,var(--wood1) 0,var(--wood1) 18%,var(--wood2) 19%,var(--wood3) 100%);
  box-shadow:0 5px 7px -3px rgba(0,0,0,.35)}
.gt .gn{margin-top:10px;font-size:12.5px}
/* عرض الكعوب: ٦ في كل رف، العنوان عمودي على الكعب */
.ggrid.shelf{grid-template-columns:repeat(6,1fr);gap:34px 6px;padding:4px 8px 6px}
.gt.sp .gp{height:158px;margin-bottom:0}
.ggrid.shelf{margin:0 -8px;padding:6px 16px 8px;
  background-image:linear-gradient(180deg,transparent 0,transparent 158px,var(--wood1) 158px,var(--wood1) 160px,var(--wood2) 160px,var(--wood2) 164px,var(--wood3) 164px,var(--wood3) 167px,rgba(0,0,0,.16) 167px,rgba(0,0,0,0) 176px,transparent 192px);
  background-size:100% 192px;background-position:0 6px;background-repeat:repeat-y}
.gt.sp .gp::after{display:none}
.gt.sp .poster{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;border-radius:5px 5px 1px 1px;z-index:0}
.gt.sp .gp::before{content:"";position:absolute;inset:0;z-index:1;border-radius:5px 5px 1px 1px;pointer-events:none;
  background:linear-gradient(0deg,rgba(0,0,0,.62) 0%,rgba(0,0,0,.18) 55%,rgba(0,0,0,0) 80%)}
.gt.sp .spt{position:absolute;z-index:2;left:50%;bottom:9px;transform:translateX(-50%) rotate(180deg);writing-mode:vertical-rl;
  max-height:calc(100% - 46px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.15;
  font-size:12.5px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.gt.sp .gs{z-index:2;left:50%;right:auto;top:6px;bottom:auto;inset-inline-start:auto;transform:translateX(-50%);
  width:25px;height:25px;padding:0;border-radius:50%;display:grid;place-items:center;font-size:9.5px;font-weight:800;letter-spacing:-.2px;
  box-shadow:0 0 0 1.5px rgba(255,255,255,.92),0 1px 4px rgba(0,0,0,.4)}
.gt.sp .gs.wt{background:rgba(255,255,255,.94);color:#1c1c1e}
.gt.sp .gs svg{stroke-width:2.2}

/* ---------- الشريط السفلي العائم ---------- */
#nav.nav{left:50%;right:auto;transform:translateX(-50%);width:min(calc(100% - 24px),616px);bottom:calc(10px + env(safe-area-inset-bottom,0px));
  background:none;border:0;box-shadow:none;padding:0}
#nav .nav-in{display:flex;align-items:stretch;gap:2px;height:64px;padding:6px;margin:0;max-width:none;
  background:var(--navbg);border:1px solid var(--hair);border-radius:26px;
  box-shadow:0 8px 28px rgba(0,0,0,.14),0 1px 3px rgba(0,0,0,.06);
  -webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5)}
#nav .tab{flex:1;min-width:0;height:auto;padding:0;gap:3px;justify-content:center;border-radius:20px;font-size:10.5px;font-weight:600;color:var(--muted)}
#nav .tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#nav .tab.on{color:var(--fg)}
#nav .tab::before{display:block;top:0;left:0;right:0;bottom:0;width:auto;height:auto;margin:0;border-radius:20px;background:var(--surface2);opacity:0;transform:scale(.92)}
#nav .tab.on::before{opacity:1;transform:none}
:root[data-theme="dark"] #nav .tab.on::before{background:rgba(255,255,255,.1)}
.nav-bg,.nb-s,.nb-c{display:none!important}

/* ---------- زر الإضافة العائم: نفس شكل الأزرار ---------- */
.fabw{right:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.fab{width:54px;height:54px;border-radius:19px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.fabo{border-radius:var(--r-ctl);border:1px solid var(--hair);background:var(--surface);box-shadow:var(--soft)}
.toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
#app{padding-bottom:128px}

/* ---------- الملف الشخصي ---------- */
.pbn,.pbn[style]{width:auto!important;margin:0 0 6px!important;height:var(--ctl)!important;display:flex;align-items:center}
.pbn .pbk{position:relative!important}
.hav2 .pav,.hav .pav,.ph-top .av,.pavw .av{border-radius:50%}
.hav2 .pav{box-shadow:0 0 0 1px var(--hair),var(--soft)}
.ph-top{margin:4px 2px 0!important;align-items:center}
.ph-top .av{width:78px;height:78px;border:0;box-shadow:0 0 0 1px var(--hair),var(--soft)}
.ph-info{margin:12px 2px 0}
:root[dir="rtl"] .ph-info .pname{direction:rtl;text-align:start}
.ph-stats{display:grid;grid-template-columns:repeat(3,1fr);margin:16px 0 8px;background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-card);box-shadow:var(--soft);overflow:hidden}
.ph-stats>button{padding:13px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.ph-stats>button+button{border-inline-start:1px solid var(--hair)}
.ph-stats b{font-size:20px;font-weight:800}

function normT(s){

    .replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي')
    .replace(/[^a-z0-9\u0600-\u06FF\u0400-\u04FF\u3040-\u30ff\u4e00-\u9fff\uac00-\ud7af]+/g, ' ')
    .replace(/(^| )ال(?=\S{2})/g, '$1').replace(/\s+/g, ' ').trim();

function dice(a, b){
  if(a.length < 2 || b.length < 2) return a === b ? 1 : 0;
  var m = {}, i, hit = 0;
  for(i = 0; i < a.length - 1; i++){ var g = a.substr(i, 2); m[g] = (m[g] || 0) + 1; }
  for(i = 0; i < b.length - 1; i++){ var h = b.substr(i, 2); if(m[h] > 0){ m[h]--; hit++; } }
  return 2 * hit / (a.length + b.length - 2);
}
function scoreT(title, targets){
  var a = normT(title), best = 0;
  if(!a) return 0;
  targets.forEach(function(t){
    var b = normT(t); if(!b) return; var s = 0;
    if(a === b) s = 100;
    else if(a.indexOf(b) === 0) s = 80;
    else if((' ' + a + ' ').indexOf(' ' + b + ' ') > -1) s = 70;
    else if(a.indexOf(b) > -1) s = 60;
    else if(b.indexOf(a) > -1 && a.length > 2) s = 45;
    else{
      var ta = a.split(' '), tb = b.split(' '), hit = 0;
      tb.forEach(function(w){ if(ta.indexOf(w) > -1) hit++; });
      s = Math.max(40 * hit / tb.length, 55 * dice(a, b));
    }
    if(s > best) best = s;
  });
  return best;
}
function mergeRank(lists, targets, lim){
  var map = {}, order = [];

      var k = normT(r.title); if(!k) return;
      var e = map[k];

      else{ if(!e.r.img && r.img) e.r.img = r.img; if(!e.r.sub && r.sub) e.r.sub = r.sub; }
    });
  });
  var arr = order.map(function(k){ var e = map[k]; e.sc = scoreT(e.r.title, targets) + (e.r.img ? 3 : 0); return e; })
    .sort(function(x, y){ return (y.sc - x.sc) || (x.pri - y.pri); });
  if(arr.length && arr[0].sc >= 60) arr = arr.filter(function(e){ return e.sc >= 20; });

}

// q = ما كتبه المستخدم، en = اسمه الإنجليزي إن وُجد (للمصادر الإنجليزية فقط)
function smartSearch(type, q, retried){
  q = String(q || '').trim();
  return resolveNames(q, type).then(function(nm){
    var en = (hasArabic(q) && nm.en[0]) || q, targets = [q].concat(nm.en);
    var jobs = srcPromises(type, q, en);
    if(!jobs.length) return Promise.reject(new Error('nosrc'));
    return Promise.all(jobs.map(function(p){
      return p.then(function(l){ return {ok:true, l:l}; }, function(){ return {ok:false, l:[]}; });
    })).then(function(rs){
      if(!rs.some(function(r){ return r.ok; })) throw new Error('network');
      var out = mergeRank(rs.map(function(r){ return r.l; }), targets, 10), words = q.split(/\s+/);
      if(!out.length && !retried && words.length > 1) return smartSearch(type, words.slice(0, -1).join(' '), true);
      return out;
    });
  });
}

  if(src === 'anime' || src === 'manga' || src === 'manhua' || src === 'manhwa'){ if(!srcOn('anilist')) return Promise.reject(new Error('nosrc')); return sAniList(src, q); }

function discTypes(q){ return dtype === 'all' ? ALLTYPES.slice() : [dtype]; }

function discBody(){
  if(dq.trim().length < 2){
    return rsHTML('disc') || '<div class="empty"><b>اكتشف عناوين جديدة</b>اكتب اسماً للبحث في المصادر، ثم اضغط على النتيجة لإضافتها وتقييمها.</div>';
  }

  var note = '';

    var r = dRes[t]; if(!r) return;

    if(r.state === 'err'){ errs++; out += discHdr(t) + (r.msg === 'nosrc' ? '<div class="srmsg">لا توجد مصادر مفعّلة لهذا الصنف حالياً.</div>' : '<div class="srmsg">تعذّر الاتصال بالمصدر.<br><small dir="ltr">' + esc(r.msg || '') + '</small></div>'); return; }

  draft.rating = v; _dr.v = v;
  if(!_dr.raf) _dr.raf = requestAnimationFrame(paintDial);
}
function initDial(){
  var dl = $('#dial'); if(!dl) return;
  _dr.shown = -1;
  var drag = false, last = draft.rating, cx = 0, cy = 0;
  function val(e){
    var x = e.clientX - cx, y = e.clientY - cy;
    var ang = Math.atan2(y, x) + Math.PI / 2; if(ang < 0) ang += 2 * Math.PI;
    return Math.round(ang / (2 * Math.PI) * 100) / 10;
  }
  function move(e, first){
    var v = val(e);
    if(!first){ if(last > 8 && v < 2) v = 10; else if(last < 2 && v > 8) v = 0; }   // لا قفز بين 0 و10
    if(v === last) return;
    last = v; setRating(v);
  }
  dl.addEventListener('pointerdown', function(e){
    var r = dl.getBoundingClientRect(); cx = r.left + r.width / 2; cy = r.top + r.height / 2;   // مرة واحدة بدل كل حركة
    drag = true; try{ dl.setPointerCapture(e.pointerId); }catch(x){} move(e, true); e.preventDefault();
  });
  dl.addEventListener('pointermove', function(e){ if(drag) move(e, false); });
  ['pointerup', 'pointercancel'].forEach(function(n){ dl.addEventListener(n, function(){ drag = false; }); });
  dl.addEventListener('keydown', function(e){
    var d = (e.key === 'ArrowRight' || e.key === 'ArrowUp') ? .1 : (e.key === 'ArrowLeft' || e.key === 'ArrowDown') ? -.1 : 0;
    if(d){ e.preventDefault(); setRating(draft.rating + d); }
  });
  setRating(draft.rating);
}
