function saveItem(cb){
  var name = $('#f-name').value.trim();
  if(!name){ toast('أدخل الاسم أولاً'); $('#f-name').focus(); return; }
  var cat = draft.lockCat ? draft.cat : $('#f-cat').value, note = String(draft.note || '').trim(), id = draft.id || uid();
  var sv0 = draft.src; if(sv0 && draft.srcName && !draft.lockCat){ sv0 = dice(normT(name), normT(draft.srcName)) >= .5; }
  var f = {name:name, cat:cat, img:draft.img, rating:draft.rating, note:(draft.status === 'planned' ? '' : note), status:draft.status, date:(draft.status === 'done' ? $('#f-date').value : ''), src:(sv0 == null ? undefined : !!sv0)};
  var i = draft.id ? state.items.findIndex(function(x){ return x.id === draft.id; }) : -1;
  if(i > -1) state.items[i] = Object.assign({}, state.items[i], f);
  else state.items.push(Object.assign({id:id, added:Date.now()}, f));
  state.lists.forEach(function(l){ l.ids = l.ids.filter(function(x){ return x !== id; }); if(draft.lists.indexOf(l.id) > -1) l.ids.push(id); });
  state.active = cat;
  if(typeof cb === 'function'){ draft.id = id; save(); render(); cb(id); return; }
  save(); closeSheet(); render();
}

function saveCat(){
  var name = $('#c-name').value.trim();
  if(!name){ toast('أدخل اسم التصنيف'); $('#c-name').focus(); return; }
  if(catDraft.id){
    var c = catById(catDraft.id);
    if(!c || c.main){ closeSheet(); return; }
    c.name = name; c.icon = catDraft.icon; if(catDraft.img) c.img = catDraft.img; else delete c.img;
  }else{
    var n = {id:uid(), name:name, icon:catDraft.icon, source:catDraft.source || 'none'};
    if(catDraft.img) n.img = catDraft.img;
    state.cats.push(n); state.active = n.id; view = 'library';
  }

function isArtCat(catId){
  var c = catById(catId), s = String((c && c.source) || catId || '').replace(/s$/, '');

function statKind(catId){
  var c = catById(catId), s = String((c && c.source) || catId || '').replace(/s$/, '');
  if(/^(book|comic|manga|manhwa|manhua)$/.test(s)) return 'read';
  if(/^(album|song|artist)$/.test(s)) return 'listen';
  if(/^game$/.test(s)) return 'play';
  if(s === 'none') return 'gen';
  return 'watch';
}

function trKeys(){
  if(!trKeys.c || trKeys.stale){
    var ks = Object.keys(EN);
    if(!trKeys.c || ks.length !== trKeys.n){
      trKeys.n = ks.length; trCache.clear();
      trKeys.c = ks.filter(function(k){ return /[\u0600-\u06FF]/.test(k) && k.length > 2; }).sort(function(a, b){ return b.length - a.length; });
    }
    trKeys.stale = false;
  }
  return trKeys.c;
}
var trCache = new Map(), TR_AR = /[\u0600-\u06FF]/;
function trStr(v, el){
  var t = v.trim(); if(!t) return v;
  if(EN[t]) return v.replace(t, EN[t]);
  if(!TR_AR.test(t)) return v;
  var auto = !!(el && el.closest && el.closest('[dir="auto"]'));
  var ck = (auto ? '1' : '0') + v, hit = trCache.get(ck);
  if(hit !== undefined) return hit;
  var out = v;
  trKeys().forEach(function(k){ if(out.indexOf(k) > -1) out = out.split(k).join(EN[k]); });
  if(auto && TR_AR.test(out)) out = v; else out = out.replace(/،/g, ',').replace(/؟/g, '?');
  if(trCache.size > 4000) trCache.clear();
  trCache.set(ck, out);
  return out;
}
var trBusy = false, trSeenEn = false, trQ = new Set();
function trNode(root){
  if(root.nodeType === 3){ var nv = trStr(root.nodeValue, root.parentNode); if(nv !== root.nodeValue) root.nodeValue = nv; return; }
  if(root.nodeType !== 1) return;
  var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), n;
  while((n = w.nextNode())){ var v = n.nodeValue; if(!v || !TR_AR.test(v)) continue; var x = trStr(v, n.parentNode); if(x !== v) n.nodeValue = x; }
  var els = root.querySelectorAll('[placeholder],[aria-label],[title],[alt]');
  if(root.matches && root.matches('[placeholder],[aria-label],[title],[alt]')) trAttrs(root);
  for(var i = 0; i < els.length; i++) trAttrs(els[i]);
}
function trAttrs(el){
  ['placeholder','aria-label','title','alt'].forEach(function(a){ var v = el.getAttribute(a); if(v && TR_AR.test(v)){ var nv = trStr(v, el); if(nv !== v) el.setAttribute(a, nv); } });
}
function trAll(){
  if(!isEn() || trBusy) return; trBusy = true; trQ.clear(); trKeys.stale = true;
  try{ trNode(document.body); }finally{ trBusy = false; }
}
var trPend = false;
function trFlush(){
  trPend = false; if(!isEn()) { trSeenEn = false; trQ.clear(); return; }
  if(!trSeenEn){ trSeenEn = true; trAll(); return; }   /* first pass after switching to English: full sweep */
  trBusy = true; trKeys.stale = true;
  try{ var q = Array.from(trQ); trQ.clear(); q.forEach(function(n){ if(n.isConnected) trNode(n); }); }finally{ trBusy = false; }
}
new MutationObserver(function(ms){
  if(trBusy || !isEn()) return;
  for(var i = 0; i < ms.length; i++){
    var m = ms[i];
    if(m.type === 'characterData') trQ.add(m.target);
    else for(var j = 0; j < m.addedNodes.length; j++) trQ.add(m.addedNodes[j]);
  }
  if(!trPend && trQ.size){ trPend = true; requestAnimationFrame(trFlush); }
}).observe(document.body, {childList:true, subtree:true, characterData:true});

function pxSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }

// بصمة بيانات المستخدم (تصنيفات + عناصر + قوائم) لمعرفة هل تغيّر شيء محلياً
function pxDataSig(){ try{ return JSON.stringify([state.cats, state.items, state.lists]); }catch(e){ return ''; } }

/* ----- رسائل الأخطاء بالعربية (لا تظهر نصوصاً إنجليزية خام للمستخدم) ----- */
function mapErr(e){
  var m = String((e && (e.message || e.error_description)) || e || ''), s = +(e && e.status) || 0;
  if(/invalid login|invalid credentials/i.test(m)) return L('البريد أو كلمة المرور غير صحيحة.', 'Wrong email or password.');
  if(/not confirmed/i.test(m)) return L('أكّد بريدك من الرسالة المرسلة إليك ثم سجّل الدخول.', 'Confirm your email from the message we sent, then sign in.');
  if(/already registered|already been registered|user_already_exists/i.test(m)) return L('هذا البريد مسجّل مسبقاً.', 'This email is already registered.');
  if(/password/i.test(m) && /(least|short|weak|characters)/i.test(m)) return L('كلمة المرور ضعيفة، استخدم 6 أحرف على الأقل.', 'Weak password, use at least 6 characters.');
  if(/invalid.*email|unable to validate email|email address.*invalid/i.test(m)) return L('البريد الإلكتروني غير صالح.', 'Invalid email address.');
  if(/signups? .*(not allowed|disabled)/i.test(m)) return L('التسجيل مغلق حالياً.', 'Sign-ups are currently closed.');
  if(/database error/i.test(m)) return L('اسم المستخدم مستخدم مسبقاً أو غير صالح.', 'Username is taken or invalid.');
  if(/rate limit|too many|over_.*_limit/i.test(m) || s === 429) return L('محاولات كثيرة، انتظر قليلاً ثم أعد المحاولة.', 'Too many attempts, wait a bit and try again.');
  if((e && e.timeout) || /timed? ?out|timeout/i.test(m)) return L('الاتصال بطيء، حاول مرة أخرى.', 'Slow connection, try again.');
  if(/fetch|network|load failed/i.test(m)) return L('تعذّر الاتصال، تحقق من الإنترنت.', 'Could not connect, check your internet.');
  return L('حدث خطأ غير متوقع، حاول مرة أخرى.', 'Something went wrong, try again.') + ' (' + m.slice(0, 80) + ')';
}

/* ----- تحميل مكتبة Supabase يدوياً إن فشل التحميل الأول (مع بديل) ----- */
function pxLoadLib(cb){
  var urls = ['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js', 'https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js'], i = 0;
  (function next(){
    if(window.supabase && window.supabase.createClient) return cb(true);
    if(i >= urls.length) return cb(false);
    var s = document.createElement('script'); s.src = urls[i++]; s.crossOrigin = 'anonymous';
    s.onload = next; s.onerror = next; document.head.appendChild(s);
  })();
}

/* ----- شاشة الدخول / إنشاء الحساب ----- */
function authScreen(msg, mode, mailVal){
  try{ applyTheme(); }catch(e){}
  try{ window.bootHide && window.bootHide(); }catch(e){}
  var up = mode === 'up', el = document.getElementById('authwrap');
  if(!el){ el = document.createElement('div'); el.id = 'authwrap'; document.body.appendChild(el); }
  el.style.cssText = 'position:fixed;inset:0;z-index:1000;background:var(--bg);color:var(--fg,inherit);overflow:auto;padding:24px 18px';
  var libOk = !!(window.supabase && window.supabase.createClient);
  el.innerHTML = '<div style="max-width:420px;margin:6vh auto 0"><div class="pg-h"><h1>' + (up ? L('إنشاء حساب جديد', 'Create account') : L('تسجيل الدخول', 'Sign in')) + '</h1></div>' +
    (up ? '<div class="field"><label class="l" for="au-name">' + L('الاسم', 'Name') + '</label><input class="inp" id="au-name" dir="auto" maxlength="30" autocomplete="name" enterkeyhint="next"></div>' +
      '<div class="field"><label class="l" for="au-user">' + L('اسم المستخدم (إنجليزي، بدون مسافات)', 'Username (English letters, no spaces)') + '</label><input class="inp" id="au-user" dir="ltr" maxlength="32" placeholder="username" autocapitalize="off" spellcheck="false" autocomplete="off" enterkeyhint="next"></div>' : '') +
    '<div class="field"><label class="l" for="au-mail">' + L('البريد الإلكتروني', 'Email') + '</label><input class="inp" id="au-mail" type="email" inputmode="email" dir="ltr" autocomplete="email" autocapitalize="off" spellcheck="false" enterkeyhint="next"></div>' +
    '<div class="field"><label class="l" for="au-pass">' + L('كلمة المرور', 'Password') + '</label><div style="position:relative"><input class="inp" id="au-pass" type="password" dir="ltr" style="padding-inline-end:64px" enterkeyhint="go" autocomplete="' + (up ? 'new-password' : 'current-password') + '">' +
      '<button type="button" id="au-eye" style="position:absolute;inset-inline-end:4px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);padding:10px;font-size:13px;cursor:pointer">' + L('إظهار', 'Show') + '</button></div></div>' +
    '<div class="srmsg" id="au-msg" role="status">' + esc(msg || '') + '</div>' +
    '<div class="acts"><button class="btn" id="au-go" style="width:100%">' + (up ? L('إنشاء الحساب', 'Create account') : L('دخول', 'Sign in')) + '</button></div>' +
    '<div class="acts"><button class="btn line" id="au-sw" style="width:100%">' + (up ? L('لدي حساب', 'I have an account') : L('إنشاء حساب جديد', 'Create account')) + '</button></div>' +
    (libOk ? '' : '<div class="acts"><button class="btn ghost" id="au-retry" style="width:100%">' + L('إعادة تحميل الاتصال', 'Retry connection') + '</button></div>') + '</div>';
  if(!up){ var fg = document.createElement('div'); fg.className = 'acts'; fg.innerHTML = '<button class="btn ghost" data-act="pw-forgot" style="width:100%">' + L('نسيت كلمة المرور؟', 'Forgot password?') + '</button>'; el.firstChild.appendChild(fg); }
  var ids = up ? ['au-name', 'au-user', 'au-mail', 'au-pass'] : ['au-mail', 'au-pass'];
  // زر Enter ينقل للحقل التالي، وفي آخر حقل ينفّذ الدخول
  ids.forEach(function(id, i){
    document.getElementById(id).onkeydown = function(e){
      if(e.key !== 'Enter') return; e.preventDefault();
      if(i < ids.length - 1) document.getElementById(ids[i + 1]).focus(); else authGo(up);
    };
  });
  if(mailVal) document.getElementById('au-mail').value = mailVal;
  document.getElementById('au-go').onclick = function(){ authGo(up); };
  document.getElementById('au-sw').onclick = function(){ authScreen('', up ? 'in' : 'up', (document.getElementById('au-mail') || {}).value); };
  document.getElementById('au-eye').onclick = function(){
    var p = document.getElementById('au-pass'), show = p.type === 'password'; p.type = show ? 'text' : 'password';
    this.textContent = show ? L('إخفاء', 'Hide') : L('إظهار', 'Show');
  };
  var rt = document.getElementById('au-retry');
  if(rt) rt.onclick = function(){ rt.disabled = true; authMsg(L('جارٍ إعادة المحاولة…', 'Retrying…')); pxLoadLib(function(ok){ if(ok) cloudBoot(); else { authScreen(L('تعذّر تحميل مكتبة الاتصال. تحقق من الإنترنت ثم أعد المحاولة.', 'Could not load the connection library. Check your internet and retry.'), mode); } }); };

function authMsg(t){ var m = document.getElementById('au-msg'); if(m) m.textContent = t; }
// حالة "جارٍ التنفيذ": تعطيل الأزرار والحقول لمنع الضغط المزدوج
function authBusy(on, up){
  var go = document.getElementById('au-go'); if(!go) return;
  go.disabled = on;
  go.textContent = on ? L('لحظة…', 'One moment…') : (up ? L('إنشاء الحساب', 'Create account') : L('دخول', 'Sign in'));
  ['au-name', 'au-user', 'au-mail', 'au-pass'].forEach(function(id){ var x = document.getElementById(id); if(x) x.readOnly = on; });
}
function authGo(up){
  var go = document.getElementById('au-go'); if(!go || go.disabled) return;
  // المكتبة لم تُحمَّل بعد: لا نعطّل الزر ولا نترك المستخدم بلا رد (كان الزر يعلق سابقاً)
  if(!sbc){
    authMsg(L('الاتصال لم يجهز بعد، حاول بعد لحظة.', 'Connection is not ready yet, try again in a moment.'));
    pxLoadLib(function(ok){ if(ok) cloudBoot(); });
    return;
  }
  var mail = document.getElementById('au-mail').value.trim().toLowerCase(), pass = document.getElementById('au-pass').value;
  if(!mail || !pass){ authMsg(L('أدخل البريد وكلمة المرور.', 'Enter your email and password.')); return; }
  if(!/^\S+@\S+\.\S+$/.test(mail)){ authMsg(L('البريد الإلكتروني غير صالح.', 'Invalid email address.')); return; }
  if(navigator.onLine === false){ authMsg(L('لا يوجد اتصال بالإنترنت.', 'No internet connection.')); return; }
  authMsg(''); authBusy(true, up);
  var fail = function(e){ authMsg(mapErr(e)); authBusy(false, up); };

  if(!up){
    // دخول: نعيد المحاولة تلقائياً مرتين إن كان الخطأ شبكة/خادم، ولا نعيد عند كلمة مرور خاطئة
    pxRetry(function(){
      return pxTimeout(sbc.auth.signInWithPassword({email:mail, password:pass}), 15000).then(function(r){
        if(r && r.error && pxTransient(r.error)) throw r.error;
        return r;
      });
    }, 3, 600).then(function(r){
      if(r.error){ fail(r.error); return; }
      return startCloud(r.data.user);
    }).catch(fail);
    return;
  }

  var name = document.getElementById('au-name').value.trim(), user = document.getElementById('au-user').value.trim().toLowerCase();
  var agr = document.getElementById('au-agree'); if(!(agr && agr.checked)){ authMsg(L('وافق على شروط الاستخدام وسياسة الخصوصية للمتابعة.', 'Accept the Terms of Use and Privacy Policy to continue.')); authBusy(false, up); return; }
  if(!/^[a-z0-9_.]{2,32}$/.test(user) || /\.\.|^\.|\.$/.test(user)){ authMsg(L('اسم المستخدم: من 2 إلى 32 حرفاً إنجليزياً صغيراً أو أرقاماً أو _ أو . (بدون نقطتين متتاليتين ولا نقطة في الطرفين)', 'Username: 2 to 32 lowercase English letters, numbers, _ or . (no double or edge periods)')); authBusy(false, up); return; }
  if(pass.length < 8){ authMsg(L('كلمة المرور 8 أحرف على الأقل.', 'Password must be at least 8 characters.')); authBusy(false, up); return; }

  // فحص توفر الاسم: إن فشل الفحص نفسه (شبكة أو دالة غير موجودة) لا نمنع التسجيل، والقاعدة ترفض المكرر
  pxTimeout(sbc.rpc('username_available', {u:user}), 10000).then(function(r){ return (r && !r.error) ? !!r.data : true; }, function(){ return true; })
  .then(function(free){
    if(!free){ authMsg(L('اسم المستخدم مستخدم، اختر غيره.', 'Username is taken, choose another.')); authBusy(false, up); return; }
    return pxTimeout(sbc.auth.signUp({email:mail, password:pass, options:{data:{username:user, name:name, terms_accepted_at:new Date().toISOString(), terms_version:APP_CFG.updated}}}), 20000).then(function(s){
      if(s.error){ fail(s.error); return; }
      var u = s.data && s.data.user;
      // Supabase يرجع مستخدماً بدون identities عندما يكون البريد مسجّلاً أصلاً (حماية من كشف الحسابات)
      if(u && u.identities && !u.identities.length){ authMsg(L('هذا البريد مسجّل مسبقاً.', 'This email is already registered.')); authBusy(false, up); return; }
      if(s.data && s.data.session) return startCloud(u);   // الحساب جاهز: ندخل التطبيق مباشرة
      // لا توجد جلسة: على الأغلب "تأكيد البريد" مفعّل في إعدادات Supabase. نجرّب الدخول فوراً قبل أن نطلب من المستخدم أي شيء
      return pxTimeout(sbc.auth.signInWithPassword({email:mail, password:pass}), 15000).then(function(r){
        if(!r.error && r.data && r.data.session) return startCloud(r.data.user);
        if(r.error && /not confirmed/i.test(r.error.message || '')) authScreen(L('تم إنشاء الحساب. أكّد بريدك من الرسالة المرسلة إليك ثم سجّل الدخول.', 'Account created. Confirm your email from the message we sent, then sign in.'), 'in', mail);
        else authScreen(r.error ? mapErr(r.error) : '', 'in', mail);
      });
    });
  }).catch(fail);
}

/* ----- تسجيل الخروج: نرسل أي تعديلات معلّقة أولاً حتى لا تضيع ----- */
function doLogout(){
  var flush = (CL.uid && CL.snap && (CL.pending || pxGet(PX_DIRTY) === '1')) ?
    Promise.race([syncNow().catch(function(){}), new Promise(function(r){ setTimeout(r, 3000); })]) : Promise.resolve();
  var reload = function(){ location.reload(); };
  flush.then(function(){
    CL.uid = null; CL.snap = null; clearInterval(CL.poll); clearTimeout(CL.timer);
    pxSet(PX_UID, ''); pxSet(PX_DIRTY, '0');
    var keep = state.settings; state = JSON.parse(JSON.stringify(DEFAULT)); state.settings = keep;
    return _saveLocal();
  }).then(function(){ return sbc ? pxTimeout(sbc.auth.signOut(), 5000) : null; }).catch(function(){}).then(function(){
    try{ Object.keys(localStorage).forEach(function(k){ if(/^sb-.+-auth-token/.test(k)) localStorage.removeItem(k); }); }catch(e){}
  }).then(reload, reload);
}
document.addEventListener('click', function(e){ if(e.target.closest('[data-act="logout"]')) doLogout(); });

/* ----- الإقلاع ----- */
// المستخدم المخزَّن من جلسة Supabase في الجهاز (قراءة فورية بدون شبكة)
function pxStoredUser(){
  try{
    for(var i = 0; i < localStorage.length; i++){
      var k = localStorage.key(i);
      if(/^sb-.+-auth-token$/.test(k)){
        var v = JSON.parse(localStorage.getItem(k)), u = v && (v.user || (v.currentSession && v.currentSession.user));
        if(u && u.id) return u;
      }
    }
  }catch(e){}
  return null;
}
function pxHasCache(){ return !!(state && state.profile && state.profile.username && state.cats && state.cats.length); }
// إعادة رسم هادئة: لا نقاطع المستخدم وهو يكتب أو وفي صفحة منبثقة مفتوحة
function pxSoftRender(only){
  if(only && only.indexOf(view) < 0) return;
  var a = document.activeElement;
  if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
  if(layer.innerHTML.trim() || view === 'chat' || view === 'comm') return;
  try{ render(); }catch(e){ try{ console.error(e); }catch(x){} }
}
function pxEnter(){
  var w = document.getElementById('authwrap'); if(w) w.remove();
  view = 'home'; render();
}
// فتح فوري من النسخة المحفوظة على الجهاز (بدون أي طلب شبكة، وقبل حتى تحميل المكتبة)
function pxWarmOpen(user){
  CL.user = user; CL.uid = user.id; CL.email = user.email || '';
  CL.uById[CL.uid] = state.profile.username; CL.idOf[state.profile.username] = CL.uid;
  CL.bio = pxGet(PX_BIO) !== '0';
  CL.warmSig = pxDataSig();
  migrate(); pxEnter();
  CL.warm = true;
}
function startCloud(user){
  CL.user = user; CL.uid = user.id; CL.email = user.email || '';
  if(CL.warm){ pxRefresh(0); return Promise.resolve(); }
  // أول دخول على هذا الجهاز (أو بعد تسجيل خروج): تحميل كامل مع إعادة محاولة، والتحميل غير الحرج (الأصدقاء والمحادثات) يتأخر للخلفية
  return pullAll(state).then(function(){
    pxAfterPull(); pxEnter(); startPoll(); cloudSchedule(); srcFetch(); probePostImg(); pxSocial(); pxWarmImages();
  }).catch(function(e){ pxPullFail(e, user); });
}
function pxAfterPull(){
  migrate(); _saveLocal();
  pxSet(PX_UID, CL.uid); pxSet(PX_BIO, CL.bio ? '1' : '0');
}
// تحديث بصمت من الخادم بعد الفتح الفوري
function pxRefresh(n){
  if(CL.refreshing || !sbc || !CL.uid) return;
  CL.refreshing = true;
  var user = CL.user, before = pxDataSig() + JSON.stringify(state.profile);
  pullAll(state).then(function(){
    CL.refreshing = false; CL.warm = false;
    pxAfterPull(); startPoll(); cloudSchedule(); srcFetch(); probePostImg();
    if(pxDataSig() + JSON.stringify(state.profile) !== before) pxSoftRender();
    pxSocial(); pxWarmImages();
  }).catch(function(e){
    CL.refreshing = false;
    if((e && e.banned) || pxAuthErr(e)){ pxPullFail(e, user); return; }
    try{ console.error(e); }catch(x){}
    // شبكة ضعيفة: التطبيق يبقى شغالاً من النسخة المحلية، ونعيد المحاولة بالخلفية
    if(n === 1) toast(L('تعذّر تحديث بياناتك الآن، سنعيد المحاولة تلقائياً.', 'Could not refresh now, retrying automatically.'));
    if(n < 8) setTimeout(function(){ if(CL.uid && !CL.snap) pxRefresh(n + 1); }, Math.min(30000, 3000 * (n + 1)));
  });
}
window.addEventListener('online', function(){
  if(!CL.uid || !sbc) return;
  if(!CL.snap && !CL.refreshing) pxRefresh(0); else cloudSchedule();
});
window.addEventListener('pagehide', function(){ if(CL.uid && CL.snap && CL.pending) pxSet(PX_DIRTY, '1'); });

function pxAuthErr(e){
  var m = String((e && e.message) || e || ''), c = String((e && e.code) || '');
  return /jwt|invalid.*token|refresh_token|not authenticated/i.test(m) || c === 'PGRST301' || +(e && e.status) === 401;
}
// فشل التحميل: لا نرجع لشاشة الدخول بالخطأ (الجلسة سليمة)، بل نعرض زر "إعادة المحاولة" مع السبب
function pxPullFail(e, user){
  try{ console.error(e); }catch(x){}
  CL.uid = null; CL.snap = null; CL.warm = false;
  if(e && e.banned){ sbc.auth.signOut(); pxSet(PX_UID, ''); authScreen(L('تم حظر هذا الحساب.', 'This account has been banned.')); return; }
  if(pxAuthErr(e)){ sbc.auth.signOut().then(function(){ authScreen(L('انتهت جلستك، سجّل الدخول من جديد.', 'Your session expired, please sign in again.')); }, function(){ authScreen(L('انتهت جلستك، سجّل الدخول من جديد.', 'Your session expired, please sign in again.')); }); return; }
  try{ applyTheme(); }catch(x){}
  try{ window.bootHide && window.bootHide(); }catch(x){}
  var el = document.getElementById('authwrap');
  if(!el){ el = document.createElement('div'); el.id = 'authwrap'; document.body.appendChild(el); }
  el.style.cssText = 'position:fixed;inset:0;z-index:1000;background:var(--bg);color:var(--fg,inherit);overflow:auto;padding:24px 18px';
  var off = navigator.onLine === false, why = off ? L('لا يوجد اتصال بالإنترنت.', 'No internet connection.') : (pxTransient(e) ? L('الاتصال بالخادم بطيء أو متقطع.', 'The connection to the server is slow or unstable.') : L('تعذّر تحميل بياناتك.', 'Could not load your data.'));
  el.innerHTML = '<div style="max-width:420px;margin:12vh auto 0;text-align:center"><div class="pg-h"><h1>' + L('تعذّر الاتصال', 'Connection problem') + '</h1></div>' +
    '<div class="srmsg" role="status">' + esc(why) + '</div>' +
    '<div class="acts"><button class="btn" id="px-retry" style="width:100%">' + L('إعادة المحاولة', 'Try again') + '</button></div>' +
    '<div class="acts"><button class="btn ghost" data-act="logout" style="width:100%">' + L('تسجيل الخروج', 'Sign out') + '</button></div>' +
    '<div dir="ltr" style="opacity:.5;font-size:11px;margin-top:14px;word-break:break-word">' + esc(String((e && e.message) || e || '').slice(0, 160)) + '</div></div>';
  var b = document.getElementById('px-retry');
  b.onclick = function(){ b.disabled = true; b.textContent = L('لحظة…', 'One moment…'); startCloud(user); };
}

/* التحميل غير الحرج: الأصدقاء والمحادثات. فشله لا يمنع دخول التطبيق، ويُعاد تلقائياً */
function pxSocial(){
  if(CL.socialBusy || !CL.uid) return Promise.resolve();
  CL.socialBusy = true; var u0 = CL.uid;
  var quiet = function(e){ try{ console.error(e); }catch(x){} };
  return pxRetry(loadPeople, 3, 800).catch(quiet).then(function(){ return pxRetry(loadChats, 3, 800); }).catch(quiet).then(function(){
    CL.socialBusy = false;
    if(CL.uid === u0) pxSoftRender(['chats', 'profile', 'user', 'search']);
  });
}

/* تسخين الصور: نحمّل مسبقاً أغلفة أهم العناصر في وقت الفراغ إلى ذاكرة المتصفح على جهاز المستخدم فقط */
function pxWarmImages(){
  if(CL.warmed) return; CL.warmed = true;
  var c = navigator.connection || {};
  if(c.saveData || /(^|-)2g$/.test(c.effectiveType || '')) return;
  var run = function(){
    try{
      var seen = {}, urls = [];
      state.items.slice().sort(function(a, b){ return (b.added || 0) - (a.added || 0); }).forEach(function(i){
        var u = String(i.img || '').replace(/#(?:sm|r[\d.]+)$/, '');
        if(u && !/^data:/.test(u) && !seen[u] && urls.length < 40){ seen[u] = 1; urls.push(u); }
      });
      var k = 0;
      (function next(){
        if(k >= urls.length) return;
        var im = new Image(); im.decoding = 'async'; im.onload = im.onerror = function(){ setTimeout(next, 30); }; im.src = imgSafe(urls[k++]);
      })();
    }catch(e){}
  };
  if('requestIdleCallback' in window) requestIdleCallback(run, {timeout:4000}); else setTimeout(run, 2500);
}

function cloudBoot(){
  if(!window.supabase || !window.supabase.createClient){
    // المكتبة لم تُحمَّل: إن كان التطبيق مفتوحاً من النسخة المحلية نكمل بصمت ونعيد المحاولة، وإلا نعرض زر إعادة المحاولة
    if(CL.uid){ pxLoadLib(function(ok){ if(ok) cloudBoot(); else setTimeout(cloudBoot, 10000); }); return; }
    authScreen(L('تعذّر تحميل مكتبة الاتصال. تحقق من الإنترنت ثم اضغط إعادة التحميل.', 'Could not load the connection library. Check your internet and retry.')); return;
  }
  if(!sbc){
    sbc = window.supabase.createClient(SB_URL, SB_KEY);
    sbc.auth.onAuthStateChange(function(ev){ if(ev === 'SIGNED_OUT' && CL.uid){ location.reload(); } });
  }
  if(CL.warm){ pxRefresh(0); return; }   // فُتح التطبيق مسبقاً من النسخة المحلية
  if(CL.uid) return;
  var su = pxStoredUser();
  pxTimeout(sbc.auth.getSession(), 8000).then(function(r){
    var s = r.data && r.data.session;
    if(s) startCloud(s.user); else authScreen('');
  }).catch(function(){
    if(su) startCloud(su); else authScreen(L('تعذّر الاتصال بالخادم، تحقق من الإنترنت.', 'Could not reach the server, check your internet.'));
  });
}
// يُستدعى أول ما تُحمَّل بيانات الجهاز: لو عندنا جلسة + نسخة محلية لهذا المستخدم نفتح فوراً دون انتظار الشبكة أو المكتبة

/* ----- rows <-> state ----- */

    items: state.items.map(function(it){ return {user_id:u, id:it.id, cat:it.cat, name:it.name, img:it.img || '', rating:Math.min(10, Math.max(0, Math.round((+it.rating || 0) * 10) / 10)),

}
function profRow(){

}
function takeSnap(){
  var rows = rowsOf(), s = {cats:{}, items:{}, lists:{}, prof:JSON.stringify(profRow()), username:state.profile.username, follows:state.profile.following.slice()};

/* ----- جلب بيانات المستخدم الأساسية من الخادم (بدون لمس state) ----- */
// الملف الشخصي يُنشأ عادة بمُشغّل (trigger) في قاعدة البيانات؛ قد يتأخر لحظات بعد التسجيل، فننتظر ونعيد المحاولة بدل الفشل
function pxMakeProfile(user){
  var md = (user && user.user_metadata) || {}, un = String(md.username || '').toLowerCase();
  if(!un && user && user.email){ un = (user.email.split('@')[0].toLowerCase().replace(/[^a-z0-9_]/g, '').slice(0, 20) || 'user') + Math.floor(1000 + Math.random() * 9000); }
  if(!un){ var e0 = new Error('profile-missing'); throw e0; }
  return sbc.from('profiles').insert({id:user.id, username:un, name:md.name || md.full_name || ''}).select('*').maybeSingle().then(function(r){
    if(r.error || !r.data) throw (r.error || new Error('profile-missing'));
    return r.data;
  });
}
function pxFetchCore(user){
  var id = user.id;
  function prof(n){
    return sbc.from('profiles').select('*').eq('id', id).maybeSingle().then(function(r){
      if(r.error) throw r.error;
      if(r.data) return r.data;
      if(n < 4) return new Promise(function(ok){ setTimeout(ok, 350 * n); }).then(function(){ return prof(n + 1); });
      return pxMakeProfile(user);
    });
  }
  // الاستعلامات الأربعة تعمل بالتوازي
  return Promise.all([
    prof(1),
    pageAll(function(){ return sbc.from('cats').select('*').eq('user_id', id).order('pos').order('id'); }),
    pageAll(function(){ return sbc.from('items').select('*').eq('user_id', id).order('id'); }),
    pageAll(function(){ return sbc.from('lists').select('*').eq('user_id', id).order('id'); })
  ]).then(function(r){
    if(r[0].banned){ var be = new Error('banned'); be.banned = true; throw be; }
    return {p:r[0], cats:r[1], items:r[2], lists:r[3]};
  });
}
// دمج عند وجود تعديلات محلية لم تُرفع: نسخة الجهاز تغلب في العناصر المشتركة، وما انفرد به الخادم يبقى
function pxMerge(loc, srv){
  var seen = {}, out = [];
  (loc || []).forEach(function(x){ seen[x.id] = 1; out.push(x); });
  (srv || []).forEach(function(x){ if(!seen[x.id]) out.push(x); });
  return out;
}
/* ----- تحميل بيانات المستخدم: يجلب أولاً، ثم يستبدل state دفعة واحدة (فلا يضيع شيء لو فشل الجلب) ----- */
function pullAll(local){
  var u0 = CL.uid, user = CL.user || {id:CL.uid};
  CL.baseSig = pxDataSig();
  return pxRetry(function(){ return pxFetchCore(user); }, 3, 700).then(function(raw){
    if(CL.uid !== u0) return;   // خرج المستخدم أثناء التحميل
    var cur = state, p = raw.p;
    // هل عند الجهاز تعديلات لم تصل للخادم؟ (علامة محفوظة، أو تعديل جرى أثناء الجلب)
    var dirty = pxGet(PX_DIRTY) === '1' || (CL.baseSig != null && pxDataSig() !== CL.baseSig);
    // استيراد بيانات الجهاز القديمة (قبل وجود الحسابات) يحدث فقط لو لم يسبق تسجيل دخول على هذا الجهاز: يمنع تسرّب بيانات مستخدم سابق إلى حساب جديد
    var importLocal = !pxGet(PX_UID);
    var srvProfile = {name:p.name || '', username:p.username, avatar:p.avatar_url || '', banner:p.banner_url || '', privacy:p.privacy || 'public', following:((cur.profile && cur.profile.following) || []).slice(), role:p.role || 'user', bio:p.bio || ''};
    CL.bio = ('bio' in p); CL.tp = ('taste_picks' in p);
    var srvTaste = null; try{ if(p.taste_picks) srvTaste = JSON.parse(p.taste_picks); }catch(x){}
    CL.uById[CL.uid] = p.username; CL.idOf[p.username] = CL.uid;
    CL.rawLists = raw.lists;
    var empty = !(raw.cats.length || raw.items.length);

    // 1) نسخة تمثّل ما على الخادم تماماً → تُؤخذ منها اللقطة (snap) التي تُقارَن بها التعديلات القادمة
    var sv = JSON.parse(JSON.stringify(DEFAULT));
    sv.settings = cur.settings; sv.profile = srvProfile;
    if(raw.cats.length) sv.cats = raw.cats.map(function(c){ var o = {id:c.id, name:c.name, icon:c.icon, source:c.source}; if(c.img) o.img = c.img; return o; });
    sv.items = raw.items.map(function(i){ return {id:i.id, cat:i.cat, name:i.name, img:i.img || '', rating:+i.rating, note:i.note || '', status:i.status, date:i.watched || '', added:+i.added || 0, src:(i.src == null ? undefined : !!i.src)}; });
    CL.srcNull = {}; raw.items.forEach(function(i){ if(i.src === null) CL.srcNull[i.id] = 1; });
    sv.lists = raw.lists.map(function(l){ return {id:l.id, name:l.name, img:l.img || '', ids:l.item_ids || []}; });
    var snapView = Object.assign({}, sv);
    if(empty){ snapView.cats = []; snapView.items = []; snapView.lists = []; }   // حساب جديد: التصنيفات الافتراضية تُرفع كتعديل
    var fin = Object.assign({}, sv);
    if(empty && importLocal && cur.items && cur.items.length){
      fin.cats = cur.cats; fin.items = cur.items; fin.lists = cur.lists || [];
    }else if(dirty && !empty){
      fin.cats = pxMerge(cur.cats, sv.cats); fin.items = pxMerge(cur.items, sv.items); fin.lists = pxMerge(cur.lists, sv.lists);
      if(cur.profile && cur.profile.username === p.username){
        ['name', 'avatar', 'banner', 'bio', 'privacy'].forEach(function(k){ if(cur.profile[k] != null) fin.profile[k] = cur.profile[k]; });
      }
    }
    // 2) ما هو محلي فقط نحتفظ به (كان يضيع عند كل دخول): التصنيف النشط، الترتيب، قائمة الحظر، وصديقك/محادثاتك للعرض الفوري
    fin.active = cur.active; fin.sort = cur.sort || 'rating'; fin.blocked = cur.blocked || [];
    fin.people = cur.people || []; fin.chats = cur.chats || []; fin.saved = Array.isArray(cur.saved) ? cur.saved : [];
    fin.taste = (CL.tasteDirty || !CL.tp) ? (cur.taste || {}) : (srvTaste || cur.taste || {});
    if(!fin.cats.some(function(c){ return c.id === fin.active; })) fin.active = fin.cats[0].id;

    state = snapView; takeSnap();   // لقطة الخادم
    state = fin;
    // اللقطة أخذت follows من النسخة المحلية؛ loadPeople يصحّحها لاحقاً من الخادم
  });
}

/* ----- sync (debounced diff) ----- */
function cloudSchedule(){
  if(!CL.uid || !CL.snap) return;
  CL.pending = true; clearTimeout(CL.timer); CL.timer = setTimeout(syncNow, 700);
}
function syncNow(){
  clearTimeout(CL.timer);
  var v = CL.ver || 0;
  CL.q = CL.q.then(cloudSync).then(function(){
    CL.pending = false; CL.failing = false;
    if(CL.snap && v === (CL.ver || 0)) pxSet(PX_DIRTY, '0');   // كل شيء وصل للخادم
  }, function(e){
    CL.pending = false; pxSet(PX_DIRTY, '1');
    if(!CL.failing){ CL.failing = true; dbToast(e); } else { try{ console.error(e); }catch(x){} }   // تنبيه واحد فقط لا سيل تنبيهات
    // إعادة محاولة تلقائية (وعند عودة الاتصال يُستأنف فوراً من حدث online)
    clearTimeout(CL.retryT);
    if(navigator.onLine !== false) CL.retryT = setTimeout(cloudSchedule, 8000);
  });
  return CL.q;
}
function upImg(d, folder){
  return fetch(d).then(function(r){ return r.blob(); }).then(function(blob){
    var ext = (blob.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg').replace('svg+xml', 'svg').replace(/[^a-z0-9]/g, '') || 'jpg';
    var path = CL.uid + '/' + folder + '/' + uid() + '.' + ext;
    return sbc.storage.from('media').upload(path, blob, {contentType:blob.type || 'image/jpeg', cacheControl:'31536000'}).then(function(r){
      if(r.error) throw r.error;
      return sbc.storage.from('media').getPublicUrl(path).data.publicUrl;
    });
  });
}
function fixImages(){
  var jobs = [];
  function fix(o, k, folder){ if(o && /^data:/.test(o[k] || '')){ var mk = (/#(?:sm|r[\d.]+)$/.exec(o[k]) || [''])[0]; jobs.push(upImg(o[k].replace(/#(?:sm|r[\d.]+)$/, ''), folder).then(function(u){ o[k] = u + mk; })); } }
  state.cats.forEach(function(c){ fix(c, 'img', 'cat'); });
  state.items.forEach(function(i){ fix(i, 'img', 'item'); });
  state.lists.forEach(function(l){ fix(l, 'img', 'list'); });
  fix(state.profile, 'avatar', 'avatar'); fix(state.profile, 'banner', 'banner');
  return Promise.all(jobs).then(function(){ if(jobs.length) _saveLocal(); });
}
function idFor(u){
  if(CL.idOf[u]) return Promise.resolve(CL.idOf[u]);
  return sbc.from('profiles').select('id,username').eq('username', u).maybeSingle().then(function(r){
    if(r.data){ CL.idOf[u] = r.data.id; return r.data.id; }
    return null;
  });
}
function cloudSync(){
  if(!CL.uid || !CL.snap) return Promise.resolve();
  var snap = CL.snap;
  return fixImages().then(function(){
    var rows = rowsOf(), chain = Promise.resolve();
    ['cats', 'items', 'lists'].forEach(function(t){
      chain = chain.then(function(){
        var cur = {}; rows[t].forEach(function(r){ cur[r.id] = JSON.stringify(r); });
        var up = rows[t].filter(function(r){ return snap[t][r.id] !== cur[r.id]; });
        var del = Object.keys(snap[t]).filter(function(id){ return !(id in cur); });
        var p = Promise.resolve();
        for(var i = 0; i < up.length; i += 200){
          (function(ch){ p = p.then(function(){ return sbc.from(t).upsert(ch, {onConflict:'user_id,id'}).then(function(r){ if(r.error) throw r.error; }); }); })(up.slice(i, i + 200));
        }
        for(var j = 0; j < del.length; j += 100){
          (function(ch){ p = p.then(function(){ return sbc.from(t).delete().eq('user_id', CL.uid).in('id', ch).then(function(r){ if(r.error) throw r.error; }); }); })(del.slice(j, j + 100));
        }
        return p.then(function(){ snap[t] = cur; });
      });
    });
    // profile
    chain = chain.then(function(){
      var row = profRow(), s = JSON.stringify(row);
      if(s === snap.prof) return;
      return sbc.from('profiles').update(row).eq('id', CL.uid).then(function(r){
        if(!r.error){ snap.prof = s; snap.username = row.username; return; }
        var r2 = Object.assign({}, row); delete r2.username;
        return sbc.from('profiles').update(r2).eq('id', CL.uid).then(function(x){
          if(x.error) throw x.error;
          state.profile.username = snap.username; toast('اسم المستخدم مستخدم مسبقاً أو غير صالح');
          snap.prof = JSON.stringify(profRow()); _saveLocal();
        });
      });
    });
    // follows (+ a DM for every new follow)
    chain = chain.then(function(){
      var now = state.profile.following.slice(), old = snap.follows;
      var add = now.filter(function(u){ return old.indexOf(u) < 0; }), rm = old.filter(function(u){ return now.indexOf(u) < 0; });
      var p = Promise.resolve(), ok = old.filter(function(u){ return now.indexOf(u) > -1; }), changed = false;
      add.forEach(function(u){
        p = p.then(function(){ return idFor(u); }).then(function(id){
          if(!id){ state.profile.following = state.profile.following.filter(function(x){ return x !== u; }); return; }
          return sbc.from('follows').insert({follower:CL.uid, followee:id}).then(function(r){
            if(r.error && r.error.code !== '23505') throw r.error;
            ok.push(u); changed = true;
            return sbc.rpc('create_dm', {p_user:id}).then(function(r){ if(r && r.error){ try{ console.error(r.error); }catch(x){} toast(L('تعذّر إنشاء المحادثة: ', 'Could not create the chat: ') + (r.error.message || '')); } });
          });
        });
      });
      rm.forEach(function(u){
        p = p.then(function(){ return idFor(u); }).then(function(id){
          if(!id) return;
          return sbc.from('follows').delete().eq('follower', CL.uid).eq('followee', id).then(function(r){ if(r.error) throw r.error; changed = true; });
        });
      });
      return p.then(function(){ snap.follows = state.profile.following.slice(); if(changed) CL.chatsDirty = true; });
    });
    return chain;
  });
}

/* ----- people ----- */
function addUser(p){
  CL.uById[p.id] = p.username; CL.idOf[p.username] = p.id;
  if(p.id !== CL.uid && !state.people.some(function(x){ return x.username === p.username; })){
    state.people.push({id:p.id, username:p.username, name:p.name || '', avatar:p.avatar_url || '', banner:p.banner_url || '', bio:p.bio || '', prem:(p.premium_until ? Date.parse(p.premium_until) : 0), privacy:p.privacy || 'public', following:[], items:[]});
  }
}
function pcols(){ return 'id,username,name,avatar_url,banner_url,privacy' + (CL.bio ? ',bio' : '') + (CL.pr ? ',premium_until' : ''); }
function ensureUsers(ids){
  var need = ids.filter(function(id, i){ return id && id !== CL.uid && ids.indexOf(id) === i && !state.people.some(function(p){ return p.id === id; }); });
  if(!need.length) return Promise.resolve();
  return sbc.from('profiles').select(pcols()).in('id', need).then(function(r){
    if(r.error) throw r.error; r.data.forEach(addUser);
  });
}
function loadPeople(){
  var me = CL.uid;
  return sbc.from('follows').select('follower,followee').or('follower.eq.' + me + ',followee.eq.' + me).then(function(f1){
    if(f1.error) throw f1.error;
    var ids = {}, mine = [];
    f1.data.forEach(function(r){ if(r.follower !== me) ids[r.follower] = 1; if(r.followee !== me){ ids[r.followee] = 1; } if(r.follower === me) mine.push(r.followee); });
    (CL.memberIds || []).forEach(function(i){ if(i !== me) ids[i] = 1; });
    var arr = Object.keys(ids);
    if(!arr.length){ state.people = []; state.profile.following = []; return; }
    return Promise.all([
      sbc.from('profiles').select(pcols()).in('id', arr),
      sbc.from('follows').select('follower,followee').in('follower', arr),
      pageAll(function(){ return sbc.from('items').select('user_id,id,name,cat,rating,watched').in('user_id', arr).eq('status', 'done').order('user_id').order('id'); }),
      sbc.from('cats').select('user_id,id,name').in('user_id', arr)
    ]).then(function(r){
      if(r[0].error) throw r[0].error; if(r[1].error) throw r[1].error; if(r[3].error) throw r[3].error;
      var un = {}; un[me] = state.profile.username;
      r[0].data.forEach(function(p){ un[p.id] = p.username; CL.uById[p.id] = p.username; CL.idOf[p.username] = p.id; });
      var cn = {}; r[3].data.forEach(function(c){ cn[c.user_id + '|' + c.id] = c.name; });
      var fl = {}; r[1].data.forEach(function(x){ (fl[x.follower] = fl[x.follower] || []).push(un[x.followee] || '#' + x.followee); });
      var its = {}; r[2].forEach(function(i){ (its[i.user_id] = its[i.user_id] || []).push({n:i.name, c:cn[i.user_id + '|' + i.cat] || '', r:+i.rating, d:i.watched || '', m:''}); });
      state.people = r[0].data.map(function(p){
        return {id:p.id, username:p.username, name:p.name || '', avatar:p.avatar_url || '', banner:p.banner_url || '', bio:p.bio || '', prem:(p.premium_until ? Date.parse(p.premium_until) : 0), privacy:p.privacy || 'public', following:fl[p.id] || [], items:its[p.id] || []};
      });
      state.profile.following = mine.map(function(i){ return un[i]; }).filter(Boolean);
      if(CL.snap) CL.snap.follows = state.profile.following.slice();
    });
  });
}

/* ----- chats ----- */
function mapMsg(m){

function chatSig(){

function loadChats(){
  return sbc.from('chat_members').select('chat_id,user_id,role').then(function(mem){
    if(mem.error) throw mem.error;
    var chatIds = [], memberIds = [];
    mem.data.forEach(function(x){ if(chatIds.indexOf(x.chat_id) < 0) chatIds.push(x.chat_id); if(memberIds.indexOf(x.user_id) < 0) memberIds.push(x.user_id); });
    CL.memberIds = memberIds;
    Object.keys(CL.msgs).forEach(function(k){ if(chatIds.indexOf(k) < 0) delete CL.msgs[k]; });
    if(!chatIds.length){ state.chats = []; return; }
    var known = chatIds.filter(function(i){ return CL.msgs[i]; }), fresh = chatIds.filter(function(i){ return !CL.msgs[i]; });
    if(!CL.cursor){ fresh = chatIds.slice(); known = []; }
    var qs = [sbc.from('chats').select('id,type,name,avatar_url').in('id', chatIds)];
    if(fresh.length) qs.push(sbc.from('messages').select('*').in('chat_id', fresh).order('created_at', {ascending:false}).limit(600));
    if(known.length && CL.cursor) qs.push(sbc.from('messages').select('*').in('chat_id', known).gte('created_at', CL.cursor).order('created_at'));
    return Promise.all(qs).then(function(rs){
      rs.forEach(function(r){ if(r.error) throw r.error; });
      var msgs = [];
      if(fresh.length) msgs = msgs.concat(rs[1].data.slice().reverse());
      if(known.length && CL.cursor) msgs = msgs.concat(rs[rs.length - 1].data);
      var ids = memberIds.slice(); msgs.forEach(function(m){ if(m.user_id) ids.push(m.user_id); (m.sys_users || []).forEach(function(u){ ids.push(u); }); });
      return ensureUsers(ids).then(function(){
        fresh.forEach(function(i){ CL.msgs[i] = []; });
        msgs.forEach(function(m){
          var arr = CL.msgs[m.chat_id]; if(!arr) return;
          if(!arr.some(function(x){ return x.id === m.id; })) arr.push(mapMsg(m));
          if(!CL.cursor || m.created_at > CL.cursor) CL.cursor = m.created_at;
        });
        Object.keys(CL.msgs).forEach(function(k){ CL.msgs[k].sort(function(a, b){ return a.t - b.t; }); });
        state.chats = rs[0].data.map(function(c){

function banAction(on){

    if(!id){ toast('المستخدم غير موجود'); return; }

}

/* ---------- 2) مصدر مخصص: رابط + كشف تلقائي للحقول ---------- */
function getAt(o, p){
  if(!p) return o;
  var parts = String(p).split('.').filter(Boolean), v = o;
  for(var i = 0; i < parts.length && v != null; i++) v = v[parts[i]];
  return v;
}
function getPath(o, p){
  if(!p) return undefined;
  var alts = String(p).split('|');
  for(var a = 0; a < alts.length; a++){
    var v = getAt(o, alts[a].trim());
    if(Array.isArray(v)) v = v[0];
    if(v != null && v !== '' && typeof v !== 'object') return v;
  }
  return undefined;
}
function autoArr(d){
  var best = null;
  (function walk(o, p, depth){
    if(o == null || depth > 4) return;
    if(Array.isArray(o)){
      if(o.length && o[0] && typeof o[0] === 'object' && !Array.isArray(o[0]) && (!best || o.length > best.arr.length)) best = {path:p, arr:o};
      return;
    }
    if(typeof o === 'object') Object.keys(o).forEach(function(k){ walk(o[k], p ? p + '.' + k : k, depth + 1); });
  })(d, '', 0);
  return best;
}
function leaves(o, pre, depth, out){
  out = out || [];
  if(o == null || depth > 3) return out;
  if(Array.isArray(o)){ if(o.length && typeof o[0] !== 'object') out.push({p:pre, v:o[0]}); return out; }
  if(typeof o === 'object'){ Object.keys(o).forEach(function(k){ leaves(o[k], pre ? pre + '.' + k : k, depth + 1, out); }); return out; }
  if(pre) out.push({p:pre, v:o});
  return out;
}
function detectMap(d){
  var found = autoArr(d); if(!found) return null;
  var lv = leaves(found.arr[0], '', 0), res = {resultsPath:found.path, titlePath:'', subPath:'', imgPath:'', imgBase:''};
  function last(p){ return p.split('.').pop(); }
  var TK = ['title', 'name', 'label', 'headline', 'original_title', 'original_name', 'trackName', 'collectionName', 'artistName', 'canonicalTitle', 'l'];
  for(var i = 0; i < TK.length && !res.titlePath; i++){
    var hit = lv.filter(function(x){ return last(x.p) === TK[i] && typeof x.v === 'string' && x.v; }).sort(function(a, b){ return a.p.length - b.p.length; })[0];
    if(hit) res.titlePath = hit.p;
  }
  if(!res.titlePath){ var s = lv.filter(function(x){ return typeof x.v === 'string' && x.v.length > 1 && !/^https?:|^\//.test(x.v); })[0]; if(s) res.titlePath = s.p; }
  var imgs = lv.filter(function(x){
    return typeof x.v === 'string' && x.v && (/\.(jpe?g|png|webp|gif)(\?|#|$)/i.test(x.v) || /(poster|cover|image|img|thumb|artwork|picture|photo)/i.test(x.p));
  });
  var absI = imgs.filter(function(x){ return /^(https?:)?\/\//.test(x.v); });
  var pick = (absI.length ? absI : imgs).sort(function(a, b){ return (/large|big|original|xl|medium/i.test(b.p) ? 1 : 0) - (/large|big|original|xl|medium/i.test(a.p) ? 1 : 0); })[0];
  if(pick) res.imgPath = pick.p;
  var subs = lv.filter(function(x){
    return x.p !== res.titlePath && x.p !== res.imgPath && /(year|date|release|premiered|author|artist|creator|developer|genre|format)/i.test(last(x.p)) && (typeof x.v === 'string' || typeof x.v === 'number') && !/^https?:/.test(String(x.v));
  }).slice(0, 2);
  res.subPath = subs.map(function(x){ return x.p; }).join(', ');
  return res;
}
function hdrOpts(h){
  var out = {}, any = false;
  String(h || '').split(/\n/).forEach(function(line){
    var i = line.indexOf(':'); if(i < 1) return;
    var k = line.slice(0, i).trim(), v = line.slice(i + 1).trim();
    if(/^[A-Za-z0-9-]+$/.test(k) && v){ out[k] = v; any = true; }
  });
  return any ? {headers:out} : {};
}
function mapCustom(c, d){
  var arr = c.resultsPath ? getAt(d, c.resultsPath) : null;
  if(!Array.isArray(arr)){ var f = autoArr(d); arr = f ? f.arr : []; }
  return arr.slice(0, 10).map(function(x){
    var title = getPath(x, c.titlePath);
    var sub = String(c.subPath || '').split(',').map(function(s){ return getPath(x, s.trim()); }).filter(function(v){ return v != null && v !== ''; }).join('، ');
    var img = String(getPath(x, c.imgPath) || '');
    if(img && !/^(https?:|\/\/|data:)/.test(img) && c.imgBase) img = c.imgBase.replace(/\/+$/, '') + '/' + img.replace(/^\/+/, '');
    if(img.indexOf('//') === 0) img = 'https:' + img;
    img = img.replace(/^http:/, 'https:');
    return {title:title == null ? '' : String(title), sub:sub, img:/^https:/.test(img) ? img : ''};
  }).filter(function(r){ return r.title; });
}
function sCustom(c, q){
  var url = String(c.url).replace(/\{q\}/g, encodeURIComponent(q));
  return jget(url, hdrOpts(c.headers)).then(function(d){ return mapCustom(c, d); });
}
function withTimeout(p, ms){
  return Promise.race([p, new Promise(function(_, rej){ setTimeout(function(){ rej(new Error('timeout')); }, ms); })]);
}

function builtinRow(id){

  return {id:id, kind:'builtin', label:b.n, enabled:srcOn(id), types:srcTypes(id), pos:BUILTIN.indexOf(b), updated_at:new Date().toISOString()};
}
function srcErr(e){
  try{ console.error(e); }catch(x){}
  var m = (e && (e.message || e.code)) || '';
  toast(/42P01|PGRST205|does not exist|schema cache/i.test(m) ? L('شغّل ملف SQL الخاص بالمصادر أولاً', 'Run the sources SQL file first') : L('تعذّر الحفظ', 'Could not save') + (m ? ': ' + m : ''));
}
function srcToggle(id){
  var c = SRC.custom.filter(function(x){ return x.id === id; })[0], row;
  if(c){ c.enabled = !c.enabled; row = customToRow(c, SRC.custom.indexOf(c)); }
  else{ SRC.en[id] = !srcOn(id); row = builtinRow(id); }
  srcCache(); srcPaint();
  srcUpsert([row]).catch(function(e){
    if(c) c.enabled = !c.enabled; else SRC.en[id] = !srcOn(id);
    srcCache(); srcPaint(); srcErr(e);
  });
}
function srcAll(on){
  var rows = [], prevEn = JSON.parse(JSON.stringify(SRC.en)), prevCu = JSON.parse(JSON.stringify(SRC.custom));
  BUILTIN.forEach(function(b){ SRC.en[b.id] = on; rows.push(builtinRow(b.id)); });
  SRC.custom.forEach(function(c, i){ c.enabled = on; rows.push(customToRow(c, i)); });
  srcCache(); srcPaint();
  srcUpsert(rows).then(function(){ toast(L('تم الحفظ', 'Saved')); }).catch(function(e){ SRC.en = prevEn; SRC.custom = prevCu; srcCache(); srcPaint(); srcErr(e); });
}
function srcTestOne(id){
  var c = SRC.custom.filter(function(x){ return x.id === id; })[0], t, p;
  if(c){ t = c.types[0]; p = sCustom(c, SAMPLE[t] || 'avatar'); }
  else{ t = srcTypes(id)[0]; p = BFN[id](t, SAMPLE[t], SAMPLE[t]); }
  SP.res[id] = {s:'run'}; srcPaint();
  return withTimeout(p, 12000).then(function(l){ SP.res[id] = {s:'ok', n:l.length}; }, function(e){ SP.res[id] = {s:'err', msg:(e && e.message) || 'error'}; }).then(function(){ if(view === 'sources') srcPaint(); });
}
function srcTestAll(){
  if(SP.testing) return; SP.testing = true;
  srcItems().filter(function(s){ return s.enabled; }).reduce(function(prev, s){ return prev.then(function(){ return srcTestOne(s.id); }); }, Promise.resolve())
    .then(function(){ SP.testing = false; });
}

function seSync(){
  var map = {'se-label':'label', 'se-url':'url', 'se-headers':'headers', 'se-rp':'resultsPath', 'se-tp':'titlePath', 'se-sp':'subPath', 'se-ip':'imgPath', 'se-ib':'imgBase'};
  Object.keys(map).forEach(function(id){ var el = document.getElementById(id); if(el) SE[map[id]] = el.value.trim(); });
}
function seFill(){
  var map = {'se-label':'label', 'se-url':'url', 'se-headers':'headers', 'se-rp':'resultsPath', 'se-tp':'titlePath', 'se-sp':'subPath', 'se-ip':'imgPath', 'se-ib':'imgBase'};
  Object.keys(map).forEach(function(id){ var el = document.getElementById(id); if(el) el.value = SE[map[id]] || ''; });
  layer.querySelectorAll('[data-act="se-type"]').forEach(function(b){ b.classList.toggle('on', SE.types.indexOf(b.dataset.t) > -1); });
  var en = layer.querySelector('[data-act="se-en"]'); if(en) en.classList.toggle('on', !!SE.useEn);
}
function seParseJson(){
  var u = (SE.url || '').trim();
  if(u.charAt(0) !== '{') return true;
  try{
    var j = JSON.parse(u), m = {label:'label', url:'url', headers:'headers', resultsPath:'resultsPath', titlePath:'titlePath', subPath:'subPath', imgPath:'imgPath', imgBase:'imgBase'};
    Object.keys(m).forEach(function(k){ if(typeof j[k] === 'string') SE[m[k]] = j[k]; });
    if(Array.isArray(j.types)) SE.types = j.types.filter(function(t){ return ALLTYPES.indexOf(t) > -1; });
    if(typeof j.useEn === 'boolean') SE.useEn = j.useEn;
    if(SE.titlePath) SE.manual = true;
    seFill(); return true;
  }catch(e){ toast(L('صيغة JSON غير صحيحة', 'Invalid JSON')); return false; }
}
function seUrlOk(){
  if(!/^https:\/\/[^\s]+$/i.test(SE.url)){ toast(L('الرابط يجب أن يبدأ بـ https://', 'The URL must start with https://')); return false; }
  if(SE.url.indexOf('{q}') < 0){ toast(L('ضع {q} مكان كلمة البحث في الرابط', 'Put {q} where the search term goes')); return false; }
  return true;
}
function seTest(){
  seSync(); if(!seParseJson() || !seUrlOk()) return;
  var box = $('#se-prev'); if(!box) return;
  var q = (($('#se-q') || {}).value || '').trim() || 'avatar';
  box.innerHTML = '<div class="srmsg">جارٍ الاختبار...</div>';
  var url = SE.url.replace(/\{q\}/g, encodeURIComponent(q));
  withTimeout(jget(url, hdrOpts(SE.headers)), 12000).then(function(d){
    if(!SE.manual || !SE.titlePath){
      var dm = detectMap(d);
      if(!dm){ box.innerHTML = '<div class="srmsg">لم يتم العثور على قائمة نتائج في الاستجابة. تأكد أن الرابط يعيد JSON يحتوي مصفوفة، أو اضبط المسارات يدوياً من الإعدادات المتقدمة.</div>'; return; }
      SE.resultsPath = dm.resultsPath; SE.titlePath = dm.titlePath; SE.subPath = dm.subPath; SE.imgPath = dm.imgPath; if(!SE.imgBase) SE.imgBase = dm.imgBase;
      seFill();
    }
    var list = mapCustom(SE, d);
    if(!list.length){ box.innerHTML = '<div class="srmsg">وصل الرد لكن لم تظهر نتائج بهذه الإعدادات. جرّب كلمة أخرى أو اضبط المسارات، أو اضغط «إعادة الضبط التلقائي».</div>'; return; }
    box.innerHTML = '<div class="srmsg">✓ ' + list.length + L(' نتيجة. هكذا ستظهر للمستخدمين:', ' results. This is how users will see them:') + '</div>' + list.slice(0, 3).map(function(r){
      return '<div class="sr"><span class="th" style="' + (r.img ? bgUrl(r.img) : '') + '"></span><span class="tx"><span class="nm" dir="auto">' + esc(r.title) + '</span>' + (r.sub ? '<span class="sub" dir="auto">' + esc(r.sub) + '</span>' : '') + '</span></div>';
    }).join('');
  }).catch(function(e){
    var m = (e && e.message) || '';
    box.innerHTML = '<div class="srmsg">' + (/Failed to fetch|NetworkError|Load failed/i.test(m) ? 'تعذّر الاتصال. غالباً المصدر لا يسمح بالاتصال من المتصفح (CORS) أو الرابط غير صحيح.' : 'فشل الاختبار.') + '<br><small dir="ltr">' + esc(m) + '</small></div>';
  });
}
function seSave(btn){
  seSync(); if(!seParseJson()) return; seSync();
  if(!SE.label){ toast(L('أدخل اسم المصدر', 'Enter a name')); return; }
  if(!seUrlOk()) return;
  if(!SE.types.length){ toast(L('اختر صنفاً واحداً على الأقل', 'Pick at least one category')); return; }
  if(!SE.titlePath){ toast(L('اضغط «اختبار الرابط» أولاً ليُضبط المصدر تلقائياً', 'Tap "Test URL" first to auto-configure')); return; }
  var isNew = !SE.id; if(isNew) SE.id = 'c_' + Math.random().toString(36).slice(2, 9);
  var idx = SRC.custom.findIndex(function(x){ return x.id === SE.id; });
  var c = {id:SE.id, label:SE.label, enabled:SE.enabled !== false, types:SE.types, url:SE.url, headers:SE.headers, resultsPath:SE.resultsPath, titlePath:SE.titlePath, subPath:SE.subPath, imgPath:SE.imgPath, imgBase:SE.imgBase, useEn:!!SE.useEn};
  btn.disabled = true;
  srcUpsert([customToRow(c, idx > -1 ? idx : SRC.custom.length)]).then(function(){
    if(idx > -1) SRC.custom[idx] = c; else SRC.custom.push(c);
    srcCache(); closeSheet(); srcPaint(); toast(isNew ? L('تمت إضافة المصدر', 'Source added') : L('تم الحفظ', 'Saved'));
  }).catch(function(e){ btn.disabled = false; if(isNew) SE.id = null; srcErr(e); });
}

}
function feedFetch(){
  if(!CL.uid || !sbc || FD.busy) return Promise.resolve();
  FD.busy = true; FD.t = Date.now(); var tab = FD.tab;
  var q = sbc.from('posts').select(POST_COLS).is('parent_id', null).order('created_at', {ascending: flt().sort === 'oldest'}).limit(60);
  if(tab === 'following'){
    var ids = state.profile.following.map(function(u){ return CL.idOf[u]; }).filter(Boolean); ids.push(CL.uid);
    q = q.in('user_id', ids);
  }
  q = fltQuery(q);
  return q.then(function(r){
    if(r.error) throw r.error;
    var rows = r.data || [], pids = rows.map(function(p){ return p.id; });
    return Promise.all([
      pids.length ? sbc.from('post_likes').select('post_id,user_id').in('post_id', pids) : {data:[]},
      pids.length ? sbc.from('posts').select('id,parent_id').in('parent_id', pids) : {data:[]},
      ensureUsers(rows.map(function(p){ return p.user_id; }))
    ]).then(function(x){
      if(tab !== FD.tab) return;
      FD.posts = rows; FD.likes = {}; FD.mine = {}; FD.rc = {};
      (x[0].data || []).forEach(function(l){ FD.likes[l.post_id] = (FD.likes[l.post_id] || 0) + 1; if(l.user_id === CL.uid) FD.mine[l.post_id] = 1; });
      (x[1].data || []).forEach(function(c){ FD.rc[c.parent_id] = (FD.rc[c.parent_id] || 0) + 1; });
      FD.loaded = true; FD.err = ''; FD.fresh = 0;
    });

function cmpAnimate(){
  var root = $('#cx'); if(!root) return;
  var run = ++CMPV.run, red = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  [].forEach.call(root.querySelectorAll('[data-to]'), function(el){
    var to = +el.dataset.to, dur = +el.dataset.dur || 1200, dl = +el.dataset.delay || 0;
    if(red || !to){ el.textContent = String(to); return; }
    setTimeout(function(){
      if(run !== CMPV.run) return;
      var t0 = performance.now();
      (function step(now){
        if(run !== CMPV.run || !document.body.contains(el)) return;
        var k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
        el.textContent = String(Math.round(to * e));
        if(k < 1) requestAnimationFrame(step);
      })(t0);
    }, dl);
  });
  [].forEach.call(root.querySelectorAll('.cx-row'), function(row){
    var d = red ? 0 : +row.dataset.d || 0;
    setTimeout(function(){
      if(run !== CMPV.run) return;
      row.classList.add('go');
      [].forEach.call(row.querySelectorAll('[data-w]'), function(i){ setTimeout(function(){ if(run === CMPV.run) i.style.width = i.dataset.w + '%'; }, red ? 0 : 120); });
    }, d);
  });
  setTimeout(function(){
    if(run !== CMPV.run) return;
    var v = root.querySelector('.cx-verdict'); if(v) v.classList.add('go');
    var w = root.dataset.win, top = root.querySelector('.cx-top');
    if(w && top && !red){
      var h = '';
      for(var i = 0; i < 28; i++){
        h += '<s style="left:' + (w === 'l' ? 22 : 78) + '%;--dx:' + Math.round((Math.random() - .5) * 240) + 'px;--dy:' + Math.round(-150 + Math.random() * 200) + 'px;--rt:' + Math.round(Math.random() * 720) + 'deg;animation-delay:' + Math.round(Math.random() * 180) + 'ms"></s>';
      }
      top.insertAdjacentHTML('beforeend', '<div class="cx-conf">' + h + '</div>');
      setTimeout(function(){ var c = top.querySelector('.cx-conf'); if(c && c.parentNode) c.parentNode.removeChild(c); }, 2000);
    }
  }, red ? 0 : 2300);
}

function ptrSet(pull, anim){

  el.style.transition = anim ? 'transform .28s var(--ease),opacity .28s' : 'none';
  el.style.transform = 'translateY(' + (pull - 30) + 'px)';
  el.style.opacity = Math.min(1, pull / 30);

function ptrRun(){
  var job = ptrJob(); if(!job){ ptrSet(0, true); return; }
  PTR.busy = true; var el = ptrEl(); el.classList.add('ld'); ptrSet(PTR_HOLD, true);
  try{ if(navigator.vibrate) navigator.vibrate(8); }catch(x){}
  var p; try{ p = Promise.resolve(job()); }catch(x){ p = Promise.resolve(); }
  var min = new Promise(function(r){ setTimeout(r, 900); }), cap = new Promise(function(r){ setTimeout(r, 20000); });
  Promise.all([Promise.race([p.catch(function(){}), cap]), min]).then(function(){

  });
}
document.addEventListener('touchstart', function(e){
  PTR.on = false; PTR.ok = false;
  if(PTR.busy || e.touches.length !== 1 || ptrTop() > 0) return;
  var lay = document.getElementById('layer'); if(lay && lay.innerHTML) return;
  var tg = e.target; if(tg && tg.closest && tg.closest('input,textarea,select,.msgs,.sheet,.ov,.cbar,[contenteditable]')) return;
  if(!ptrJob()) return;
  PTR.y = e.touches[0].clientY; PTR.x = e.touches[0].clientX; PTR.pull = 0; PTR.ok = true;
}, {passive:true});
document.addEventListener('touchmove', function(e){
  if(!PTR.ok) return;
  if(e.touches.length !== 1){ if(PTR.on){ PTR.on = false; ptrSet(0, true); } PTR.ok = false; return; }
  var t = e.touches[0], dy = t.clientY - PTR.y, dx = t.clientX - PTR.x;
  if(!PTR.on){
    if(dy < -4 || ptrTop() > 0 || (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * .8)){ PTR.ok = false; return; }
    if(dy < 12) return;
    PTR.on = true;
  }
  if(e.cancelable) e.preventDefault();
  PTR.pull = Math.max(0, Math.min(110, (dy - 10) * .55));
  ptrSet(PTR.pull, false);
}, {passive:false});
function ptrEnd(e){
  if(!PTR.on){ PTR.ok = false; return; }
  var cancel = !!(e && e.type === 'touchcancel');

  if(!cancel && PTR.pull >= PTR_AT) ptrRun(); else ptrSet(0, true);

function isoLocal(d){ return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }

  var d = itDate(i); if(!d) return false;

  if(k === 'year') return d.slice(0, 4) === t.slice(0, 4);
  if(k === 'month') return d.slice(0, 7) === t.slice(0, 7);
  return d >= isoLocal(new Date(n.getFullYear(), n.getMonth(), n.getDate() - 6)) && d <= t;
}

  }).join('') + '</div></div>';
}

var KIND_SRC = {book:'book', manga:'book', manhua:'comic', manhwa:'comic', comic:'comic', album:'disc', song:'disc', artist:'artist', movie:'movie', tv:'series', anime:'series', game:'game'};
var KIND_ICON = {book:'book', disc:'disc', music:'disc', headphones:'disc', mic:'disc', tv:'series', play:'series', game:'game', film:'movie', camera:'movie', user:'artist'};
var KIND_N = {book:5, comic:5, movie:4, game:4, series:3, disc:3, artist:3};

/* ----- صفحة المتابعون / يتابع / العناصر (مستقلة وليست نافذة منبثقة) ----- */
function flRows(k, u){
  var m = me(), meRow = function(){ return userRow(m).replace('data-act="open-user"', 'data-act="nav" data-v="profile"'); };
  if(!u){
    var ls = k === 'followers' ? followers() : state.people.filter(function(x){ return iFollow(x.username); });
    return ls.map(userRow);
  }
  var p = person(u); if(!p) return [];
  if(k === 'followers'){
    var r = state.people.filter(function(x){ return (x.following || []).indexOf(u) > -1; }).map(userRow);
    if(iFollow(u)) r.unshift(meRow());
    return r;
  }
  return (p.following || []).map(function(x){ return x === m.username ? meRow() : (person(x) ? userRow(person(x)) : ''); }).filter(Boolean);
}
function viewFl(){
  var u = FLV.u, own = !u, p = own ? null : person(u);
  if(!own && !p) return subHead('') + '<div class="empty"><b>' + L('المستخدم غير موجود', 'User not found') + '</b></div>';
  var k = FLV.k; if(own && k === 'items') k = FLV.k = 'followers';
  var nm = own ? (me().name || me().username || '') : (p.name || p.username);
  var s = p && UL[p.id];
  var counts = {followers: flRows('followers', u).length, following: flRows('following', u).length, items: s && s.state === 'ok' ? s.items.length : ''};
  var tabs = [['followers', L('المتابعون', 'Followers')], ['following', L('يتابع', 'Following')]].concat(own ? [] : [['items', L('العناصر', 'Items')]]);
  var th = '<div class="ptabs fltabs" role="tablist" style="grid-template-columns:repeat(' + tabs.length + ',minmax(0,1fr))">' + tabs.map(function(t){
    var on = k === t[0];
    return '<button role="tab" aria-selected="' + on + '" class="' + (on ? 'on' : '') + '" data-act="fl-tab" data-k="' + t[0] + '"><span>' + t[1] + '</span><small>' + counts[t[0]] + '</small></button>';
  }).join('') + '</div>';
  var body;
  if(k === 'items'){
    if(!canSee(p) || isBlocked(u)) body = '<div class="empty"><b>' + L('المحتوى غير متاح', 'Content not available') + '</b></div>';
    else if(!s || s.state !== 'ok') body = pLoad();
    else{
      var arr = doneOnly(s.items).slice().sort(function(a, b){ return (+b.added || 0) - (+a.added || 0); });
      var cn = function(i){ var c = s.cats.filter(function(x){ return x.id === i.cat; })[0]; return c ? c.name : ''; };
      body = !arr.length ? '<div class="empty"><b>' + L('لا توجد عناصر', 'No items') + '</b></div>' : LAYOUT !== 'list' ? gridHTML(arr, 'uview') : '<div class="list">' + arr.map(function(i){ return rowHTML(i, 0, cn(i), 'uview'); }).join('') + '</div>';
    }
  }else{
    var rows = flRows(k, u);
    body = rows.length ? '<div class="fl-list">' + rows.join('') + '</div>' : '<div class="srmsg">' + L('لا أحد هنا بعد', 'Nobody here yet') + '</div>';
  }
  return subHead(esc(nm), '', true) + th + body;
}

['7. الاشتراكات والتبرعات','قد نوفّر مستقبلاً ميزات مدفوعة أو اشتراكات اختيارية. تتم عمليات الشراء عبر Google Play أو App Store ويظهر السعر ومدة الاشتراك قبل التأكيد. يتجدد الاشتراك تلقائياً ما لم تُلغِه من إعدادات حسابك في المتجر قبل موعد التجديد بـ 24 ساعة على الأقل، وتخضع المبالغ المستردة لسياسة المتجر المعني.','التبرعات اختيارية وغير قابلة للاسترداد، ولا تمنح أي ميزات ما لم يُذكر خلاف ذلك.','لا يُعدّ Google ولا Apple طرفاً في هذه الشروط ولا مسؤولاً عن التطبيق، وتنطبق شروط الترخيص القياسية لـ Apple على نسخة iOS.'],
['8. إخلاء المسؤولية','يُقدَّم التطبيق «كما هو» دون ضمانات من أي نوع، ولا نضمن أن يعمل دون انقطاع أو أخطاء. وبالقدر الذي يسمح به القانون لا نتحمل مسؤولية أي خسارة غير مباشرة ناتجة عن استخدامك له، ولا يمس ذلك حقوقك الإلزامية كمستهلك.'],
['9. إنهاء الاستخدام','يمكنك التوقف عن الاستخدام وحذف حسابك في أي وقت. ويحق لنا تعليق حسابك أو إنهاؤه إذا خالفت هذه الشروط أو أضررت بالآخرين أو بالخدمة.'],
['10. تعديل الشروط','قد نحدّث هذه الشروط من وقت لآخر، وسنبلغك بالتغييرات الجوهرية داخل التطبيق. استمرارك في الاستخدام بعد التحديث يعني موافقتك عليه.'],
['11. القانون الواجب التطبيق والتواصل','تخضع هذه الشروط للقوانين المعمول بها في بلد إقامة مطوّر التطبيق، دون المساس بحقوقك الإلزامية كمستهلك في بلدك. للاستفسار: {EMAIL}.']
],
en:[
['1. Acceptance and eligibility','By using the idk app (the “App”) or creating an account, you agree to these Terms and to the Privacy Policy. If you do not agree, do not use the App.','You must be at least 13 years old, or the minimum age required in your country if higher. If you are under 18, a parent or guardian must consent.'],
['2. Your account','Provide accurate information and keep your password secret. You are responsible for all activity on your account. You can delete your account at any time from Settings → Account → Delete my account.'],
['3. Content you post','You keep ownership of the ratings, lists, posts, images and messages you create. You grant us a limited, non-exclusive license to host and show them to others according to your privacy settings, solely to operate the App.','You are responsible for your content and confirm you have the right to post it and that it does not infringe anyone’s rights.'],
['4. Prohibited conduct','We have zero tolerance for objectionable content or abusive behavior. The following is prohibited: harassment, bullying and threats; hate speech and discrimination; sexually explicit content; any content that exploits or endangers minors; violent or graphic content; impersonation; fraud and spam; illegal content; and attempting to hack, abuse or scrape the service.'],
['5. Reporting, blocking and moderation','Inside the App you can report any user, post or message, and block any user to hide their content from you. We review reports and act within 24 hours, including removing violating content and suspending or permanently banning accounts.'],
['6. Title data and intellectual property','Information about titles (films, series, books, albums and more) and their images come from third-party services. Their rights and trademarks belong to their owners, and the App is not affiliated with or endorsed by them.','To report an intellectual property infringement, contact us at {EMAIL}.'],
['7. Subscriptions and donations','We may offer optional paid features or subscriptions in the future. Purchases are processed by Google Play or the App Store, and the price and period are shown before you confirm. Subscriptions renew automatically unless you cancel in your store account settings at least 24 hours before renewal, and refunds are subject to the relevant store’s policy.','Donations are voluntary and non-refundable, and do not grant any features unless stated otherwise.','Neither Google nor Apple is a party to these Terms or responsible for the App, and Apple’s standard Licensed Application EULA applies to the iOS version.'],
['8. Disclaimer','The App is provided “as is” without warranties of any kind, and we do not guarantee it will be uninterrupted or error-free. To the extent permitted by law, we are not liable for indirect losses arising from your use of it. This does not affect your mandatory consumer rights.'],
['9. Termination','You may stop using the App and delete your account at any time. We may suspend or terminate your account if you violate these Terms or harm others or the service.'],
['10. Changes to the Terms','We may update these Terms from time to time and will notify you of material changes in the App. Continuing to use the App after an update means you accept it.'],
['11. Governing law and contact','These Terms are governed by the laws applicable in the developer’s country of residence, without affecting your mandatory consumer rights in your country. Questions: {EMAIL}.']
]},
priv:{
ar:[
['1. مقدمة','توضّح هذه السياسة ما نجمعه من بيانات في تطبيق idk وكيف نستخدمه ونحميه وما هي خياراتك. الجهة المسؤولة عن البيانات هي مطوّر التطبيق، ويمكنك التواصل معنا على {EMAIL}.'],
['2. البيانات التي نجمعها','بيانات الحساب: بريدك الإلكتروني وكلمة المرور (تُخزَّن مشفّرة ولا نطّلع عليها).','بيانات الملف الشخصي: الاسم واسم المستخدم والصورة والغلاف والنبذة وإعداد الخصوصية وقائمة من تتابعهم.','المحتوى الذي تنشئه: تقييماتك وملاحظاتك وقوائمك ومنشوراتك وردودك ومحادثاتك والصور والملفات التي ترفعها.','ما ترسله إلينا: الاقتراحات والبلاغات.','بيانات تقنية محدودة: اشتراك الإشعارات الفورية إن فعّلته، وبيانات الجلسة اللازمة لتسجيل الدخول.','لا نجمع موقعك الجغرافي ولا جهات اتصالك، ولا نطّلع على بيانات الدفع التي تعالجها المتاجر. ولا نعرض إعلانات ولا نستخدم أدوات تتبّع إعلاني.'],
['3. كيف نستخدم بياناتك','لتشغيل حسابك ومزامنة مكتبتك بين أجهزتك، وعرض ملفك ومنشوراتك لمن تسمح لهم، وتشغيل المحادثات والإشعارات، ومعالجة الاقتراحات والبلاغات، ومنع إساءة الاستخدام وحماية المستخدمين، وتحسين التطبيق.'],
['4. المشاركة مع الآخرين','يرى الآخرون ملفك وتقييماتك ومنشوراتك بحسب إعداد «خصوصية الحساب» (عام / للأصدقاء فقط / خاص). والمحادثات مرئية للمشاركين فيها فقط.','لا نبيع بياناتك ولا نشاركها لأغراض إعلانية.'],
['5. مزوّدو الخدمة والمصادر الخارجية','نستخدم مزوّد استضافة وقواعد بيانات ومصادقة (Supabase) لتخزين بياناتك وتشغيل الحساب، وخدمات الإشعارات الخاصة بمتصفحك أو نظام جهازك عند تفعيلها.','عند بحثك عن عمل ما تُرسَل كلمات البحث إلى مصادر خارجية (مثل TVmaze وAniList وOpen Library وiTunes وWikidata) لجلب النتائج، وتخضع لسياساتها.'],
['6. التخزين على جهازك','نحفظ نسخة من مكتبتك وإعداداتك وآخر عمليات بحثك على جهازك لتعمل بسرعة وبلا اتصال.'],
['7. الاحتفاظ والحذف','نحتفظ ببياناتك ما دام حسابك قائماً. يمكنك حذف حسابك من الإعدادات ← الحساب ← حذف حسابي، فتُحذف بياناتك ومنشوراتك ومحادثاتك نهائياً من خوادمنا، وقد تبقى نسخ احتياطية لفترة قصيرة قبل أن تُمحى. ويمكنك أيضاً طلب الحذف بمراسلتنا.'],
['8. حقوقك','يحق لك الاطلاع على بياناتك وتصحيحها وتصديرها (الإعدادات ← نسخة احتياطية) وحذفها، والاعتراض على معالجتها أو تقييدها. وإن كنت في المنطقة الاقتصادية الأوروبية أو بريطانيا أو كاليفورنيا فلك الحقوق التي تقرّها قوانين بلدك (مثل GDPR وCCPA)، ولا نبيع معلوماتك الشخصية. لممارسة حقوقك راسلنا على {EMAIL}.'],
['9. الأطفال','التطبيق غير موجّه لمن هم دون 13 عاماً ولا نجمع بياناتهم عن قصد. إن علمنا بذلك حذفنا الحساب فوراً. ويمكن لولي الأمر مراسلتنا لطلب الحذف.'],
['10. الأمان','ننقل البيانات عبر اتصال مشفّر (HTTPS) ونقيّد الوصول إليها بالصلاحيات. ومع ذلك لا توجد وسيلة نقل أو تخزين آمنة بنسبة 100%.'],
['11. نقل البيانات دولياً','قد تُخزَّن بياناتك وتُعالج في دول غير دولتك، ونعتمد ضمانات مناسبة لحمايتها.'],
['12. التغييرات والتواصل','قد نحدّث هذه السياسة، وسنبلغك بالتغييرات الجوهرية داخل التطبيق. للاستفسار: {EMAIL}.']
],
en:[
['1. Introduction','This policy explains what data the idk app collects, how we use and protect it, and your choices. The data controller is the app developer, reachable at {EMAIL}.'],
['2. Data we collect','Account data: your email and password (stored encrypted; we cannot read it).','Profile data: name, username, avatar, banner, bio, privacy setting and the list of people you follow.','Content you create: your ratings, notes, lists, posts, replies, chats, and the images and files you upload.','What you send us: suggestions and reports.','Limited technical data: your push notification subscription if you enable it, and session data needed to keep you signed in.','We do not collect your location or contacts, and we do not see payment details, which the stores process. We show no ads and use no advertising trackers.'],
['3. How we use your data','To run your account and sync your library across devices; show your profile and posts to those you allow; operate chats and notifications; handle suggestions and reports; prevent abuse and protect users; and improve the App.'],
['4. Sharing with others','Other users see your profile, ratings and posts according to your “Account privacy” setting (Public / Friends only / Private). Chats are visible only to their participants.','We do not sell your data or share it for advertising.'],
['5. Service providers and third-party sources','We use a hosting, database and authentication provider (Supabase) to store your data and run your account, and your browser’s or device’s push services if you enable notifications.','When you search for a title, your search terms are sent to third-party sources (such as TVmaze, AniList, Open Library, iTunes and Wikidata) to fetch results, and their own policies apply.'],
['6. Storage on your device','We keep a copy of your library, settings and recent searches on your device so the App is fast and works offline.'],
['7. Retention and deletion','We keep your data while your account exists. You can delete your account from Settings → Account → Delete my account, which permanently removes your data, posts and chats from our servers; backups may remain for a short period before being erased. You can also request deletion by contacting us.'],
['8. Your rights','You may access, correct, export (Settings → Backup) and delete your data, and object to or restrict its processing. If you are in the EEA, UK or California you have the rights provided by your local law (such as GDPR and CCPA), and we do not sell your personal information. To exercise your rights, contact {EMAIL}.'],
['9. Children','The App is not directed to children under 13 and we do not knowingly collect their data. If we learn we have, we delete the account promptly. Parents may contact us to request deletion.'],
['10. Security','We transmit data over encrypted connections (HTTPS) and restrict access with permissions. However, no method of transmission or storage is 100% secure.'],
['11. International transfers','Your data may be stored and processed in countries other than yours, and we rely on appropriate safeguards to protect it.'],
['12. Changes and contact','We may update this policy and will notify you of material changes in the App. Questions: {EMAIL}.']
]}

function wkCat(){ return catById(WK.cat) || curCat(); }
function wkRawSrc(){ var c = wkCat(); return (c && c.source) || 'none'; }
function wkType(){
  var m = {anime:'tv', tv:'tv', movie:'movie', manga:'comic', manhua:'comic', manhwa:'comic', comic:'comic', book:'book', album:'album', song:'song', game:'game', artist:'artist', wiki:'wiki', none:'none'};
  return m[wkRawSrc()] || 'none';
}
function wkLib(){
  var n = normT(WK.name), any = null, same = null;
  state.items.forEach(function(i){ if(normT(i.name) === n){ if(i.cat === WK.cat) same = same || i; else any = any || i; } });
  return same || any;
}
function wkKey(){ return wkRawSrc() + '|' + normT(WK.name); }
function wkHttps(u){ return u ? String(u).replace(/^http:/, 'https:') : ''; }
function wkTrim(t, n){
  t = String(t || '').trim();
  if(t.length <= n) return t;
  var cut = t.slice(0, n), k = Math.max(cut.lastIndexOf('. '), cut.lastIndexOf('؟ '), cut.lastIndexOf('。'), cut.lastIndexOf('! '));
  return (k > n * .5 ? cut.slice(0, k + 1) : cut.replace(/\s+\S*$/, '') + '…');
}
function wkImg(u){
  u = wkHttps(u);
  return /Special:FilePath/i.test(u) && u.indexOf('?') < 0 ? u + '?width=240' : u;
}

/* ----- كاش على جهاز المستخدم فقط ----- */
var WKC = {}, WK_LS = 'idk-wk';
function wkCacheAll(){ try{ return JSON.parse(localStorage.getItem(WK_LS) || '{}') || {}; }catch(e){ return {}; } }
function wkCacheGet(k){
  if(WKC[k]) return WKC[k];
  var o = wkCacheAll()[k];
  if(o && o.v && Date.now() - o.t < 14 * 864e5){ WKC[k] = o.v; return o.v; }
  return null;
}
function wkCachePut(k, v){
  WKC[k] = v;
  try{
    var all = wkCacheAll(); all[k] = {t:Date.now(), v:v};
    var ks = Object.keys(all);
    if(ks.length > 40){ ks.sort(function(a, b){ return all[a].t - all[b].t; }); ks.slice(0, ks.length - 40).forEach(function(x){ delete all[x]; }); }
    localStorage.setItem(WK_LS, JSON.stringify(all));
  }catch(e){}
}

function wdFind(w, type){
  var q = w.name, lang = hasArabic(q) ? 'ar' : 'en';
  var url = 'https://www.wikidata.org/w/api.php?action=wbsearchentities&format=json&origin=*&type=item&limit=8&language=' + lang + '&uselang=' + lang + '&search=' + encodeURIComponent(q);
  return jget(url).then(function(d){
    var yr = (String(w.sub || '').match(/\b(19|20)\d{2}\b/) || [])[0], art = normT(String(w.sub || '').split(/[،,]/)[0]), nq = normT(q), best = null, bs = 0;
    (d.search || []).forEach(function(x){
      var lab = normT(x.label || (x.match && x.match.text) || ''), sim = dice(lab, nq), de = String(x.description || '');
      if(sim < .5) return;
      var sc = sim * 2, kw = WD_KW[type];
      if(kw && kw.test(de)) sc += 1;
      if(yr && de.indexOf(yr) > -1) sc += .5;
      if((type === 'album' || type === 'song') && art && art.length > 2 && normT(de).indexOf(art) > -1) sc += .7;
      if(sc > bs){ bs = sc; best = x; }
    });
    return best ? {id:best.id, label:best.label} : null;
  });
}
function wkSummary(sl, fb){
  var pref = isEn() ? 'enwiki' : 'arwiki', order = isEn() ? ['enwiki', 'arwiki'] : ['arwiki', 'enwiki'];
  var list = order.filter(function(k){ return sl && sl[k] && sl[k].title; });
  function next(i){
    if(i >= list.length) return Promise.resolve(fb ? {t:fb, r:1} : null);
    var k = list[i], lang = k === 'enwiki' ? 'en' : 'ar';
    return jget('https://' + lang + '.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(sl[k].title.replace(/ /g, '_'))).then(function(d){
      var t = d && d.extract ? String(d.extract).trim() : '';
      if(!t) throw new Error('empty');
      return {t:wkTrim(t, 800), r:(k === pref ? 3 : 2)};
    }).catch(function(){ return next(i + 1); });
  }
  return next(0);
}
function wkPeople(ids){
  var vals = ids.map(function(i){ return 'wd:' + i; }).join(' ');
  var q = 'SELECT ?p ?pLabel ?img ?logo WHERE { VALUES ?p { ' + vals + ' } OPTIONAL{ ?p wdt:P18 ?img } OPTIONAL{ ?p wdt:P154 ?logo } SERVICE wikibase:label { bd:serviceParam wikibase:language "' + (isEn() ? 'en,ar' : 'ar,en') + '". } }';
  return jget('https://query.wikidata.org/sparql?format=json&query=' + encodeURIComponent(q)).then(function(d){
    var m = {};
    ((d.results && d.results.bindings) || []).forEach(function(b){
      var id = b.p.value.split('/').pop(), o = m[id] = m[id] || {n:(b.pLabel && b.pLabel.value) || '', img:''};
      var im = b.img ? b.img.value : (b.logo ? b.logo.value : '');
      if(!o.img && im) o.img = wkImg(im);
    });
    return m;
  }).catch(function(){
    return jget('https://www.wikidata.org/w/api.php?action=wbgetentities&format=json&origin=*&props=labels&languages=ar|en&ids=' + ids.join('|')).then(function(d){
      var m = {};

function wkWiki(w, type){

      var e = d.entities && d.entities[c.id]; if(!e) return null;

      props.forEach(function(p){

        cl.forEach(function(x){

      return Promise.all([wkSummary(e.sitelinks || {}, fb), ids.length ? wkPeople(ids).catch(function(){ return {}; }) : Promise.resolve({})]).then(function(x){
        var out = {banner:'', sum:x[0] ? x[0].t : '', sumRank:x[0] ? x[0].r : 0, groups:[]}, by = x[1] || {};
        plan.forEach(function(pl){

          if(ppl.length) out.groups.push({k:pl.k, people:ppl});

function wkTvmaze(w){

    if(!d || dice(normT(d.name), normT(w.name)) < .6) return null;
    var emb = d._embedded || {}, out = {banner:'', sum:'', sumRank:1, groups:[]};
    if(d.summary) out.sum = wkTrim(String(d.summary).replace(/<[^>]+>/g, '').replace(/\s+/g, ' '), 800);
    var img = function(p){ return p && p.image ? wkHttps(p.image.medium || p.image.original) : ''; };
    var cast = (emb.cast || []).filter(function(c){ return c.person; }).slice(0, 14).map(function(c){ return {n:c.person.name, img:img(c.person), r:(c.character && c.character.name) || ''}; });
    if(cast.length) out.groups.push({k:'cast', people:cast});
    var M = {'Creator':'cre', 'Developer':'cre', 'Director':'dir', 'Writer':'wri', 'Executive Producer':'pro', 'Producer':'pro', 'Co-Executive Producer':'pro', 'Composer':'mus'}, g = {};
    (emb.crew || []).forEach(function(c){

function wkAni(w, mtype){
