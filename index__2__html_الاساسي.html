function initDial(){
  var dl = $('#dial'); if(!dl) return;
  var drag = false, last = draft.rating;
  function val(e){
    var r = dl.getBoundingClientRect(), x = e.clientX - (r.left + r.width / 2), y = e.clientY - (r.top + r.height / 2);
    var ang = Math.atan2(y, x) + Math.PI / 2; if(ang < 0) ang += 2 * Math.PI;
    return Math.round(ang / (2 * Math.PI) * 100) / 10;
  }
  function move(e, first){
    var v = val(e);
    if(!first){ if(last > 8 && v < 2) v = 10; else if(last < 2 && v > 8) v = 0; }   // لا قفز بين 0 و10
    last = v; setRating(v);
  }
  dl.addEventListener('pointerdown', function(e){ drag = true; try{ dl.setPointerCapture(e.pointerId); }catch(x){} move(e, true); e.preventDefault(); });
  dl.addEventListener('pointermove', function(e){ if(drag) move(e, false); });
  ['pointerup', 'pointercancel'].forEach(function(n){ dl.addEventListener(n, function(){ drag = false; }); });
  dl.addEventListener('keydown', function(e){
    var d = (e.key === 'ArrowRight' || e.key === 'ArrowUp') ? .1 : (e.key === 'ArrowLeft' || e.key === 'ArrowDown') ? -.1 : 0;

function trKeys(){
  if(!trKeys.c || trKeys.n !== Object.keys(EN).length){
    trKeys.n = Object.keys(EN).length;
    trKeys.c = Object.keys(EN).filter(function(k){ return /[\u0600-\u06FF]/.test(k) && k.length > 2; }).sort(function(a, b){ return b.length - a.length; });
  }
  return trKeys.c;
}
function trStr(v, el){
  var t = v.trim(); if(!t) return v;
  if(EN[t]) return v.replace(t, EN[t]);
  if(!/[\u0600-\u06FF]/.test(t)) return v;
  var auto = !!(el && el.closest && el.closest('[dir="auto"]'));
  var out = v;
  trKeys().forEach(function(k){ if(out.indexOf(k) > -1) out = out.split(k).join(EN[k]); });
  if(auto && /[\u0600-\u06FF]/.test(out)) return v;
  return out.replace(/،/g, ',').replace(/؟/g, '?');
}

function trAll(){
  if(!isEn() || trBusy) return; trBusy = true;
  var w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT), n, ls = [];
  while((n = w.nextNode())) ls.push(n);
  ls.forEach(function(n){ var nv = trStr(n.nodeValue, n.parentNode); if(nv !== n.nodeValue) n.nodeValue = nv; });
  document.querySelectorAll('[placeholder],[aria-label],[title],[alt]').forEach(function(el){
    ['placeholder','aria-label','title','alt'].forEach(function(a){ var v = el.getAttribute(a); if(v){ var nv = trStr(v, el); if(nv !== v) el.setAttribute(a, nv); } });
  });
  trBusy = false;
}

      var ix = state.people.findIndex(function(x){ return x.username === np.username; });
      if(ix > -1) state.people[ix] = np; else state.people.push(np);
      save(); closeSheet(); render(); toast('تمت إضافة المستخدم');
    }catch(x){ toast('الرمز غير صالح'); }
  }

function bioInl(t){

function bioFmt(t){

var BIO_MK = {b:'**', i:'_', s:'~~', u:'++'};
function bioPair(v, s, e, m){

var line = v.slice(ls, le), i = 0, open = -1;

}

}
function bioApply(ta, v, s, e){

function bioFormat(op){
var ta = $('#p-bio'); if(!ta) return;
var v = ta.value, s = ta.selectionStart, e = ta.selectionEnd, m = BIO_MK[op];
if(m){
var pr = bioPair(v, s, e, m);
if(pr){ v = v.slice(0, pr.a) + v.slice(pr.a + m.length, pr.b) + v.slice(pr.b + m.length); s -= m.length; e -= m.length; }
else if(s !== e){ v = v.slice(0, s) + m + v.slice(s, e) + m + v.slice(e); s += m.length; e += m.length; }
else{ v = v.slice(0, s) + m + m + v.slice(s); s += m.length; e = s; }
}else{
var ls = v.lastIndexOf('\n', s - 1) + 1, le = v.indexOf('\n', e); if(le < 0) le = v.length;
var re = op === 'ul' ? /^- / : /^\d+\. /, blk = v.slice(ls, le).split('\n'), all = blk.every(function(l){ return re.test(l); });

v = v.slice(0, ls) + nb + v.slice(le); s = e = ls + nb.length;

Object.assign(EN, {'ضبط الصورة':'Adjust photo','ضبط صورة الغلاف':'Adjust cover photo','غلاف كبير':'Large cover','غلاف صغير':'Small cover','اسحب الصورة لتحريكها، وقرّب أو بعّد بإصبعين':'Drag to move, pinch to zoom','تظهر صورة الغلاف بعرض الشاشة كاملاً':'The cover photo spans the full screen width','تكبير':'Zoom','تطبيق':'Apply'});
var cr = null, crDrag = null;
var CR = {big:{r:2, w:1000}, small:{r:3.5, w:1000}, avatar:{r:1, w:400}};
/* حدود نسبة البنر (عرض÷ارتفاع): أنحف من 3.2 أو أعرض من 1.5 يُقصّ لأقرب حد */
var BN_MIN = 1.5, BN_MAX = 3.2, BN_W = 1400;
function crPick(f, target){
 if(f && /gif/i.test(f.type)) toast(L('سيتحوّل الـ GIF إلى صورة ثابتة بعد القص', 'The GIF will become a static image after cropping'));
  compress(f, 1600, 'image/jpeg', .9, 1500 * 1024).then(function(d){
    crOrig = d; crLoad(d, target, target);
  }).catch(function(){ toast('تعذّرت قراءة هذه الصورة'); });
}
function crLoad(src, target, mode){
  var im = new Image();
  if(!/^data:/.test(src)) im.crossOrigin = 'anonymous';
  im.onload = function(){
    var rr = target === 'avatar' ? 1 : Math.min(BN_MAX, Math.max(BN_MIN, im.naturalWidth / Math.max(1, im.naturalHeight)));
    cr = {img:im, src:src, w:im.naturalWidth, h:im.naturalHeight, target:target, mode:mode, r:rr, scale:1, x:0, y:0, min:1, bw:0, bh:0};
    crSheet();
  };
  im.onerror = function(){ toast('تعذّرت قراءة هذه الصورة'); };
  im.src = src;
}
function crSheet(){

    (isB ? '<br>' + L('يتكيّف شكل الغلاف مع أبعاد صورتك، والجزء الظاهر هنا هو ما سيظهر في ملفك', 'The cover shape follows your photo; what you see here is what shows on your profile') : '') + '</p>' +
    '<div class="acts"><button class="btn" data-act="cr-save">تطبيق</button><button class="btn ghost" data-act="cr-cancel">رجوع</button></div>');

}
function crMode(v, wrap){
  if(!cr || !CR[v]) return;
  cr.mode = v;
  wrap.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', b.dataset.v === v); });
  $('#cr-box').style.aspectRatio = CR[v].r;
  crLayout(true);
}
function crLayout(reset){
  var b = $('#cr-box'); if(!b || !cr) return;
  var r = b.getBoundingClientRect();
  cr.bw = r.width; cr.bh = r.height;
  cr.min = Math.max(cr.bw / cr.w, cr.bh / cr.h);
  if(reset){
    cr.scale = cr.min;
    cr.x = (cr.bw - cr.w * cr.scale) / 2; cr.y = (cr.bh - cr.h * cr.scale) / 2;
  }
  crApply();
}
function crApply(){
  var im = $('#cr-img'); if(!im || !cr) return;
  var s = cr.scale;
  cr.x = Math.min(0, Math.max(cr.bw - cr.w * s, cr.x));
  cr.y = Math.min(0, Math.max(cr.bh - cr.h * s, cr.y));
  im.style.width = (cr.w * s) + 'px'; im.style.height = (cr.h * s) + 'px';
  im.style.left = cr.x + 'px'; im.style.top = cr.y + 'px';
}
function crZoomAt(ns, cx, cy){
  if(!cr) return;
  ns = Math.min(cr.min * 4, Math.max(cr.min, ns));
  cr.x = cx - (cx - cr.x) * ns / cr.scale; cr.y = cy - (cy - cr.y) * ns / cr.scale;
  cr.scale = ns; crApply();
}
function crSave(){
  if(!cr) return;
  var isB = cr.target === 'banner', ow, oh;
  if(isB){ ow = Math.max(1, Math.min(BN_W, Math.round(cr.bw / cr.scale))); oh = Math.max(1, Math.round(ow / cr.r)); }
  else{ ow = CR.avatar.w; oh = Math.round(ow / CR.avatar.r); }
  var c = document.createElement('canvas'); c.width = ow; c.height = oh;
  var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, ow, oh);
  x.imageSmoothingQuality = 'high';
  x.drawImage(cr.img, -cr.x / cr.scale, -cr.y / cr.scale, cr.bw / cr.scale, cr.bh / cr.scale, 0, 0, ow, oh);
  var d;
  try{ d = encodeCap(c, 'image/jpeg', isB ? .88 : .85, isB ? 350 * 1024 : 150 * 1024); }catch(err){ toast('تعذّر حفظ الصورة'); return; }
  if(cr.target === 'avatar') ep.avatar = d; else ep.banner = d + '#r' + cr.r.toFixed(2);
  cr = null; editSheet();
}
var crPtr = {}, crG = null;
function crPts(){ return Object.keys(crPtr).map(function(k){ return crPtr[k]; }); }
function crStart(){
  var pts = crPts(), r = $('#cr-box').getBoundingClientRect();
  if(pts.length >= 2){
    crG = {d:Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1, s:cr.scale};
  }else if(pts.length === 1){
    crG = {px:pts[0].x, py:pts[0].y, x:cr.x, y:cr.y};
  }else crG = null;
}
document.addEventListener('pointerdown', function(e){
  var b = e.target.closest && e.target.closest('#cr-box'); if(!b || !cr) return;
  crPtr[e.pointerId] = {x:e.clientX, y:e.clientY};
  try{ b.setPointerCapture(e.pointerId); }catch(x){}
  b.style.cursor = 'grabbing'; e.preventDefault(); crStart();
});
document.addEventListener('pointermove', function(e){
  if(!cr || !crG || !crPtr[e.pointerId]) return;
  crPtr[e.pointerId] = {x:e.clientX, y:e.clientY};
  var pts = crPts();
  if(pts.length >= 2 && crG.d){
    var r = $('#cr-box').getBoundingClientRect();
    var mx = (pts[0].x + pts[1].x) / 2 - r.left, my = (pts[0].y + pts[1].y) / 2 - r.top;
    crZoomAt(crG.s * Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) / crG.d, mx, my);
  }else if(pts.length === 1 && crG.px !== undefined){
    cr.x = crG.x + (pts[0].x - crG.px); cr.y = crG.y + (pts[0].y - crG.py); crApply();
  }
});
function crEnd(e){
  delete crPtr[e.pointerId];
  if(cr) crStart();
  if(!crPts().length){ var b = $('#cr-box'); if(b) b.style.cursor = ''; }
}
document.addEventListener('pointerup', crEnd);
document.addEventListener('pointercancel', crEnd);
document.addEventListener('wheel', function(e){
  var b = e.target.closest && e.target.closest('#cr-box');
  if(!cr || !b) return;
  e.preventDefault();
  var r = b.getBoundingClientRect();
  crZoomAt(cr.scale * (e.deltaY < 0 ? 1.1 : 1 / 1.1), e.clientX - r.left, e.clientY - r.top);
}, {passive:false});

   تسجيل الدخول والإقلاع (نسخة مُصلَحة)
   الأهداف: 1) المستخدم الجديد يدخل التطبيق مباشرة بعد إنشاء الحساب
            2) لا رسالة "حاول لاحقاً" عند أول محاولة (إعادة محاولة تلقائية + تحميل غير حرج في الخلفية)

/* ----- أدوات الشبكة: مهلة زمنية + إعادة محاولة تلقائية ----- */
// يغلّف أي وعد بمهلة حتى لا يبقى التطبيق معلّقاً على شبكة ضعيفة
function pxTimeout(p, ms){
  return new Promise(function(res, rej){
    var t = setTimeout(function(){ var e = new Error('timeout'); e.timeout = true; rej(e); }, ms);
    Promise.resolve(p).then(function(v){ clearTimeout(t); res(v); }, function(e){ clearTimeout(t); rej(e); });
  });
}
// هل الخطأ مؤقت (شبكة أو خادم مشغول) فيستحق إعادة المحاولة؟ أخطاء كلمة المرور وغيرها لا تُعاد
function pxTransient(e){
  if(!e) return false;
  if(e.timeout) return true;
  var m = String((e && e.message) || e || ''), s = +(e && e.status) || 0;
  if(/fetch|network|load failed|timeout|timed out|abort|ECONN|temporarily|unavailable|gateway/i.test(m)) return true;
  return s >= 500 && s < 600;
}
function pxRetry(fn, tries, base){
  tries = tries || 3; base = base || 500;
  return (function go(n){
    return fn().catch(function(e){
      if(n >= tries || !pxTransient(e)) throw e;
      return new Promise(function(r){ setTimeout(r, base * n); }).then(function(){ return go(n + 1); });
    });
  })(1);
}
function pxGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function pxSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }

/* ----- رسائل الأخطاء بالعربية (لا تظهر نصوصاً إنجليزية خام للمستخدم) ----- */
function mapErr(e){
  var m = String((e && (e.message || e.error_description)) || e || ''), s = +(e && e.status) || 0;
  if(/invalid login|invalid credentials/i.test(m)) return L('البريد أو كلمة المرور غير صحيحة.', 'Wrong email or password.');
  if(/not confirmed/i.test(m)) return L('أكّد بريدك من الرسالة المرسلة إليك ثم سجّل الدخول.', 'Confirm your email from the message we sent, then sign in.');
  if(/already registered|already been registered|user_already_exists/i.test(m)) return L('هذا البريد مسجّل مسبقاً.', 'This email is already registered.');
  if(/password/i.test(m) && /(least|short|weak|characters)/i.test(m)) return L('كلمة المرور ضعيفة، استخدم 6 أحرف على الأقل.', 'Weak password, use at least 6 characters.');
  if(/invalid.*email|unable to validate email|email address.*invalid/i.test(m)) return L('البريد الإلكتروني غير صالح.', 'Invalid email address.');
  if(/signups? .*(not allowed|disabled)/i.test(m)) return L('التسجيل مغلق حالياً.', 'Sign-ups are currently closed.');
  if(/database error/i.test(m)) return L('اسم المستخدم مستخدم مسبقاً أو غير صالح.', 'Username is taken or invalid.');
  if(/rate limit|too many|over_.*_limit/i.test(m) || s === 429) return L('محاولات كثيرة، انتظر قليلاً ثم أعد المحاولة.', 'Too many attempts, wait a bit and try again.');
  if((e && e.timeout) || /timed? ?out|timeout/i.test(m)) return L('الاتصال بطيء، حاول مرة أخرى.', 'Slow connection, try again.');
  if(/fetch|network|load failed/i.test(m)) return L('تعذّر الاتصال، تحقق من الإنترنت.', 'Could not connect, check your internet.');
  return L('حدث خطأ غير متوقع، حاول مرة أخرى.', 'Something went wrong, try again.') + ' (' + m.slice(0, 80) + ')';
}

    '<div class="acts"><button class="btn line" id="au-sw" style="width:100%">' + (up ? L('لدي حساب', 'I have an account') : L('إنشاء حساب جديد', 'Create account')) + '</button></div>' +
    (libOk ? '' : '<div class="acts"><button class="btn ghost" id="au-retry" style="width:100%">' + L('إعادة تحميل الاتصال', 'Retry connection') + '</button></div>') + '</div>';

function authMsg(t){ var m = document.getElementById('au-msg'); if(m) m.textContent = t; }
// حالة "جارٍ التنفيذ": تعطيل الأزرار والحقول لمنع الضغط المزدوج
function authBusy(on, up){
  var go = document.getElementById('au-go'); if(!go) return;
  go.disabled = on;
  go.textContent = on ? L('لحظة…', 'One moment…') : (up ? L('إنشاء الحساب', 'Create account') : L('دخول', 'Sign in'));
  ['au-name', 'au-user', 'au-mail', 'au-pass'].forEach(function(id){ var x = document.getElementById(id); if(x) x.readOnly = on; });
}
function authGo(up){
  var go = document.getElementById('au-go'); if(!go || go.disabled) return;
  // المكتبة لم تُحمَّل بعد: لا نعطّل الزر ولا نترك المستخدم بلا رد (كان الزر يعلق سابقاً)
  if(!sbc){
    authMsg(L('الاتصال لم يجهز بعد، حاول بعد لحظة.', 'Connection is not ready yet, try again in a moment.'));
    pxLoadLib(function(ok){ if(ok) cloudBoot(); });
    return;
  }
  var mail = document.getElementById('au-mail').value.trim().toLowerCase(), pass = document.getElementById('au-pass').value;
  if(!mail || !pass){ authMsg(L('أدخل البريد وكلمة المرور.', 'Enter your email and password.')); return; }
  if(!/^\S+@\S+\.\S+$/.test(mail)){ authMsg(L('البريد الإلكتروني غير صالح.', 'Invalid email address.')); return; }
  if(navigator.onLine === false){ authMsg(L('لا يوجد اتصال بالإنترنت.', 'No internet connection.')); return; }
  authMsg(''); authBusy(true, up);
  var fail = function(e){ authMsg(mapErr(e)); authBusy(false, up); };

  if(!up){
    // دخول: نعيد المحاولة تلقائياً مرتين إن كان الخطأ شبكة/خادم، ولا نعيد عند كلمة مرور خاطئة
    pxRetry(function(){
      return pxTimeout(sbc.auth.signInWithPassword({email:mail, password:pass}), 15000).then(function(r){
        if(r && r.error && pxTransient(r.error)) throw r.error;
        return r;
      });
    }, 3, 600).then(function(r){
      if(r.error){ fail(r.error); return; }
      return startCloud(r.data.user);
    }).catch(fail);
    return;
  }

  var name = document.getElementById('au-name').value.trim(), user = document.getElementById('au-user').value.trim().toLowerCase();
  if(!/^[a-z0-9_.]{2,32}$/.test(user) || /\.\.|^\.|\.$/.test(user)){ authMsg(L('اسم المستخدم: من 2 إلى 32 حرفاً إنجليزياً صغيراً أو أرقاماً أو _ أو . (بدون نقطتين متتاليتين ولا نقطة في الطرفين)', 'Username: 2 to 32 lowercase English letters, numbers, _ or . (no double or edge periods)')); authBusy(false, up); return; }
  if(pass.length < 8){ authMsg(L('كلمة المرور 8 أحرف على الأقل.', 'Password must be at least 8 characters.')); authBusy(false, up); return; }

  // فحص توفر الاسم: إن فشل الفحص نفسه (شبكة أو دالة غير موجودة) لا نمنع التسجيل، والقاعدة ترفض المكرر
  pxTimeout(sbc.rpc('username_available', {u:user}), 10000).then(function(r){ return (r && !r.error) ? !!r.data : true; }, function(){ return true; })
  .then(function(free){
    if(!free){ authMsg(L('اسم المستخدم مستخدم، اختر غيره.', 'Username is taken, choose another.')); authBusy(false, up); return; }
    return pxTimeout(sbc.auth.signUp({email:mail, password:pass, options:{data:{username:user, name:name}}}), 20000).then(function(s){
      if(s.error){ fail(s.error); return; }
      var u = s.data && s.data.user;
      // Supabase يرجع مستخدماً بدون identities عندما يكون البريد مسجّلاً أصلاً (حماية من كشف الحسابات)
      if(u && u.identities && !u.identities.length){ authMsg(L('هذا البريد مسجّل مسبقاً.', 'This email is already registered.')); authBusy(false, up); return; }
      if(s.data && s.data.session) return startCloud(u);   // الحساب جاهز: ندخل التطبيق مباشرة
      // لا توجد جلسة: على الأغلب "تأكيد البريد" مفعّل في إعدادات Supabase. نجرّب الدخول فوراً قبل أن نطلب من المستخدم أي شيء
      return pxTimeout(sbc.auth.signInWithPassword({email:mail, password:pass}), 15000).then(function(r){
        if(!r.error && r.data && r.data.session) return startCloud(r.data.user);
        if(r.error && /not confirmed/i.test(r.error.message || '')) authScreen(L('تم إنشاء الحساب. أكّد بريدك من الرسالة المرسلة إليك ثم سجّل الدخول.', 'Account created. Confirm your email from the message we sent, then sign in.'), 'in', mail);
        else authScreen(r.error ? mapErr(r.error) : '', 'in', mail);
      });
    });
  }).catch(fail);
}

/* ----- تسجيل الخروج: نرسل أي تعديلات معلّقة أولاً حتى لا تضيع ----- */
function doLogout(){
  var flush = (CL.uid && CL.snap && (CL.pending || pxGet(PX_DIRTY) === '1')) ?
    Promise.race([syncNow().catch(function(){}), new Promise(function(r){ setTimeout(r, 3000); })]) : Promise.resolve();
  var reload = function(){ location.reload(); };
  flush.then(function(){
    CL.uid = null; CL.snap = null; clearInterval(CL.poll); clearTimeout(CL.timer);
    pxSet(PX_UID, ''); pxSet(PX_DIRTY, '0');
    var keep = state.settings; state = JSON.parse(JSON.stringify(DEFAULT)); state.settings = keep;
    return _saveLocal();
  }).then(function(){ return sbc ? pxTimeout(sbc.auth.signOut(), 5000) : null; }).catch(function(){}).then(function(){
    try{ Object.keys(localStorage).forEach(function(k){ if(/^sb-.+-auth-token/.test(k)) localStorage.removeItem(k); }); }catch(e){}
  }).then(reload, reload);
}
document.addEventListener('click', function(e){ if(e.target.closest('[data-act="logout"]')) doLogout(); });

// المستخدم المخزَّن من جلسة Supabase في الجهاز (قراءة فورية بدون شبكة)
function pxStoredUser(){
  try{
    for(var i = 0; i < localStorage.length; i++){
      var k = localStorage.key(i);
      if(/^sb-.+-auth-token$/.test(k)){
        var v = JSON.parse(localStorage.getItem(k)), u = v && (v.user || (v.currentSession && v.currentSession.user));
        if(u && u.id) return u;
      }
    }
  }catch(e){}
  return null;
}
function pxHasCache(){ return !!(state && state.profile && state.profile.username && state.cats && state.cats.length); }
// إعادة رسم هادئة: لا نقاطع المستخدم وهو يكتب أو وفي صفحة منبثقة مفتوحة

// فتح فوري من النسخة المحفوظة على الجهاز (بدون أي طلب شبكة، وقبل حتى تحميل المكتبة)
function pxWarmOpen(user){
  CL.user = user; CL.uid = user.id; CL.email = user.email || '';

function startCloud(user){
  CL.user = user; CL.uid = user.id; CL.email = user.email || '';
  if(CL.warm){ pxRefresh(0); return Promise.resolve(); }
  // أول دخول على هذا الجهاز (أو بعد تسجيل خروج): تحميل كامل مع إعادة محاولة، والتحميل غير الحرج (الأصدقاء والمحادثات) يتأخر للخلفية
  return pullAll(state).then(function(){
    pxAfterPull(); pxEnter(); startPoll(); cloudSchedule(); srcFetch(); probePostImg(); pxSocial(); pxWarmImages();
  }).catch(function(e){ pxPullFail(e, user); });
}
function pxAfterPull(){

}
// تحديث بصمت من الخادم بعد الفتح الفوري
function pxRefresh(n){
  if(CL.refreshing || !sbc || !CL.uid) return;
  CL.refreshing = true;
  var user = CL.user, before = pxDataSig() + JSON.stringify(state.profile);
  pullAll(state).then(function(){
    CL.refreshing = false; CL.warm = false;
    pxAfterPull(); startPoll(); cloudSchedule(); srcFetch(); probePostImg();
    if(pxDataSig() + JSON.stringify(state.profile) !== before) pxSoftRender();
    pxSocial(); pxWarmImages();
  }).catch(function(e){
    CL.refreshing = false;
    if((e && e.banned) || pxAuthErr(e)){ pxPullFail(e, user); return; }
    try{ console.error(e); }catch(x){}
    // شبكة ضعيفة: التطبيق يبقى شغالاً من النسخة المحلية، ونعيد المحاولة بالخلفية
    if(n === 1) toast(L('تعذّر تحديث بياناتك الآن، سنعيد المحاولة تلقائياً.', 'Could not refresh now, retrying automatically.'));
    if(n < 8) setTimeout(function(){ if(CL.uid && !CL.snap) pxRefresh(n + 1); }, Math.min(30000, 3000 * (n + 1)));
  });
}
window.addEventListener('online', function(){
  if(!CL.uid || !sbc) return;
  if(!CL.snap && !CL.refreshing) pxRefresh(0); else cloudSchedule();
});
window.addEventListener('pagehide', function(){ if(CL.uid && CL.snap && CL.pending) pxSet(PX_DIRTY, '1'); });

function pxAuthErr(e){
  var m = String((e && e.message) || e || ''), c = String((e && e.code) || '');
  return /jwt|invalid.*token|refresh_token|not authenticated/i.test(m) || c === 'PGRST301' || +(e && e.status) === 401;
}
// فشل التحميل: لا نرجع لشاشة الدخول بالخطأ (الجلسة سليمة)، بل نعرض زر "إعادة المحاولة" مع السبب
function pxPullFail(e, user){
  try{ console.error(e); }catch(x){}
  CL.uid = null; CL.snap = null; CL.warm = false;
  if(e && e.banned){ sbc.auth.signOut(); pxSet(PX_UID, ''); authScreen(L('تم حظر هذا الحساب.', 'This account has been banned.')); return; }
  if(pxAuthErr(e)){ sbc.auth.signOut().then(function(){ authScreen(L('انتهت جلستك، سجّل الدخول من جديد.', 'Your session expired, please sign in again.')); }, function(){ authScreen(L('انتهت جلستك، سجّل الدخول من جديد.', 'Your session expired, please sign in again.')); }); return; }
  try{ applyTheme(); }catch(x){}
  try{ window.bootHide && window.bootHide(); }catch(x){}
  var el = document.getElementById('authwrap');
  if(!el){ el = document.createElement('div'); el.id = 'authwrap'; document.body.appendChild(el); }
  el.style.cssText = 'position:fixed;inset:0;z-index:1000;background:var(--bg);color:var(--fg,inherit);overflow:auto;padding:24px 18px';
  var off = navigator.onLine === false, why = off ? L('لا يوجد اتصال بالإنترنت.', 'No internet connection.') : (pxTransient(e) ? L('الاتصال بالخادم بطيء أو متقطع.', 'The connection to the server is slow or unstable.') : L('تعذّر تحميل بياناتك.', 'Could not load your data.'));
  el.innerHTML = '<div style="max-width:420px;margin:12vh auto 0;text-align:center"><div class="pg-h"><h1>' + L('تعذّر الاتصال', 'Connection problem') + '</h1></div>' +
    '<div class="srmsg" role="status">' + esc(why) + '</div>' +
    '<div class="acts"><button class="btn" id="px-retry" style="width:100%">' + L('إعادة المحاولة', 'Try again') + '</button></div>' +
    '<div class="acts"><button class="btn ghost" data-act="logout" style="width:100%">' + L('تسجيل الخروج', 'Sign out') + '</button></div>' +
    '<div dir="ltr" style="opacity:.5;font-size:11px;margin-top:14px;word-break:break-word">' + esc(String((e && e.message) || e || '').slice(0, 160)) + '</div></div>';
  var b = document.getElementById('px-retry');
  b.onclick = function(){ b.disabled = true; b.textContent = L('لحظة…', 'One moment…'); startCloud(user); };
}

/* التحميل غير الحرج: الأصدقاء والمحادثات. فشله لا يمنع دخول التطبيق، ويُعاد تلقائياً */
function pxSocial(){
  if(CL.socialBusy || !CL.uid) return Promise.resolve();

/* تسخين الصور: نحمّل مسبقاً أغلفة أهم العناصر في وقت الفراغ إلى ذاكرة المتصفح على جهاز المستخدم فقط */
function pxWarmImages(){
  if(CL.warmed) return; CL.warmed = true;
  var c = navigator.connection || {};
  if(c.saveData || /(^|-)2g$/.test(c.effectiveType || '')) return;
  var run = function(){
    try{
      var seen = {}, urls = [];
      state.items.slice().sort(function(a, b){ return (b.added || 0) - (a.added || 0); }).forEach(function(i){
        var u = String(i.img || '').replace(/#(?:sm|r[\d.]+)$/, '');
        if(u && !/^data:/.test(u) && !seen[u] && urls.length < 40){ seen[u] = 1; urls.push(u); }
      });
      var k = 0;
      (function next(){
        if(k >= urls.length) return;
        var im = new Image(); im.decoding = 'async'; im.onload = im.onerror = function(){ setTimeout(next, 30); }; im.src = imgSafe(urls[k++]);
      })();
    }catch(e){}
  };
  if('requestIdleCallback' in window) requestIdleCallback(run, {timeout:4000}); else setTimeout(run, 2500);
}

function cloudBoot(){
  if(!window.supabase || !window.supabase.createClient){
    // المكتبة لم تُحمَّل: إن كان التطبيق مفتوحاً من النسخة المحلية نكمل بصمت ونعيد المحاولة، وإلا نعرض زر إعادة المحاولة
    if(CL.uid){ pxLoadLib(function(ok){ if(ok) cloudBoot(); else setTimeout(cloudBoot, 10000); }); return; }
    authScreen(L('تعذّر تحميل مكتبة الاتصال. تحقق من الإنترنت ثم اضغط إعادة التحميل.', 'Could not load the connection library. Check your internet and retry.')); return;
  }
  if(!sbc){
    sbc = window.supabase.createClient(SB_URL, SB_KEY);
    sbc.auth.onAuthStateChange(function(ev){ if(ev === 'SIGNED_OUT' && CL.uid){ location.reload(); } });
  }
  if(CL.warm){ pxRefresh(0); return; }   // فُتح التطبيق مسبقاً من النسخة المحلية
  if(CL.uid) return;
  var su = pxStoredUser();
  pxTimeout(sbc.auth.getSession(), 8000).then(function(r){
    var s = r.data && r.data.session;
    if(s) startCloud(s.user); else authScreen('');
  }).catch(function(){
    if(su) startCloud(su); else authScreen(L('تعذّر الاتصال بالخادم، تحقق من الإنترنت.', 'Could not reach the server, check your internet.'));
  });
}
// يُستدعى أول ما تُحمَّل بيانات الجهاز: لو عندنا جلسة + نسخة محلية لهذا المستخدم نفتح فوراً دون انتظار الشبكة أو المكتبة
function pxBoot(){
  var su = pxStoredUser();
  if(su && pxGet(PX_UID) === su.id && pxHasCache()) pxWarmOpen(su);
  waitSb(cloudBoot);
}

/* ----- جلب بيانات المستخدم الأساسية من الخادم (بدون لمس state) ----- */
// الملف الشخصي يُنشأ عادة بمُشغّل (trigger) في قاعدة البيانات؛ قد يتأخر لحظات بعد التسجيل، فننتظر ونعيد المحاولة بدل الفشل
function pxMakeProfile(user){
  var md = (user && user.user_metadata) || {}, un = String(md.username || '').toLowerCase();
  if(!un && user && user.email){ un = (user.email.split('@')[0].toLowerCase().replace(/[^a-z0-9_]/g, '').slice(0, 20) || 'user') + Math.floor(1000 + Math.random() * 9000); }

  return sbc.from('profiles').insert({id:user.id, username:un, name:md.name || md.full_name || ''}).select('*').maybeSingle().then(function(r){

function pxFetchCore(user){

// دمج عند وجود تعديلات محلية لم تُرفع: نسخة الجهاز تغلب في العناصر المشتركة، وما انفرد به الخادم يبقى
function pxMerge(loc, srv){

  (loc || []).forEach(function(x){ seen[x.id] = 1; out.push(x); });
  (srv || []).forEach(function(x){ if(!seen[x.id]) out.push(x); });
  return out;
}
/* ----- تحميل بيانات المستخدم: يجلب أولاً، ثم يستبدل state دفعة واحدة (فلا يضيع شيء لو فشل الجلب) ----- */
function pullAll(local){

    // استيراد بيانات الجهاز القديمة (قبل وجود الحسابات) يحدث فقط لو لم يسبق تسجيل دخول على هذا الجهاز: يمنع تسرّب بيانات مستخدم سابق إلى حساب جديد

    // 1) نسخة تمثّل ما على الخادم تماماً → تُؤخذ منها اللقطة (snap) التي تُقارَن بها التعديلات القادمة

    var fin = Object.assign({}, sv);

      if(cur.profile && cur.profile.username === p.username){

    fin.active = cur.active; fin.sort = cur.sort || 'rating'; fin.blocked = cur.blocked || [];

/* ----- sync (debounced diff) ----- */
function cloudSchedule(){

function upImg(d, folder){

    var ext = (blob.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg').replace('svg+xml', 'svg').replace(/[^a-z0-9]/g, '') || 'jpg';
    var path = CL.uid + '/' + folder + '/' + uid() + '.' + ext;
    return sbc.storage.from('media').upload(path, blob, {contentType:blob.type || 'image/jpeg', cacheControl:'31536000'}).then(function(r){
      if(r.error) throw r.error;
      return sbc.storage.from('media').getPublicUrl(path).data.publicUrl;
    });
  });
}
function fixImages(){

function cloudSync(){
  if(!CL.uid || !CL.snap) return Promise.resolve();
  var snap = CL.snap;
  return fixImages().then(function(){
    var rows = rowsOf(), chain = Promise.resolve();
    ['cats', 'items', 'lists'].forEach(function(t){
      chain = chain.then(function(){
        var cur = {}; rows[t].forEach(function(r){ cur[r.id] = JSON.stringify(r); });
        var up = rows[t].filter(function(r){ return snap[t][r.id] !== cur[r.id]; });
        var del = Object.keys(snap[t]).filter(function(id){ return !(id in cur); });
        var p = Promise.resolve();
        for(var i = 0; i < up.length; i += 200){
          (function(ch){ p = p.then(function(){ return sbc.from(t).upsert(ch, {onConflict:'user_id,id'}).then(function(r){ if(r.error) throw r.error; }); }); })(up.slice(i, i + 200));
        }
        for(var j = 0; j < del.length; j += 100){
          (function(ch){ p = p.then(function(){ return sbc.from(t).delete().eq('user_id', CL.uid).in('id', ch).then(function(r){ if(r.error) throw r.error; }); }); })(del.slice(j, j + 100));
        }

      });
    });

    chain = chain.then(function(){
      var row = profRow(), s = JSON.stringify(row);
      if(s === snap.prof) return;
      return sbc.from('profiles').update(row).eq('id', CL.uid).then(function(r){
        if(!r.error){ snap.prof = s; snap.username = row.username; return; }
        var r2 = Object.assign({}, row); delete r2.username;

          if(x.error) throw x.error;

          snap.prof = JSON.stringify(profRow()); _saveLocal();
        });
      });
    });
    // follows (+ a DM for every new follow)
    chain = chain.then(function(){
      var now = state.profile.following.slice(), old = snap.follows;
      var add = now.filter(function(u){ return old.indexOf(u) < 0; }), rm = old.filter(function(u){ return now.indexOf(u) < 0; });
      var p = Promise.resolve(), ok = old.filter(function(u){ return now.indexOf(u) > -1; }), changed = false;
      add.forEach(function(u){
        p = p.then(function(){ return idFor(u); }).then(function(id){
          if(!id){ state.profile.following = state.profile.following.filter(function(x){ return x !== u; }); return; }
          return sbc.from('follows').insert({follower:CL.uid, followee:id}).then(function(r){
            if(r.error && r.error.code !== '23505') throw r.error;
            ok.push(u); changed = true;
            return sbc.rpc('create_dm', {p_user:id}).then(function(r){ if(r && r.error){ try{ console.error(r.error); }catch(x){} toast(L('تعذّر إنشاء المحادثة: ', 'Could not create the chat: ') + (r.error.message || '')); } });
          });
        });
      });
      rm.forEach(function(u){
        p = p.then(function(){ return idFor(u); }).then(function(id){
          if(!id) return;
          return sbc.from('follows').delete().eq('follower', CL.uid).eq('followee', id).then(function(r){ if(r.error) throw r.error; changed = true; });
        });
      });
      return p.then(function(){ snap.follows = state.profile.following.slice(); if(changed) CL.chatsDirty = true; });
    });
    return chain;
  });
}

function loadChats(){
  return sbc.from('chat_members').select('chat_id,user_id,role').then(function(mem){
    if(mem.error) throw mem.error;

    mem.data.forEach(function(x){ if(chatIds.indexOf(x.chat_id) < 0) chatIds.push(x.chat_id); if(memberIds.indexOf(x.user_id) < 0) memberIds.push(x.user_id); });
    CL.memberIds = memberIds;
    Object.keys(CL.msgs).forEach(function(k){ if(chatIds.indexOf(k) < 0) delete CL.msgs[k]; });
    if(!chatIds.length){ state.chats = []; return; }
    var known = chatIds.filter(function(i){ return CL.msgs[i]; }), fresh = chatIds.filter(function(i){ return !CL.msgs[i]; });
    if(!CL.cursor){ fresh = chatIds.slice(); known = []; }
    var qs = [sbc.from('chats').select('id,type,name,avatar_url').in('id', chatIds)];
    if(fresh.length) qs.push(sbc.from('messages').select('*').in('chat_id', fresh).order('created_at', {ascending:false}).limit(600));
    if(known.length && CL.cursor) qs.push(sbc.from('messages').select('*').in('chat_id', known).gte('created_at', CL.cursor).order('created_at'));
    return Promise.all(qs).then(function(rs){
      rs.forEach(function(r){ if(r.error) throw r.error; });
      var msgs = [];
      if(fresh.length) msgs = msgs.concat(rs[1].data.slice().reverse());
      if(known.length && CL.cursor) msgs = msgs.concat(rs[rs.length - 1].data);
      var ids = memberIds.slice(); msgs.forEach(function(m){ if(m.user_id) ids.push(m.user_id); (m.sys_users || []).forEach(function(u){ ids.push(u); }); });

function isOwnerMe(){ return !!(state.profile && state.profile.role === 'owner'); }
function banCardHTML(){

function banAction(on){
  var u = (($('#ban-u') || {}).value || '').trim().toLowerCase().replace(/^@/, '');
  if(!/^[a-z0-9_.]{2,32}$/.test(u)){ toast('أدخل اسم مستخدم صالحاً'); return; }
  if(u === me().username){ toast('لا يمكنك حظر نفسك'); return; }
  idFor(u).then(function(id){
    if(!id){ toast('المستخدم غير موجود'); return; }
    return sbc.rpc('admin_set_ban', {p_user:id, p_banned:on, p_reason:(($('#ban-r') || {}).value || '').trim()}).then(function(r){
      if(r.error) throw r.error;
      toast(on ? 'تم حظر @' + u : 'تم رفع الحظر عن @' + u);
    });
  }).catch(function(e){ console.error(e); toast('تعذّر التنفيذ: ' + ((e && e.message) || '')); });
}
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]'); if(!t || !isOwnerMe()) return; var a = t.dataset.act;
  if(a === 'do-ban'){
    if(!t.classList.contains('sure')){ t.classList.add('sure'); t.textContent = 'اضغط مرة أخرى للتأكيد'; return; }
    banAction(true); t.classList.remove('sure'); t.textContent = 'حظر';
  }
  else if(a === 'do-unban'){ banAction(false); }
  else if(a === 'ban-list'){
    sbc.from('profiles').select('username,name').eq('banned', true).then(function(r){
      if(r.error) throw r.error;
      var b = $('#ban-list'); if(!b) return;

});

function ntAgo(t){
  var sec = (Date.now() - t) / 1000, m = Math.floor(sec / 60), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if(sec < 60) return L('الآن', 'now');
  var ap = function(n, one, two, few, many){ return n === 1 ? one : n === 2 ? two : (n >= 3 && n <= 10) ? n + ' ' + few : n + ' ' + many; };
  if(m < 60) return L('قبل ' + ap(m, 'دقيقة', 'دقيقتين', 'دقائق', 'دقيقة'), m + 'm ago');
  if(h < 24) return L('قبل ' + ap(h, 'ساعة', 'ساعتين', 'ساعات', 'ساعة'), h + 'h ago');
  if(d < 7) return L('قبل ' + ap(d, 'يوم', 'يومين', 'أيام', 'يوماً'), d + 'd ago');
  return new Date(t).toLocaleDateString(isEn() ? 'en' : 'ar');
}

function ntFetch(){

    sbc.from('announcements').select('id,title,body,kind,created_at,created_by').order('created_at', {ascending:false}).limit(30),
    sbc.from('follows').select('follower').eq('followee', CL.uid),

    owner ? sbc.from('suggestions').select('*').order('created_at', {ascending:false}).limit(50) : Promise.resolve({data:[]})
  ]).then(function(r){
    NT.ann = r[0].error ? [] : r[0].data.map(function(a){ return {id:a.id, t:Date.parse(a.created_at), kind:a.kind, title:a.title, body:a.body || '', by:a.created_by}; });
    NT.rep = r[2].error ? [] : r[2].data.map(function(x){
      return {id:x.id, t:Date.parse(x.created_at), status:x.status, reason:x.reason, details:x.details || '', context:x.context || '', reporter:x.reporter, reported:x.reported,
        reporterU:x.reporter_username, reporterN:x.reporter_name, reportedU:x.reported_username, reportedN:x.reported_name};
    });

      NT.rep.push({id:'s' + x.id, t:Date.parse(x.created_at), status:x.status, reason:'اقتراح', details:x.body || '', context:'sug', reporter:x.user_id, reporterU:x.username, reporterN:x.name});
    });
    var ids = r[1].error ? [] : r[1].data.map(function(x){ return x.follower; }); NT.fids = ids.slice();
    var st = null; try{ st = JSON.parse(ntGet('fol') || 'null'); }catch(e){}
    if(!st){ st = {seen:ids.slice(), list:[]}; }
    else{
      ids.forEach(function(id){ if(st.seen.indexOf(id) < 0){ st.seen.push(id); st.list.unshift({id:id, t:Date.now()}); } });
      st.list = st.list.slice(0, 50);
    }
    ntSet('fol', JSON.stringify(st));

      NT.fol = show.map(function(x){

/* ---------- 2) مصدر مخصص: رابط + كشف تلقائي للحقول ---------- */
function getAt(o, p){
  if(!p) return o;
  var parts = String(p).split('.').filter(Boolean), v = o;
  for(var i = 0; i < parts.length && v != null; i++) v = v[parts[i]];
  return v;
}
function getPath(o, p){
  if(!p) return undefined;
  var alts = String(p).split('|');
  for(var a = 0; a < alts.length; a++){
    var v = getAt(o, alts[a].trim());
    if(Array.isArray(v)) v = v[0];
    if(v != null && v !== '' && typeof v !== 'object') return v;
  }
  return undefined;
}
function autoArr(d){
  var best = null;
  (function walk(o, p, depth){
    if(o == null || depth > 4) return;
    if(Array.isArray(o)){
      if(o.length && o[0] && typeof o[0] === 'object' && !Array.isArray(o[0]) && (!best || o.length > best.arr.length)) best = {path:p, arr:o};
      return;
    }
    if(typeof o === 'object') Object.keys(o).forEach(function(k){ walk(o[k], p ? p + '.' + k : k, depth + 1); });
  })(d, '', 0);
  return best;
}
function leaves(o, pre, depth, out){
  out = out || [];
  if(o == null || depth > 3) return out;
  if(Array.isArray(o)){ if(o.length && typeof o[0] !== 'object') out.push({p:pre, v:o[0]}); return out; }
  if(typeof o === 'object'){ Object.keys(o).forEach(function(k){ leaves(o[k], pre ? pre + '.' + k : k, depth + 1, out); }); return out; }
  if(pre) out.push({p:pre, v:o});
  return out;
}
function detectMap(d){
  var found = autoArr(d); if(!found) return null;
  var lv = leaves(found.arr[0], '', 0), res = {resultsPath:found.path, titlePath:'', subPath:'', imgPath:'', imgBase:''};
  function last(p){ return p.split('.').pop(); }
  var TK = ['title', 'name', 'label', 'headline', 'original_title', 'original_name', 'trackName', 'collectionName', 'artistName', 'canonicalTitle', 'l'];
  for(var i = 0; i < TK.length && !res.titlePath; i++){
    var hit = lv.filter(function(x){ return last(x.p) === TK[i] && typeof x.v === 'string' && x.v; }).sort(function(a, b){ return a.p.length - b.p.length; })[0];
    if(hit) res.titlePath = hit.p;
  }
  if(!res.titlePath){ var s = lv.filter(function(x){ return typeof x.v === 'string' && x.v.length > 1 && !/^https?:|^\//.test(x.v); })[0]; if(s) res.titlePath = s.p; }
  var imgs = lv.filter(function(x){
    return typeof x.v === 'string' && x.v && (/\.(jpe?g|png|webp|gif)(\?|#|$)/i.test(x.v) || /(poster|cover|image|img|thumb|artwork|picture|photo)/i.test(x.p));
  });
  var absI = imgs.filter(function(x){ return /^(https?:)?\/\//.test(x.v); });
  var pick = (absI.length ? absI : imgs).sort(function(a, b){ return (/large|big|original|xl|medium/i.test(b.p) ? 1 : 0) - (/large|big|original|xl|medium/i.test(a.p) ? 1 : 0); })[0];
  if(pick) res.imgPath = pick.p;
  var subs = lv.filter(function(x){
    return x.p !== res.titlePath && x.p !== res.imgPath && /(year|date|release|premiered|author|artist|creator|developer|genre|format)/i.test(last(x.p)) && (typeof x.v === 'string' || typeof x.v === 'number') && !/^https?:/.test(String(x.v));
  }).slice(0, 2);
  res.subPath = subs.map(function(x){ return x.p; }).join(', ');
  return res;
}
function hdrOpts(h){
  var out = {}, any = false;
  String(h || '').split(/\n/).forEach(function(line){
    var i = line.indexOf(':'); if(i < 1) return;
    var k = line.slice(0, i).trim(), v = line.slice(i + 1).trim();
    if(/^[A-Za-z0-9-]+$/.test(k) && v){ out[k] = v; any = true; }
  });
  return any ? {headers:out} : {};
}
function mapCustom(c, d){
  var arr = c.resultsPath ? getAt(d, c.resultsPath) : null;
  if(!Array.isArray(arr)){ var f = autoArr(d); arr = f ? f.arr : []; }
  return arr.slice(0, 10).map(function(x){
    var title = getPath(x, c.titlePath);
    var sub = String(c.subPath || '').split(',').map(function(s){ return getPath(x, s.trim()); }).filter(function(v){ return v != null && v !== ''; }).join('، ');
    var img = String(getPath(x, c.imgPath) || '');
    if(img && !/^(https?:|\/\/|data:)/.test(img) && c.imgBase) img = c.imgBase.replace(/\/+$/, '') + '/' + img.replace(/^\/+/, '');
    if(img.indexOf('//') === 0) img = 'https:' + img;
    img = img.replace(/^http:/, 'https:');
    return {title:title == null ? '' : String(title), sub:sub, img:/^https:/.test(img) ? img : ''};
  }).filter(function(r){ return r.title; });
}
function sCustom(c, q){
  var url = String(c.url).replace(/\{q\}/g, encodeURIComponent(q));
  return jget(url, hdrOpts(c.headers)).then(function(d){ return mapCustom(c, d); });
}
function withTimeout(p, ms){
  return Promise.race([p, new Promise(function(_, rej){ setTimeout(function(){ rej(new Error('timeout')); }, ms); })]);
}

function seSync(){
  var map = {'se-label':'label', 'se-url':'url', 'se-headers':'headers', 'se-rp':'resultsPath', 'se-tp':'titlePath', 'se-sp':'subPath', 'se-ip':'imgPath', 'se-ib':'imgBase'};

}
function seFill(){
  var map = {'se-label':'label', 'se-url':'url', 'se-headers':'headers', 'se-rp':'resultsPath', 'se-tp':'titlePath', 'se-sp':'subPath', 'se-ip':'imgPath', 'se-ib':'imgBase'};
  Object.keys(map).forEach(function(id){ var el = document.getElementById(id); if(el) el.value = SE[map[id]] || ''; });
  layer.querySelectorAll('[data-act="se-type"]').forEach(function(b){ b.classList.toggle('on', SE.types.indexOf(b.dataset.t) > -1); });
  var en = layer.querySelector('[data-act="se-en"]'); if(en) en.classList.toggle('on', !!SE.useEn);
}
function seParseJson(){
  var u = (SE.url || '').trim();
  if(u.charAt(0) !== '{') return true;
  try{
    var j = JSON.parse(u), m = {label:'label', url:'url', headers:'headers', resultsPath:'resultsPath', titlePath:'titlePath', subPath:'subPath', imgPath:'imgPath', imgBase:'imgBase'};
    Object.keys(m).forEach(function(k){ if(typeof j[k] === 'string') SE[m[k]] = j[k]; });
    if(Array.isArray(j.types)) SE.types = j.types.filter(function(t){ return ALLTYPES.indexOf(t) > -1; });
    if(typeof j.useEn === 'boolean') SE.useEn = j.useEn;
    if(SE.titlePath) SE.manual = true;
    seFill(); return true;
  }catch(e){ toast(L('صيغة JSON غير صحيحة', 'Invalid JSON')); return false; }
}
function seUrlOk(){
  if(!/^https:\/\/[^\s]+$/i.test(SE.url)){ toast(L('الرابط يجب أن يبدأ بـ https://', 'The URL must start with https://')); return false; }
  if(SE.url.indexOf('{q}') < 0){ toast(L('ضع {q} مكان كلمة البحث في الرابط', 'Put {q} where the search term goes')); return false; }

}
function seTest(){
  seSync(); if(!seParseJson() || !seUrlOk()) return;

  withTimeout(jget(url, hdrOpts(SE.headers)), 12000).then(function(d){
    if(!SE.manual || !SE.titlePath){
      var dm = detectMap(d);
      if(!dm){ box.innerHTML = '<div class="srmsg">لم يتم العثور على قائمة نتائج في الاستجابة. تأكد أن الرابط يعيد JSON يحتوي مصفوفة، أو اضبط المسارات يدوياً من الإعدادات المتقدمة.</div>'; return; }
      SE.resultsPath = dm.resultsPath; SE.titlePath = dm.titlePath; SE.subPath = dm.subPath; SE.imgPath = dm.imgPath; if(!SE.imgBase) SE.imgBase = dm.imgBase;
      seFill();
    }

    box.innerHTML = '<div class="srmsg">✓ ' + list.length + L(' نتيجة. هكذا ستظهر للمستخدمين:', ' results. This is how users will see them:') + '</div>' + list.slice(0, 3).map(function(r){
      return '<div class="sr"><span class="th" style="' + (r.img ? bgUrl(r.img) : '') + '"></span><span class="tx"><span class="nm" dir="auto">' + esc(r.title) + '</span>' + (r.sub ? '<span class="sub" dir="auto">' + esc(r.sub) + '</span>' : '') + '</span></div>';
    }).join('');
  }).catch(function(e){
    var m = (e && e.message) || '';
    box.innerHTML = '<div class="srmsg">' + (/Failed to fetch|NetworkError|Load failed/i.test(m) ? 'تعذّر الاتصال. غالباً المصدر لا يسمح بالاتصال من المتصفح (CORS) أو الرابط غير صحيح.' : 'فشل الاختبار.') + '<br><small dir="ltr">' + esc(m) + '</small></div>';
  });
}
function seSave(btn){
  seSync(); if(!seParseJson()) return; seSync();

function feedFetch(){
  if(!CL.uid || !sbc || FD.busy) return Promise.resolve();
  FD.busy = true; FD.t = Date.now(); var tab = FD.tab;
  var q = sbc.from('posts').select(POST_COLS).is('parent_id', null).order('created_at', {ascending: flt().sort === 'oldest'}).limit(60);
  if(tab === 'following'){
    var ids = state.profile.following.map(function(u){ return CL.idOf[u]; }).filter(Boolean); ids.push(CL.uid);
    q = q.in('user_id', ids);
  }
  q = fltQuery(q);
  return q.then(function(r){
    if(r.error) throw r.error;
    var rows = r.data || [], pids = rows.map(function(p){ return p.id; });
    return Promise.all([
      pids.length ? sbc.from('post_likes').select('post_id,user_id').in('post_id', pids) : {data:[]},
      pids.length ? sbc.from('posts').select('id,parent_id').in('parent_id', pids) : {data:[]},
      ensureUsers(rows.map(function(p){ return p.user_id; }))
    ]).then(function(x){
      if(tab !== FD.tab) return;
      FD.posts = rows; FD.likes = {}; FD.mine = {}; FD.rc = {};
      (x[0].data || []).forEach(function(l){ FD.likes[l.post_id] = (FD.likes[l.post_id] || 0) + 1; if(l.user_id === CL.uid) FD.mine[l.post_id] = 1; });
      (x[1].data || []).forEach(function(c){ FD.rc[c.parent_id] = (FD.rc[c.parent_id] || 0) + 1; });
      FD.loaded = true; FD.err = ''; FD.fresh = 0;
    });
  }).catch(function(e){ try{ console.error(e); }catch(x){} FD.err = feedErrMsg(e); FD.loaded = true; }).then(function(){ FD.busy = false; feedPaint(); });
}
function feedCheck(){
  if(!CL.uid || !sbc || FD.busy || FD.chk || !FD.loaded || FD.err) return;
  if(Date.now() - FD.ckT < 5000) return; FD.ckT = Date.now();
  var tab = FD.tab, top = FD.posts.length ? FD.posts[0].created_at : new Date(FD.t || Date.now()).toISOString();
  var q = sbc.from('posts').select('id,user_id').is('parent_id', null).gt('created_at', top).neq('user_id', CL.uid).limit(30);

}

function feedLike(id){

function ppFetch(id, force){
  if(!CL.uid || !sbc || !id) return Promise.resolve();
  var s = PP[id] = PP[id] || {rows:[], loaded:false, err:'', busy:false, t:0};
  if(s.busy || (!force && s.loaded && Date.now() - s.t < 20000)) return Promise.resolve();

  return sbc.from('posts').select(POST_COLS).eq('user_id', id).is('parent_id', null).order('created_at', {ascending:false}).limit(50).then(function(r){
    if(r.error) throw r.error;
    var rows = r.data || [], pids = rows.map(function(p){ return p.id; });
    return Promise.all([
      pids.length ? sbc.from('post_likes').select('post_id,user_id').in('post_id', pids) : {data:[]},
      pids.length ? sbc.from('posts').select('id,parent_id').in('parent_id', pids) : {data:[]}
    ]).then(function(x){
      rows.forEach(function(p){ delete FD.likes[p.id]; delete FD.mine[p.id]; delete FD.rc[p.id]; });
      (x[0].data || []).forEach(function(l){ FD.likes[l.post_id] = (FD.likes[l.post_id] || 0) + 1; if(l.user_id === CL.uid) FD.mine[l.post_id] = 1; });
      (x[1].data || []).forEach(function(c){ FD.rc[c.parent_id] = (FD.rc[c.parent_id] || 0) + 1; });
      s.rows = rows; s.loaded = true; s.err = '';
    });
  }).catch(function(e){ try{ console.error(e); }catch(x){} s.err = feedErrMsg(e); s.loaded = true; }).then(function(){ s.busy = false; ppPaint(); });

function ulFetch(p, force){
  if(!p || !p.id || !sbc) return Promise.resolve();
  var s = UL[p.id] = UL[p.id] || {state:'loading', cats:[], items:[]};
  if(s.busy) return Promise.resolve();
  if(!force && s.state === 'ok' && s.t && Date.now() - s.t < 60000) return Promise.resolve();
  s.busy = true;
  return Promise.all([
    pageAll(function(){ return sbc.from('items').select('id,cat,name,img,rating,note,status,watched,added').eq('user_id', p.id).eq('status', 'done').order('id'); }),
    sbc.from('cats').select('id,name,icon,img,source,pos').eq('user_id', p.id).order('pos').order('id')
  ]).then(function(r){
    if(r[1].error) throw r[1].error;
    s.items = r[0].map(function(i){ return {id:i.id, cat:i.cat, name:i.name, img:i.img || '', rating:+i.rating, note:i.note || '', status:'done', date:i.watched || '', added:+i.added || 0}; });
    s.cats = r[1].data.map(function(c){ var o = {id:c.id, name:c.name, icon:c.icon || 'star', source:c.source}; if(c.img) o.img = c.img; return o; })
      .filter(function(c){ return s.items.some(function(i){ return i.cat === c.id; }); });
    if(!s.cats.some(function(c){ return c.id === UC[p.id]; })) UC[p.id] = s.cats[0] ? s.cats[0].id : '';
    s.state = 'ok'; s.t = Date.now();
    return sbc.from('profiles').select('taste_picks').eq('id', p.id).maybeSingle().then(function(q){
      try{ s.picks = (q && q.data && q.data.taste_picks) ? JSON.parse(q.data.taste_picks) : {}; }catch(x){ s.picks = {}; }
    }, function(){ s.picks = {}; });
  }).catch(function(e){ try{ console.error(e); }catch(x){} if(s.state !== 'ok') s.state = 'err'; }).then(function(){ s.busy = false; ulPaint(); });
}

function recRR(lists, lim, add){
  var n = 0, mx = 0; lists.forEach(function(l){ mx = Math.max(mx, l.a.length); });
  for(var i = 0; i < mx && n < lim; i++) lists.forEach(function(l){ if(n < lim && l.a[i] && add(l.c, l.a[i])) n++; });

function recAssemble(res){
  var seen = {}, mine = [];
  function addMine(c, r){
    var nt = normT(r.title), k = c.id + '|' + nt; if(!nt || seen[k]) return false;
    seen[k] = 1; mine.push({title:r.title, sub:r.sub || '', img:r.img || '', cid:c.id}); return true;
  }
  var by = res.slice().sort(function(a, b){ return recNDone(b.c) - recNDone(a.c); });
  recRR(by.filter(function(x){ return x.taste.length; }).map(function(x){ return {c:x.c, a:x.taste}; }), 20, addMine);
  if(mine.length < 20) recRR(by.map(function(x){ return {c:x.c, a:shuf(x.alt.concat(x.extra))}; }), 20 - mine.length, addMine);
  var secs = [];
  if(mine.length >= 5) secs.push({k:'mine', items:mine});
  res.slice().sort(function(a, b){ return MAIN_IDS.indexOf(a.c.id) - MAIN_IDS.indexOf(b.c.id); }).forEach(function(x){
    var cand = shuf(x.taste.concat(x.alt, x.extra)), n = 5 + Math.floor(Math.random() * 6), out = [], loc = {};
    function pick(skipSeen){
      cand.forEach(function(r){
        var nt = normT(r.title), k = x.c.id + '|' + nt;
        if(out.length >= n || !nt || loc[k] || (skipSeen && seen[k])) return;
        loc[k] = 1; out.push({title:r.title, sub:r.sub || '', img:r.img || ''});
      });
    }
    pick(true); if(out.length < 5) pick(false);
    if(out.length >= 3) secs.push({k:'c', id:x.c.id, items:out});
  });

}
function recBuild(slot, key){
  var cats = recCats(), my = ++REC.seq; REC.busy = true;
  var jobs = cats.map(function(c){
    var seeds = recSeeds(c);
    var tp = seeds.length ? withTimeout(recFor(c, seeds), 25000).then(function(r){ return r.seed ? {taste:r.list, extra:[]} : {taste:[], extra:r.list}; }).catch(function(){ return {taste:[], extra:[]}; }) : Promise.resolve({taste:[], extra:[]});
    var ap = withTimeout(recAlt(c), 25000).then(function(r){ return r.list || []; }).catch(function(){ return []; });
    return Promise.all([tp, ap]).then(function(x){ return {c:c, taste:x[0].taste, extra:x[0].extra, alt:x[1]}; });
  });
  recPaint();
  Promise.all(jobs).then(function(res){
    if(my !== REC.seq) return;
    REC.busy = false;
    var secs = recAssemble(res);
    if(!secs.length){ REC.fail = Date.now(); recPaint(); return; }
    REC.secs = secs; REC.slot = slot; REC.key = key; REC.fail = 0;
    try{ localStorage.setItem(key, JSON.stringify({slot:slot, secs:secs})); }catch(x){}
    recPaint();
  }).catch(function(){ if(my === REC.seq){ REC.busy = false; REC.fail = Date.now(); recPaint(); } });
}
/* تتجدد الاقتراحات تلقائياً مرتين في اليوم (قبل الظهر وبعده) */
function recLoad(force){
  if(REC.busy && !force) return;
  var cats = recCats(), key = recKey(), slot = recSlot();
  if(!cats.length){ REC.none = true; REC.secs = []; REC.busy = false; recPaint(); return; }
  REC.none = false;
  if(REC.key !== key){ REC.secs = []; REC.slot = ''; REC.key = key; REC.fail = 0; }
  if(!REC.secs.length){
    try{
      var c0 = JSON.parse(localStorage.getItem(key) || 'null');
      if(c0 && c0.secs && c0.secs.length){ REC.secs = c0.secs; REC.slot = c0.slot || ''; recPaint(); }
    }catch(x){}
  }
  if(!force && REC.secs.length && REC.slot === slot) return;
  if(!force && REC.fail && Date.now() - REC.fail < 120000) return;
  recBuild(slot, key);
}

function cmpAnimate(){
  var root = $('#cx'); if(!root) return;
  var run = ++CMPV.run, red = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  [].forEach.call(root.querySelectorAll('[data-to]'), function(el){
    var to = +el.dataset.to, dur = +el.dataset.dur || 1200, dl = +el.dataset.delay || 0;
    if(red || !to){ el.textContent = String(to); return; }
    setTimeout(function(){
      if(run !== CMPV.run) return;
      var t0 = performance.now();
      (function step(now){
        if(run !== CMPV.run || !document.body.contains(el)) return;
        var k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
        el.textContent = String(Math.round(to * e));
        if(k < 1) requestAnimationFrame(step);
      })(t0);
    }, dl);
  });
  [].forEach.call(root.querySelectorAll('.cx-row'), function(row){
    var d = red ? 0 : +row.dataset.d || 0;
    setTimeout(function(){
      if(run !== CMPV.run) return;
      row.classList.add('go');
      [].forEach.call(row.querySelectorAll('[data-w]'), function(i){ setTimeout(function(){ if(run === CMPV.run) i.style.width = i.dataset.w + '%'; }, red ? 0 : 120); });
    }, d);
  });

var FP_VAPID = 'PASTE_YOUR_VAPID_PUBLIC_KEY';
function fpPushFlag(){ try{ return localStorage.getItem('idk-push') === '1'; }catch(e){ return false; } }
function fpPushSet(v){ try{ if(v) localStorage.setItem('idk-push', '1'); else localStorage.removeItem('idk-push'); }catch(e){} }
function fpB64(s){ var p = '='.repeat((4 - s.length % 4) % 4), r = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')), o = new Uint8Array(r.length); for(var i = 0; i < r.length; i++) o[i] = r.charCodeAt(i); return o; }
function fpPushOn(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return Promise.reject('unsupported');
  if(FP_VAPID.indexOf('PASTE') === 0) return Promise.reject('nokey');
  return Notification.requestPermission().then(function(p){ if(p !== 'granted') throw 'denied'; return navigator.serviceWorker.ready; })
    .then(function(reg){ return reg.pushManager.getSubscription().then(function(s){ return s || reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:fpB64(FP_VAPID)}); }); })
    .then(function(sub){ var j = sub.toJSON(); return sbc.rpc('save_push_subscription', {p_endpoint:j.endpoint, p_p256dh:j.keys.p256dh, p_auth:j.keys.auth}); })
    .then(function(r){ if(r && r.error) throw r.error; fpPushSet(true); });
}
function fpPushOff(){
  return navigator.serviceWorker.ready.then(function(reg){ return reg.pushManager.getSubscription(); }).then(function(s){
    if(!s) return; var ep = s.endpoint;
    return s.unsubscribe().then(function(){ return sbc.from('push_subscriptions').delete().eq('endpoint', ep); });
  }).then(function(){ fpPushSet(false); });
}

  if(!PTR.el){ var d = document.createElement('div'); d.id = 'ptr'; d.setAttribute('aria-hidden', 'true'); d.innerHTML = '<span class="ptr-c"><i></i><i></i><i></i></span>'; document.body.appendChild(d); PTR.el = d; }
  return PTR.el;
}
function waitDone(fn, ms){
  return new Promise(function(res){ var t0 = Date.now(); (function tick(){ if(!fn() || Date.now() - t0 > ms) res(); else setTimeout(tick, 150); })(); });
}
function ptrJob(){
  if(!CL.uid || !sbc) return null;
  if(view === 'feed') return function(){ FD.fresh = 0; return feedFetch(); };
  if(view === 'post') return FD.openId ? function(){ return loadReplies(FD.openId); } : null;
  if(view === 'home') return function(){ REC.fail = 0; recLoad(true); return waitDone(function(){ return REC.busy; }, 15000); };
  if(view === 'profile') return function(){ return Promise.all([loadPeople().catch(function(){}), ppFetch(CL.uid, true)]).then(function(){ if(view === 'profile' && !$('#layer').innerHTML) render(); }); };
  if(view === 'user') return function(){ var up = person(userView); if(!up) return null; return Promise.all([ulFetch(up, true), ppFetch(up.id, true)]); };
  if(view === 'compare') return function(){ var cp = person(CMPV.u); if(!cp) return null; return ulFetch(cp, true).then(function(){ if(view === 'compare') render(); }); };
  if(view === 'chats') return function(){ return reloadChats().then(function(){ if(view === 'chats' && !$('#layer').innerHTML) render(); }); };
  if(view === 'notifs') return function(){ return ntFetch(); };
  if(view === 'toplists') return function(){ return tlFetch(true); };
  if(view === 'sources') return function(){ return Promise.resolve(srcFetch()); };
  return null;
}
function ptrTop(){ return window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0; }
function ptrSet(pull, anim){
  var el = ptrEl();
  el.style.transition = anim ? 'transform .28s var(--ease),opacity .28s' : 'none';
  el.style.transform = 'translateY(' + (pull - 30) + 'px)';
  el.style.opacity = Math.min(1, pull / 30);
  el.style.setProperty('--pf', Math.min(1, pull / PTR_AT).toFixed(3));
}
function ptrRun(){
  var job = ptrJob(); if(!job){ ptrSet(0, true); return; }
  PTR.busy = true; var el = ptrEl(); el.classList.add('ld'); ptrSet(PTR_HOLD, true);
  try{ if(navigator.vibrate) navigator.vibrate(8); }catch(x){}
  var p; try{ p = Promise.resolve(job()); }catch(x){ p = Promise.resolve(); }
  var min = new Promise(function(r){ setTimeout(r, 900); }), cap = new Promise(function(r){ setTimeout(r, 20000); });
  Promise.all([Promise.race([p.catch(function(){}), cap]), min]).then(function(){
    PTR.busy = false; ptrSet(0, true);
    setTimeout(function(){ if(!PTR.busy) el.classList.remove('ld'); }, 300);
  });
}
document.addEventListener('touchstart', function(e){
  PTR.on = false; PTR.ok = false;
  if(PTR.busy || e.touches.length !== 1 || ptrTop() > 0) return;
  var lay = document.getElementById('layer'); if(lay && lay.innerHTML) return;
  var tg = e.target; if(tg && tg.closest && tg.closest('input,textarea,select,.msgs,.sheet,.ov,.cbar,[contenteditable]')) return;
  if(!ptrJob()) return;
  PTR.y = e.touches[0].clientY; PTR.x = e.touches[0].clientX; PTR.pull = 0; PTR.ok = true;
}, {passive:true});
document.addEventListener('touchmove', function(e){
  if(!PTR.ok) return;
  var t = e.touches[0], dy = t.clientY - PTR.y, dx = t.clientX - PTR.x;
  if(!PTR.on){
    if(dy < -4 || ptrTop() > 0 || (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * .8)){ PTR.ok = false; return; }
    if(dy < 12) return;
    PTR.on = true;
  }
  if(e.cancelable) e.preventDefault();
  PTR.pull = Math.max(0, Math.min(110, (dy - 10) * .55));
  ptrSet(PTR.pull, false);
}, {passive:false});
function ptrEnd(){
  if(!PTR.on){ PTR.ok = false; return; }
  PTR.on = false; PTR.ok = false; PTR.supp = Date.now();   // كان سحباً حقيقياً: لا نسمح بأن يتحوّل إلى ضغطة
  if(PTR.pull >= PTR_AT) ptrRun(); else ptrSet(0, true);
}
document.addEventListener('click', function(e){
  if(PTR.supp && Date.now() - PTR.supp < 450){ PTR.supp = 0; e.stopImmediatePropagation(); e.preventDefault(); }
}, true);
document.addEventListener('touchend', ptrEnd, {passive:true});
document.addEventListener('touchcancel', ptrEnd, {passive:true});

function lxProbe(){

function lxApply(){
  if(!CL.lx) return Promise.resolve();
  // نعيد استخدام صفوف القوائم التي جُلبت للتو (select *) بدل طلب شبكة إضافي
  var _rl = CL.rawLists; CL.rawLists = null;
  var _src = (_rl && (!_rl.length || ('visibility' in _rl[0]))) ? Promise.resolve(_rl) : pageAll(function(){ return sbc.from('lists').select('id,visibility,pin').eq('user_id', CL.uid).order('id'); });

    var m = {}; rows.forEach(function(r){ m[r.id] = r; });
    state.lists.forEach(function(l){ var r = m[l.id]; l.vis = r ? r.visibility : (l.vis || 'private'); });
    var pins = rows.filter(function(r){ return +r.pin > 0; }).sort(function(a, b){ return a.pin - b.pin; }).map(function(r){ return r.id; });
    if(pins.length) state.pins = pins;
    var diff = false;
    if(CL.snap){
      rowsOf().lists.forEach(function(r){
        var sv = m[r.id]; if(!sv || CL.snap.lists[r.id] === undefined) return;
        var srv = Object.assign({}, r, {visibility:sv.visibility, pin:+sv.pin || 0});
        CL.snap.lists[r.id] = JSON.stringify(srv);
        if(JSON.stringify(r) !== CL.snap.lists[r.id]) diff = true;
      });
    }
    if(diff) setTimeout(function(){ try{ syncNow(); }catch(e){} }, 2000);
  }).catch(function(){});
}
var _rowsOf = rowsOf;
rowsOf = function(){
  var r = _rowsOf();
  if(CL.lx){
    var pins = pinIds();
    r.lists.forEach(function(row, i){ var l = state.lists[i]; row.visibility = VIS.indexOf(l.vis) > -1 ? l.vis : 'private'; row.pin = pins.indexOf(l.id) + 1; });

var _pullAll = pullAll;

pullAll = function(local){
  // فحص الأعمدة الاختيارية يستغرق طلبين شبكة في كل دخول؛ نحفظ نتيجته على الجهاز ونتحقق منها بالخلفية فقط

function unCheck(u){
  if(!/^[a-z0-9_.]{2,32}$/.test(u)) return L('اسم المستخدم من 2 إلى 32 حرفاً: أحرف إنجليزية صغيرة وأرقام و _ و . فقط', 'Username: 2 to 32 characters, lowercase English letters, numbers, _ and . only');
  if(/\.\./.test(u)) return L('لا يمكن استخدام نقطتين متتاليتين', 'No two periods in a row');
  if(/^\.|\.$/.test(u)) return L('لا يمكن أن يبدأ اسم المستخدم أو ينتهي بنقطة', 'Cannot start or end with a period');
  if(UN_RES.indexOf(u) > -1 && !isOwnerMe()) return L('هذا الاسم محجوز', 'This username is reserved');
  return '';
}
function unErr(e){
  var m = (e && (e.message || e.details || e.code)) || '';

/* ----- أدوات الفترات والإحصاءات ----- */
function isoLocal(d){ return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function itDate(i){ return i.date || (i.added ? isoLocal(new Date(i.added)) : ''); }
function doneOnly(items){ return items.filter(function(i){ return !i.status || i.status === 'done'; }); }
function inPeriod(i, k){
  var d = itDate(i); if(!d) return false;
  var n = new Date(), t = isoLocal(n);
  if(k === 'year') return d.slice(0, 4) === t.slice(0, 4);
  if(k === 'month') return d.slice(0, 7) === t.slice(0, 7);
  return d >= isoLocal(new Date(n.getFullYear(), n.getMonth(), n.getDate() - 6)) && d <= t;
}
function perLabel(k){ return k === 'week' ? L('هذا الأسبوع', 'This week') : k === 'month' ? L('هذا الشهر', 'This month') : L('هذه السنة', 'This year'); }
function distHTML(done, title){
  if(!done.length) return '';
  var b = [], k; for(k = 0; k < 11; k++) b.push(0);
  done.forEach(function(i){ b[Math.min(10, Math.max(0, Math.floor(i.rating)))]++; });
  var mx = Math.max.apply(null, b) || 1;
  return '<div class="cs"><h3>' + title + '</h3><p>' + L('عدد العناصر في كل درجة.', 'Items per rating.') + '</p><div class="hist">' + b.map(function(n, i){
    return '<div class="hb"><div class="col"><div class="bar" style="height:' + Math.round(n / mx * 100) + '%" title="' + n + '"></div></div><span>' + i + '</span></div>';
  }).join('') + '</div></div>';
}
function moreHTML(items, nItems, nCats, own, u){
  var done = doneOnly(items), sum = 0; done.forEach(function(i){ sum += +i.rating || 0; });
  var box = function(n, lab, act, extra){
    return act ? '<button class="st" data-act="' + act + '" ' + extra + '><b>' + n + '</b><span class="go">' + lab + chevI(13) + '</span></button>' : '<div class="st"><b>' + n + '</b><span>' + lab + '</span></div>';
  };
  var r1 = box(nItems, L('عنصر', 'Items'), own ? 'coll-open' : '', 'data-m="items"') + box(nCats, L('تصنيف', 'Categories'), own ? 'coll-open' : '', 'data-m="cats"') +
    box(done.length ? fmt(sum / done.length) : '–', L('المتوسط', 'Average'), '', '');
  var r2 = ['week', 'month', 'year'].map(function(k){
    return box(done.filter(function(i){ return inPeriod(i, k); }).length, perLabel(k), 'open-period', 'data-k="' + k + '" data-u="' + esc(u || '') + '"');
  }).join('');
  return '<div class="stats in">' + r1 + '</div><div class="stats in" style="margin-top:8px">' + r2 + '</div>' + distHTML(done, own ? L('توزيع تقييماتك', 'Your rating distribution') : L('توزيع التقييمات', 'Rating distribution'));
}
function moreRow(act){ return '<button class="mr" data-act="' + act + '"><span>' + L('المزيد', 'More') + '</span>' + chevI(18) + '</button>'; }
function viewMore(){ var dn = doneOnly(state.items); return subHead(L('المزيد', 'More')) + moreHTML(state.items, dn.length, state.cats.filter(function(c){ return dn.some(function(i){ return i.cat === c.id; }); }).length, true, ''); }
function viewUMore(){

  if(!p || !s || s.state !== 'ok') return h + pLoad();

}
function viewPeriod(){

  if(own){ items = state.items; act = 'edit'; cn = function(i){ return (catById(i.cat) || {}).name || ''; }; }

    : LAYOUT !== 'list' ? gridHTML(arr, act) : '<div class="list">' + arr.map(function(i){ return rowHTML(i, 0, cn(i), act); }).join('') + '</div>';

function trItemsFor(k){ return state.items.filter(function(i){ return isDone(i) && (CMP_MAP[i.cat] || i.cat) === k; }).sort(function(a, b){ return (+b.rating || 0) - (+a.rating || 0) || String(a.name).localeCompare(String(b.name)); }); }
function trPickListHTML(k){

    var n = sel.indexOf(i.id);

      '<span class="tx"><span class="nm" dir="auto">' + esc(i.name) + '</span><span class="sub">' + fmt(i.rating) + '</span></span>' +
      (n > -1 ? '<span class="tk t' + (n + 1) + ' tr-n">' + (n + 1) + '</span>' : '') + '</button>';
  }).join('');
}
function trPickSheet(k){
  var m = MAINS.filter(function(x){ return x[0] === k; })[0]; if(!m) return;
  openSheetB('<h3>' + esc(trName(m[1])) + '</h3><p class="note" style="margin:0 0 10px">' + L('اختر حتى ثلاثة أعمال. الترتيب حسب ترتيب اختيارك.', 'Pick up to three. Rank follows the order you tap.') + '</p>' +

  if(sc){ CL.sx = !!sc.sx; CL.sv = !!sc.sv; sxProbe().then(sxSave, function(){}); probe = Promise.resolve(); }
  else probe = sxProbe().then(sxSave, function(){});
  return probe.then(function(){ return _pullAll19(local); }).then(function(r){

    try{ srcFix(); }catch(e){}

  });
};

/* ===== بروفايل جديد: بنر بعرض الشاشة + صورة + اسم + عدّادات في سطر واحد + تبويبات جزء من الصفحة + صفحة مستقلة للمتابعين ===== */
var FLV = {k:'followers', u:null};
function phCnt(a){
  return '<div class="phx-cnt">' + a.map(function(x){
    return '<button class="phx-c" data-act="' + x.act + '"' + (x.k ? ' data-k="' + x.k + '"' : '') + (x.u ? ' data-u="' + esc(x.u) + '"' : '') + (x.m ? ' data-m="' + x.m + '"' : '') + '><b>' + x.n + '</b><span>' + x.l + '</span></button>';
  }).join('<i aria-hidden="true">·</i>') + '</div>';
}
function phHero(o){
  var bsrc = o.banner ? imgSafe(String(o.banner).replace(/#(?:sm|r[\d.]+)$/, '')) : '';
  return '<div class="phx' + (bsrc ? '' : ' nobn') + '"><div class="phx-bn">' + (bsrc ? '<img' + (bnRatio(o.banner) ? ' class="rt" style="--r:' + bnRatio(o.banner) + '"' : '') + ' src="' + esc(bsrc) + '" alt="" decoding="async" onerror="this.style.display=\'none\'">' : '') + '</div>' +
    '<div class="phx-top"><button class="phx-b bk" data-act="' + o.back + '" aria-label="' + L('رجوع', 'Back') + '">' + svg('back', 22, 2) + '</button>' + (o.menu || '') + '</div>' +
    '<div class="phx-in"><div class="phx-av">' + o.av + '</div>' +
    '<div class="phx-nm" dir="auto">' + (esc(o.name) || '&nbsp;') + '</div>' +
    '<div class="phx-un">' + o.sub + '</div>' + (o.bio || '') + phCnt(o.cnt) +
    '<div class="phx-acts">' + o.acts + '</div></div></div>';
}
profileCard = function(p, av){
  var sub = (p.username ? '<span dir="ltr">@' + esc(p.username) + '</span>' : '') + (PRIV2[p.privacy] && p.privacy !== 'public' ? '<span class="ppill">' + PRIV2[p.privacy] + '</span>' : '');
  return phHero({banner:p.banner, av:av, name:p.name, sub:sub, bio:bioHTML(p), back:'page-back',
    cnt:[{act:'fl-open', k:'followers', n:followers().length, l:L('متابعون', 'Followers')}, {act:'fl-open', k:'following', n:me().following.length, l:L('يتابع', 'Following')}, {act:'coll-open', m:'items', n:state.items.length, l:L('عنصر', 'Items')}],
    acts:'<button class="btn line" data-act="edit-prof">' + L('تعديل الملف الشخصي', 'Edit profile') + '</button>'});
};
viewUser = function(){
  var p = state.people.find(function(x){ return x.username === userView; });
  if(!p){ view = userBack || 'chats'; return view === 'profile' ? viewProfile() : view === 'chat' ? viewChat() : viewChats(); }
  var u = p.username, fl = iFollow(u), nF = state.people.filter(function(x){ return (x.following || []).indexOf(u) > -1; }).length + (fl ? 1 : 0);
  if(PT.user === 'cmp') PT.user = 'lib'; var blk = isBlocked(u), s = UL[p.id];
  var body = blk ? '<div class="empty" style="margin-top:12px"><b>' + L('لقد حظرت هذا المستخدم', 'You blocked this user') + '</b>' + L('محتواه مخفي عنك.', 'Their content is hidden from you.') + '</div>'
    : PT.user === 'posts' ? '<div id="prof-posts">' + ppHTML(p.id) + '</div>'
    : canSee(p) ? '<div id="ulib">' + ulibHTML(p) + '</div>'
    : '<div class="empty" style="margin-top:12px"><b>' + (p.privacy === 'friends' ? 'حساب للأصدقاء فقط' : 'حساب خاص') + '</b>' + (p.privacy === 'friends' ? 'يظهر المحتوى لمن يتابع كل منكما الآخر.' : 'المحتوى غير متاح.') + '</div>';
  var nI = !canSee(p) || blk ? '—' : (s && s.state === 'ok' ? s.items.length : '…');
  var sub = '<span dir="ltr">@' + esc(u) + '</span>' + (p.privacy !== 'public' && PRIV2[p.privacy] ? '<span class="ppill">' + PRIV2[p.privacy] + '</span>' : '');
  var av = '<div class="av" style="' + (p.avatar ? bgUrl(p.avatar) : '') + '">' + (p.avatar ? '' : esc((Array.from(p.name || u)[0] || '?').toUpperCase())) + '</div>';
  var menu = '<button class="phx-b" data-act="user-menu" data-u="' + esc(u) + '" aria-label="' + L('المزيد', 'More') + '">' + svg('dots', 22, 2.4) + '</button>';
  var acts = blk ? '<button class="btn ghost" data-act="unblock" data-u="' + esc(u) + '">' + L('إلغاء الحظر', 'Unblock') + '</button>'
    : '<button class="btn' + (fl ? ' ghost' : '') + '" data-act="follow" data-u="' + esc(u) + '">' + (fl ? 'إلغاء المتابعة' : 'متابعة') + '</button>';
  return phHero({banner:p.banner, av:av, name:p.name || u, sub:sub, bio:bioHTML(p), back:'user-back', menu:menu,
    cnt:[{act:'fl-open', k:'followers', u:u, n:nF, l:L('متابعون', 'Followers')}, {act:'fl-open', k:'following', u:u, n:(p.following || []).length, l:L('يتابع', 'Following')}, {act:'fl-open', k:'items', u:u, n:nI, l:L('عنصر', 'Items')}],
    acts:acts}) +
    (blk ? '' : ptabsHTML('user')) + body +
    '<div class="acts" style="margin-top:14px"><button class="btn danger" data-act="rm-user" data-u="' + esc(u) + '">حذف المستخدم</button></div>';
};
/* ----- صفحة المتابعون / يتابع / العناصر (مستقلة وليست نافذة منبثقة) ----- */
function flRows(k, u){
  var m = me(), meRow = function(){ return userRow(m).replace('data-act="open-user"', 'data-act="nav" data-v="profile"'); };
  if(!u){
    var ls = k === 'followers' ? followers() : state.people.filter(function(x){ return iFollow(x.username); });
    return ls.map(userRow);
  }
  var p = person(u); if(!p) return [];
  if(k === 'followers'){
    var r = state.people.filter(function(x){ return (x.following || []).indexOf(u) > -1; }).map(userRow);
    if(iFollow(u)) r.unshift(meRow());
    return r;
  }
  return (p.following || []).map(function(x){ return x === m.username ? meRow() : (person(x) ? userRow(person(x)) : ''); }).filter(Boolean);
}
function viewFl(){
  var u = FLV.u, own = !u, p = own ? null : person(u);
  if(!own && !p) return subHead('') + '<div class="empty"><b>' + L('المستخدم غير موجود', 'User not found') + '</b></div>';
  var k = FLV.k; if(own && k === 'items') k = FLV.k = 'followers';
  var nm = own ? (me().name || me().username || '') : (p.name || p.username);
  var s = p && UL[p.id];
  var counts = {followers: flRows('followers', u).length, following: flRows('following', u).length, items: s && s.state === 'ok' ? s.items.length : ''};
  var tabs = [['followers', L('المتابعون', 'Followers')], ['following', L('يتابع', 'Following')]].concat(own ? [] : [['items', L('العناصر', 'Items')]]);
  var th = '<div class="ptabs fltabs" role="tablist" style="grid-template-columns:repeat(' + tabs.length + ',minmax(0,1fr))">' + tabs.map(function(t){
    var on = k === t[0];
    return '<button role="tab" aria-selected="' + on + '" class="' + (on ? 'on' : '') + '" data-act="fl-tab" data-k="' + t[0] + '"><span>' + t[1] + '</span><small>' + counts[t[0]] + '</small></button>';
  }).join('') + '</div>';
  var body;
  if(k === 'items'){
    if(!canSee(p) || isBlocked(u)) body = '<div class="empty"><b>' + L('المحتوى غير متاح', 'Content not available') + '</b></div>';
    else if(!s || s.state !== 'ok') body = pLoad();
    else{
      var arr = doneOnly(s.items).slice().sort(function(a, b){ return (+b.added || 0) - (+a.added || 0); });
      var cn = function(i){ var c = s.cats.filter(function(x){ return x.id === i.cat; })[0]; return c ? c.name : ''; };
      body = !arr.length ? '<div class="empty"><b>' + L('لا توجد عناصر', 'No items') + '</b></div>' : LAYOUT !== 'list' ? gridHTML(arr, 'uview') : '<div class="list">' + arr.map(function(i){ return rowHTML(i, 0, cn(i), 'uview'); }).join('') + '</div>';
    }
  }else{
    var rows = flRows(k, u);
    body = rows.length ? '<div class="fl-list">' + rows.join('') + '</div>' : '<div class="srmsg">' + L('لا أحد هنا بعد', 'Nobody here yet') + '</div>';
  }
  return subHead(esc(nm), '', true) + th + body;
}
document.addEventListener('click', function(e){
  var t = e.target.closest && e.target.closest('[data-act="fl-open"],[data-act="fl-tab"]'); if(!t) return;
  e.stopPropagation();
  if(t.dataset.act === 'fl-open'){ FLV = {k:t.dataset.k, u:t.dataset.u || null}; if(FLV.u) ulFetch(person(FLV.u)); goSub('fl'); }
  else{ FLV.k = t.dataset.k; render(); }

<script>
/* شريط الرئيسية: يتحوّل تدريجياً إلى زجاج عند التمرير */
(function(){
  var el = null, raf = 0, last = -1;
  function upd(){
    raf = 0;
    if(!el || !el.isConnected){ el = document.querySelector('.pg-h.tb'); last = -1; }
    if(!el) return;
    var y = window.pageYOffset || document.documentElement.scrollTop || 0;
    var p = Math.max(0, Math.min(1, (y - 6) / 54)); p = Math.round(p * 100) / 100;
    if(p !== last){ el.style.setProperty('--tbp', p); el.classList.toggle('tb0', p === 0); last = p; }
  }
  function kick(){ if(!raf) raf = requestAnimationFrame(upd); }
  window.addEventListener('scroll', kick, {passive:true});
  window.addEventListener('resize', kick, {passive:true});
  var app = document.getElementById('app');
  if(app && window.MutationObserver) new MutationObserver(function(){ el = null; kick(); }).observe(app, {childList:true});
  kick();
})();
</script>
